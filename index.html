<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Interruptor de Luz</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover {
            transform: scale(1.1);
        }
        #settings-button:active {
            transform: scale(0.95);
        }
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible {
            display: block;
        }
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 10px;
        }
        #settings-panel label:last-child {
            margin-bottom: 0;
        }
        #settings-panel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            #settings-button {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            #settings-panel {
                top: 60px;
                right: 10px;
                padding: 12px 15px;
                font-size: 13px;
                min-width: 180px;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #light-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="settings-button">⚙️</div>
    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Detectar móvil ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // --- Variables globales ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
        document.body.appendChild(renderer.domElement);

        // Controles
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        // En móvil, aumentamos el rango de giro horizontal
        controls.minAzimuthAngle = isMobile ? -Math.PI / 3 : -Math.PI / 6; // ±60° en móvil, ±30° en PC
        controls.maxAzimuthAngle = isMobile ? Math.PI / 3 : Math.PI / 6;
        controls.minDistance = 4;
        controls.maxDistance = isMobile ? 20 : 30;
        controls.target.set(0, 2, 0);

        // --- LUZ ÚNICA: SPOTLIGHT (foco) ---
        const spotLight = new THREE.SpotLight(0xffffff, 1.5);
        spotLight.position.set(0, 8, 2); // Colocamos el foco en una posición que ilumine bien
        spotLight.target.position.set(0, 1, 0);
        scene.add(spotLight.target);
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        spotLight.angle = 0.8;
        spotLight.penumbra = 0.3;
        spotLight.decay = 1;
        spotLight.distance = 20;
        scene.add(spotLight);

        // Variable de estado de la luz
        let lightOn = true; // Por defecto encendida

        // Función para actualizar la luz y el texto
        function setLightState(on) {
            lightOn = on;
            spotLight.visible = lightOn;
            document.getElementById('light-status').textContent = lightOn ? '💡 Luz encendida' : '💡 Luz apagada';
            localStorage.setItem('lightState', lightOn ? 'on' : 'off');
        }

        // Cargar estado guardado
        const savedLight = localStorage.getItem('lightState');
        if (savedLight === 'off') {
            setLightState(false);
        } else {
            setLightState(true); // por defecto on
        }

        // --- Variables para el modo de calidad (ahora solo afecta a otros aspectos, no a la luz principal) ---
        let currentLights = [spotLight, spotLight.target]; // Solo para mantener consistencia

        function setupHighQuality() {
            // En alta calidad, podemos tener más detalles, pero la luz es la misma
            // Por ahora solo ajustamos el renderer y controles
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
            controls.enableDamping = true;
            controls.maxDistance = isMobile ? 20 : 30;
            document.getElementById('quality-indicator').textContent = 'Calidad Alta';
        }

        function setupLowQuality() {
            // Modo humilde: sin sombras, menos resolución, sin damping
            renderer.shadowMap.enabled = false;
            renderer.setPixelRatio(1);
            controls.enableDamping = false;
            controls.maxDistance = isMobile ? 15 : 18;
            document.getElementById('quality-indicator').textContent = 'Modo humilde';
        }

        // Detectar móvil y activar modo humilde por defecto si es móvil
        if (isMobile) {
            setupLowQuality();
            document.getElementById('performance-mode').checked = true;
        } else {
            setupHighQuality();
            document.getElementById('performance-mode').checked = false;
        }

        // --- Evento del checkbox de modo humilde ---
        const perfCheck = document.getElementById('performance-mode');
        perfCheck.addEventListener('change', (e) => {
            if (e.target.checked) {
                setupLowQuality();
            } else {
                setupHighQuality();
            }
            localStorage.setItem('qualityMode', e.target.checked ? 'low' : 'high');
        });

        // Cargar modo guardado
        const savedQuality = localStorage.getItem('qualityMode');
        if (savedQuality === 'low') {
            setupLowQuality();
            perfCheck.checked = true;
        } else if (savedQuality === 'high') {
            setupHighQuality();
            perfCheck.checked = false;
        }

        // --- Mostrar/ocultar panel de configuración ---
        const settingsButton = document.getElementById('settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        settingsButton.addEventListener('click', () => {
            settingsPanel.classList.toggle('visible');
        });
        document.addEventListener('click', (e) => {
            if (!settingsButton.contains(e.target) && !settingsPanel.contains(e.target)) {
                settingsPanel.classList.remove('visible');
            }
        });

        // --- Cargador de modelos con detección del interruptor ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según tu lista
        let interruptorModel = null; // Referencia al modelo del interruptor

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    
                    // Configurar sombras según modo actual
                    const shadowsOn = renderer.shadowMap.enabled;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = shadowsOn;
                            node.receiveShadow = shadowsOn;
                        }
                    });

                    scene.add(model);
                    
                    // Si es el modelo del interruptor, guardamos referencia y añadimos interactividad
                    if (path.includes('interruptor.glb')) {
                        interruptorModel = model;
                        // Buscar el primer mesh para asignarle eventos (o todo el modelo)
                        // Recorremos para encontrar un mesh y asignarle un nombre si no tiene
                        model.traverse((node) => {
                            if (node.isMesh) {
                                // Guardamos el mesh para eventos
                                // Añadimos propiedades para interacción
                                node.userData.isInterruptor = true;
                            }
                        });
                    }

                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {},
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        // Lista de modelos (ajústala a tus archivos)
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Raycaster para detectar clics en el interruptor ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseClick(event) {
            // Calcular posición del mouse en coordenadas normalizadas
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Buscar objetos intersectados que sean del interruptor
            const intersects = raycaster.intersectObjects(scene.children, true); // recursivo
            for (let intersect of intersects) {
                let obj = intersect.object;
                // Subir hasta encontrar el modelo del interruptor o un objeto marcado
                while (obj) {
                    if (obj.userData && obj.userData.isInterruptor) {
                        // Encontramos el interruptor
                        setLightState(!lightOn); // Alternar luz
                        return;
                    }
                    obj = obj.parent;
                }
            }
        }

        // Efecto de brillo al pasar el mouse
        function onMouseMove(event) {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            let hovered = false;
            for (let intersect of intersects) {
                let obj = intersect.object;
                while (obj) {
                    if (obj.userData && obj.userData.isInterruptor) {
                        hovered = true;
                        // Cambiar emisión del material
                        if (obj.material) {
                            if (Array.isArray(obj.material)) {
                                obj.material.forEach(mat => {
                                    if (mat.emissive) {
                                        mat.emissive.setHex(0x444444); // Brillo suave
                                    }
                                });
                            } else if (obj.material.emissive) {
                                obj.material.emissive.setHex(0x444444);
                            }
                        }
                        break;
                    }
                    obj = obj.parent;
                }
            }

            // Restaurar emisión si no está hovered
            // Para simplificar, recorremos todos los objetos del interruptor y restauramos
            if (!hovered && interruptorModel) {
                interruptorModel.traverse(node => {
                    if (node.isMesh && node.material) {
                        if (Array.isArray(node.material)) {
                            node.material.forEach(mat => {
                                if (mat.emissive) {
                                    mat.emissive.setHex(0x000000);
                                }
                            });
                        } else if (node.material.emissive) {
                            node.material.emissive.setHex(0x000000);
                        }
                    }
                });
            }
        }

        // Añadir event listeners
        renderer.domElement.addEventListener('click', onMouseClick);
        renderer.domElement.addEventListener('mousemove', onMouseMove);
        // Para móvil: touch events
        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            onMouseClick(touch);
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            onMouseMove(touch);
        });

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir scroll táctil ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página cargada. Haz clic en el interruptor para encender/apagar la luz.');
    </script>
</body>
</html>
