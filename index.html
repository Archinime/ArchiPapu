<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Una sola luz (foco)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover {
            transform: scale(1.1);
        }
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            pointer-events: auto;
            display: none;
            min-width: 240px;
            backdrop-filter: blur(15px);
        }
        #settings-panel.visible {
            display: block;
        }
        #settings-panel h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            font-weight: 400;
            color: #ccc;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
        }
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .setting-item:last-child {
            margin-bottom: 0;
        }
        .setting-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: #fff;
        }
        .setting-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 0.3px;
        }
        @media (max-width: 600px) {
            #settings-button {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            #settings-panel {
                top: 60px;
                right: 10px;
                padding: 15px;
                min-width: 200px;
                font-size: 14px;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="settings-button">⚙️</div>
    <div id="settings-panel">
        <h3>⚡ Configuración</h3>
        <div id="quality-indicator">Modo Normal</div>
        <div class="setting-item">
            <label>
                <span>💡 Modo humilde (ahorro)</span>
                <input type="checkbox" id="performance-mode">
            </label>
        </div>
    </div>
    <div id="loading">Cargando modelos...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Detectar móvil ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // --- Variables globales ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
        document.body.appendChild(renderer.domElement);

        // Controles
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        // Ángulo de rotación horizontal: un poco más amplio en móvil (45°), en PC 30°
        if (isMobile) {
            controls.minAzimuthAngle = -Math.PI / 4; // -45°
            controls.maxAzimuthAngle = Math.PI / 4;  // +45°
        } else {
            controls.minAzimuthAngle = -Math.PI / 6; // -30°
            controls.maxAzimuthAngle = Math.PI / 6;  // +30°
        }
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // Almacén de luces actuales (solo habrá una)
        let currentLight = null;

        // --- Función para configurar iluminación (solo un foco) ---
        function setupLight(performanceMode) {
            // Eliminar luz anterior si existe
            if (currentLight) {
                if (currentLight.target) scene.remove(currentLight.target);
                scene.remove(currentLight);
                currentLight = null;
            }

            if (performanceMode) {
                // Modo humilde: foco más tenue, sin sombras, menor distancia
                const spotLight = new THREE.SpotLight(0xfff5e6, 1.2);
                spotLight.position.set(0, 8, 2); // Ligeramente desplazado para mejor ángulo
                spotLight.target.position.set(0, 1, 0);
                scene.add(spotLight.target);
                spotLight.castShadow = false; // Sin sombras
                spotLight.angle = 1.0;
                spotLight.penumbra = 0.5;
                spotLight.decay = 1;
                spotLight.distance = 20;
                scene.add(spotLight);
                currentLight = spotLight;

                // Ajustes de renderer
                renderer.shadowMap.enabled = false;
                renderer.setPixelRatio(1);
                
                // Controles sin damping y menor distancia
                controls.enableDamping = false;
                controls.maxDistance = 18;

                document.getElementById('quality-indicator').textContent = 'Modo humilde 🌱';
            } else {
                // Modo normal: foco intenso con sombras
                const spotLight = new THREE.SpotLight(0xfff5e6, 2.5);
                spotLight.position.set(0, 10, 3);
                spotLight.target.position.set(0, 1, 0);
                scene.add(spotLight.target);
                spotLight.castShadow = true;
                spotLight.shadow.mapSize.width = 1024;
                spotLight.shadow.mapSize.height = 1024;
                spotLight.angle = 0.8;
                spotLight.penumbra = 0.4;
                spotLight.decay = 1;
                spotLight.distance = 30;
                scene.add(spotLight);
                currentLight = spotLight;

                renderer.shadowMap.enabled = true;
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
                
                controls.enableDamping = true;
                controls.maxDistance = 30;

                document.getElementById('quality-indicator').textContent = 'Modo normal ✨';
            }

            // Actualizar sombras en los modelos
            scene.traverse(node => {
                if (node.isMesh) {
                    node.castShadow = !performanceMode;
                    node.receiveShadow = !performanceMode;
                }
            });
        }

        // --- Cargar preferencia guardada o establecer según dispositivo ---
        let savedMode = localStorage.getItem('modoHumilde');
        let defaultPerformanceMode;

        if (savedMode !== null) {
            defaultPerformanceMode = savedMode === 'true';
        } else {
            defaultPerformanceMode = isMobile; // En móvil, true; en PC, false
        }

        // Aplicar configuración inicial
        setupLight(defaultPerformanceMode);

        // Sincronizar checkbox
        const perfCheck = document.getElementById('performance-mode');
        perfCheck.checked = defaultPerformanceMode;

        // Evento cambio
        perfCheck.addEventListener('change', (e) => {
            const newMode = e.target.checked;
            setupLight(newMode);
            localStorage.setItem('modoHumilde', newMode);
        });

        // --- Panel de configuración (tuerca) ---
        const settingsButton = document.getElementById('settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        settingsButton.addEventListener('click', () => {
            settingsPanel.classList.toggle('visible');
        });

        document.addEventListener('click', (e) => {
            if (!settingsButton.contains(e.target) && !settingsPanel.contains(e.target)) {
                settingsPanel.classList.remove('visible');
            }
        });

        // --- Cargador de modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según tu lista

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    const performanceMode = perfCheck.checked;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = !performanceMode;
                            node.receiveShadow = !performanceMode;
                        }
                    });
                    scene.add(model);
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {},
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir scroll táctil ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página cargada. Una sola luz (foco) con modo humilde.');
    </script>
</body>
</html>
