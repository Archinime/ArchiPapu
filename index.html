<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Habitación 3D - Inventario y Lunari</title>
    <link rel="stylesheet" href="room_style.css">
</head>
<body>
    <video id="tv-video" style="display:none;" crossorigin="anonymous" playsinline></video>

    <div id="top-hud">
        <div class="hud-left">
            <div id="coin-display" title="Tus Monedas">🪙 <span id="coin-amount">0</span></div>
            <div id="weather-status">🌍 Detectando clima...</div>
            <div id="fps-counter" style="display: none;">FPS: <span>60</span></div>
        </div>
        <div class="hud-right">
            <button id="inventory-button" class="top-btn" title="Inventario y Tienda">🎒</button>
            <button id="settings-button" class="top-btn" title="Ajustes">⚙️</button>
        </div>
    </div>

    <div id="tv-controls" style="display: none;">
        <button id="tv-prev" title="Anterior">⏮️</button>
        <button id="tv-power" title="Encender/Apagar">🔴</button>
        <button id="tv-next" title="Siguiente">⏭️</button>
    </div>

    <div id="pc-controls" style="display: none;">
        <button id="pc-power" title="Encender/Apagar PC">🔴</button>
        <button id="pc-open" title="Abrir Navegador">🌐</button>
        <button id="pc-mode" title="Modo Gamer">🎮</button>
    </div>

    <div id="ff-settings-modal">
        <div class="ff-modal-content glass-panel">
            <div class="ff-header">
                <h2>⚙️ Ajustes del Cuarto</h2>
                <button id="close-ff-settings" class="close-btn">✖</button>
            </div>
            <div class="ff-body">
                <div class="ff-sidebar">
                    <button class="ff-tab active" data-target="ajustes-graficos">Gráficos</button>
                    <button class="ff-tab" data-target="ajustes-audio">Audio</button>
                </div>
                <div class="ff-content">
                    <div id="ajustes-graficos" class="ff-tab-content active">
                        <div class="ff-setting-group">
                            <label>Calidad Gráfica:</label>
                            <select id="set-calidad">
                                <option value="baja">Baja (Suave)</option>
                                <option value="media">Media</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                        <div class="ff-setting-group">
                            <label>Calidad de Sombras:</label>
                            <select id="set-sombras">
                                <option value="0">Desactivadas</option>
                                <option value="1">Básicas</option>
                                <option value="2">Ultra (Pesado)</option>
                            </select>
                        </div>
                        <div class="ff-setting-group">
                            <label>Límite de FPS:</label>
                            <select id="set-fps">
                                <option value="0">Sin Límite</option>
                                <option value="60">60 FPS</option>
                                <option value="30">30 FPS</option>
                            </select>
                        </div>
                        <div class="ff-setting-group">
                            <label><input type="checkbox" id="set-mostrar-fps"> Mostrar contador de FPS</label>
                        </div>
                    </div>
                    <div id="ajustes-audio" class="ff-tab-content">
                        <div class="ff-setting-group">
                            <label>Volumen General TV:</label>
                            <input type="range" id="set-volumen-tv" min="0" max="100" value="50">
                        </div>
                        <div class="ff-setting-group">
                            <label>Volumen General PC:</label>
                            <input type="range" id="set-volumen-pc" min="0" max="100" value="50">
                        </div>
                        <div class="ff-setting-group">
                            <label>Volumen de Efectos (Botones, Luz):</label>
                            <input type="range" id="set-volumen-efectos" min="0" max="100" value="50">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="pc-modal">
        <div class="pc-modal-content glass-panel">
            <div id="pc-header">
                <h2>🖥️ PC Virtual de Lunari</h2>
                <button id="close-pc" class="close-btn">✖</button>
            </div>
            <div class="pc-iframe-container">
                <iframe id="pc-iframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="inventory-modal">
        <div class="inv-modal-content glass-panel">
            <div id="inv-header">
                <h2>🎒 Inventario y Tienda</h2>
                <button id="close-inv" class="close-btn">✖</button>
            </div>
            <div id="inv-body">
                <div id="inv-sidebar"></div>
                <div id="inv-content-container">
                    <div id="inv-content"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="poster-view-modal">
        <button id="close-poster-view" class="close-btn">&times;</button>
        <img id="poster-enlarged-image" src="" alt="Póster">
    </div>

    <div id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Preparando habitación... <span id="loading-count">0/0</span></div>
            <div id="loading-bar-container"><div id="loading-bar"></div></div>
        </div>
    </div>
    
    <div id="light-status">💡 Luz encendida</div>
    
    <div id="daily-reward-toast" style="display:none;">¡Has ganado 100🪙 por entrar hoy!</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="room_main.js"></script>

    <div id="dialogue-box">
        <img src="https://cdn.jsdelivr.net/gh/Archinime/ArchiPapu@main/lunari_avatar.avif" alt="Lunari Avatar" id="dialogue-avatar">
        <div id="dialogue-text">...</div>
    </div>
</body>
</html>
