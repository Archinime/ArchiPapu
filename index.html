<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Habitación 3D - Inventario Mejorado</title>
    <style>
        /* (mantengo tu CSS exactamente igual al anterior; recortado aquí por brevedad en el archivo real) */
        body { margin:0; overflow:hidden; font-family: Arial, Helvetica, sans-serif; position:fixed; width:100%; height:100%; background:#111; }
        /* ... pega todo tu CSS original (idéntico al anterior) ... */
        /* Para evitar alargar la respuesta visualmente, copia el CSS que usabas antes; sigue siendo compatible. */
    </style>
</head>
<body>
    <div id="coin-display">🪙 <span id="coin-amount">0</span></div>
    <div id="inventory-button" class="top-btn" title="Inventario y Tienda">🎒</div>
    <div id="settings-button" class="top-btn" title="Ajustes">⚙️</div>

    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label><span>Modo humilde</span><input type="checkbox" id="performance-mode"></label>
    </div>

    <div id="inventory-modal">
        <div id="inv-header">
            <h2>🎒 Inventario y Tienda</h2>
            <button id="close-inv">✖</button>
        </div>
        <div id="inv-body">
            <div id="inv-sidebar"></div>
            <div id="inv-content"></div>
        </div>
    </div>

    <div id="loading">Preparando habitación...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
    import { defaultInventoryConfig, inventoryGroups } from './inventory-data.js';

    // --- Datos y guardado ---
    let playerCoins = parseInt(localStorage.getItem('room_coins')) || 1000;
    document.getElementById('coin-amount').innerText = playerCoins;
    let inventoryData = JSON.parse(localStorage.getItem('room_inventory')) || defaultInventoryConfig;
    if (inventoryData.base_foco) delete inventoryData.base_foco;

    // Sincronización mínima con defaults (no borra nada importante)
    for (let cat in defaultInventoryConfig) {
        if(!inventoryData[cat]) inventoryData[cat] = defaultInventoryConfig[cat];
        inventoryData[cat].emoji = defaultInventoryConfig[cat].emoji;
        inventoryData[cat].label = defaultInventoryConfig[cat].label;
        for(let item in defaultInventoryConfig[cat].items) {
            if(!inventoryData[cat].items[item]) inventoryData[cat].items[item] = defaultInventoryConfig[cat].items[item];
            else {
                inventoryData[cat].items[item].file = defaultInventoryConfig[cat].items[item].file;
                inventoryData[cat].items[item].name = defaultInventoryConfig[cat].items[item].name;
                if(defaultInventoryConfig[cat].items[item].baseFile) inventoryData[cat].items[item].baseFile = defaultInventoryConfig[cat].items[item].baseFile;
            }
            if (!inventoryData[cat].items[item].preview) {
                // si no existe preview, intentamos generar con nombre local (basename)
                const fallbackName = item + '.png';
                inventoryData[cat].items[item].preview = `./${fallbackName}`;
            }
        }
    }

    function saveGame() {
        localStorage.setItem('room_coins', playerCoins);
        localStorage.setItem('room_inventory', JSON.stringify(inventoryData));
        document.getElementById('coin-amount').innerText = playerCoins;
    }

    // --- Three.js / escena (sin cambios funcionales importantes) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 200);
    camera.position.set(0, 6, 14);
    const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    const effect = new OutlineEffect(renderer, { defaultThickness:0.0008, defaultColor:[0.05,0.05,0.08], defaultAlpha:0.85, defaultKeepAlive:true });
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0,5,0);
    controls.maxPolarAngle = Math.PI/2 - 0.05;
    controls.minDistance = 2.5; controls.maxDistance = 16;
    controls.enablePan = false;

    const ambient = new THREE.AmbientLight(0xffffff, 0.3); scene.add(ambient);
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4); hemiLight.position.set(0,20,0); scene.add(hemiLight);
    const mainLight = new THREE.SpotLight(0xffeedd, 6); mainLight.position.set(2,22,2); mainLight.angle = Math.PI/3; mainLight.penumbra = 0.8; mainLight.castShadow=true; scene.add(mainLight); scene.add(mainLight.target);

    const loader = new GLTFLoader();
    const loadedSlotMeshes = {};
    let focoMesh = null, switchMesh = null;
    const perfCheck = document.getElementById('performance-mode');
    perfCheck.checked = localStorage.getItem('performanceMode') === 'true';

    function applyMaterialLogic(model, categoryKey) {
        const isLow = perfCheck.checked;
        const isFoco = categoryKey === 'foco';
        model.traverse((node)=>{
            if(node.isMesh){
                if(isFoco){
                    node.castShadow=false; node.receiveShadow=false;
                    if(node.material){ node.material.emissive = new THREE.Color(0xffeedd); node.material.emissiveIntensity = 1.5; }
                } else {
                    node.castShadow = !isLow; node.receiveShadow = !isLow;
                    if(node.material){ node.material.side = THREE.DoubleSide; node.material.needsUpdate = true; }
                }
            }
        });
    }

    function loadItemForSlot(categoryKey, itemFile, isInitial=false) {
        if(!itemFile) return;
        if(loadedSlotMeshes[categoryKey]) scene.remove(loadedSlotMeshes[categoryKey]);
        loader.load(itemFile, (gltf)=>{
            const model = gltf.scene;
            applyMaterialLogic(model, categoryKey);
            if(categoryKey === 'foco') focoMesh = model;
            if(categoryKey === 'interruptor') switchMesh = model;
            scene.add(model);
            loadedSlotMeshes[categoryKey] = model;
            if(isInitial) checkLoadingProgress();
        }, undefined, (err)=>{
            console.warn('Error cargando GLB:', itemFile, err);
            if(isInitial) checkLoadingProgress();
        });
    }

    // Carga inicial de equipados
    for(let cat in inventoryData){
        const equippedId = inventoryData[cat].equipped;
        const item = inventoryData[cat].items[equippedId];
        if(item && item.file) loadItemForSlot(cat, item.file, true);
        if(cat === 'foco' && item && item.baseFile) loadItemForSlot('base_foco', item.baseFile, true);
    }

    let modelsLoaded = 0, totalModelsToLoad = Object.keys(inventoryData).length + 1;
    function checkLoadingProgress(){ modelsLoaded++; document.getElementById('loading').innerText = `Cargando: ${modelsLoaded}/${totalModelsToLoad}`; if(modelsLoaded>=totalModelsToLoad) document.getElementById('loading').style.display='none'; }

    // --- Lógica de iluminación / interacción ---
    let lightOn = localStorage.getItem('lightState') !== 'off';
    function updateLighting(){ if(lightOn){ mainLight.visible = true; ambient.intensity = perfCheck.checked ? 0.8 : 0.3; document.getElementById('light-status').innerText='💡 Luz encendida'; } else { mainLight.visible=false; ambient.intensity=0.02; document.getElementById('light-status').innerText='💡 Luz apagada'; } }
    updateLighting();
    function toggleLight(){ lightOn = !lightOn; localStorage.setItem('lightState', lightOn ? 'on' : 'off'); updateLighting(); }

    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
    function handleInteraction(e){
        const rect = renderer.domElement.getBoundingClientRect();
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        mouse.x = ((x - rect.left)/rect.width)*2 - 1;
        mouse.y = -((y - rect.top)/rect.height)*2 + 1;
        raycaster.setFromCamera(mouse, camera);
        if(switchMesh && raycaster.intersectObject(switchMesh, true).length > 0) toggleLight();
    }
    renderer.domElement.addEventListener('click', handleInteraction);
    renderer.domElement.addEventListener('touchstart', (e)=>{ if(document.getElementById('inventory-modal').classList.contains('visible')) return; handleInteraction(e); }, {passive:true});

    // --- Calidad / modo humilde ---
    function updateQuality(){
        const low = perfCheck.checked;
        renderer.shadowMap.enabled = !low;
        renderer.setPixelRatio(low ? 1 : Math.min(devicePixelRatio,2));
        document.getElementById('quality-indicator').textContent = low ? 'Modo Humilde' : 'Calidad Alta';
        localStorage.setItem('performanceMode', low);
        updateLighting();
    }
    perfCheck.addEventListener('change', updateQuality);

    // --- Renders y UI del inventario (aquí está la mejora) ---
    let currentCategory = 'cama';
    let openGroup = 'muebles';

    // Helper: obtener basename desde una URL o path
    function basename(path) {
        return path.split('/').pop().split('?')[0].split('#')[0];
    }

    // Helper: genera lista de intentos de URL para fallback
    function buildPreviewCandidates(origSrc) {
        const candidates = [];
        if(!origSrc) return candidates;
        const s = origSrc.trim();
        // 1) primer intento: tal cual el valor provisto (puede ser relativo o absoluto)
        candidates.push(s);
        // 2) si ya es solo nombre (no contiene slash) también probar ./nombre (por seguridad)
        if(!s.includes('/')) {
            candidates.push('./' + s);
        } else {
            // 3) intentar con solo el basename relativo (por si el recurso se encuentra en la carpeta del proyecto)
            const b = basename(s);
            candidates.push('./' + b);
            // 4) intentar CDN principal (jsdelivr) con basename (por si la URL original falló)
            candidates.push('https://cdn.jsdelivr.net/gh/Archinime/ArchiPapu@main/' + b);
            // 5) intentar raw.githubusercontent (alternativa)
            candidates.push('https://raw.githubusercontent.com/Archinime/ArchiPapu/main/' + b);
        }
        // 6) placeholder final
        return candidates;
    }

    function setImageWithFallback(imgElement, origSrc) {
        const candidates = buildPreviewCandidates(origSrc);
        let idx = 0;
        const placeholderHTML = '<span class="placeholder">📦</span>';
        imgElement.onerror = function () {
            // pasamos al siguiente candidato
            idx++;
            if(idx >= candidates.length) {
                // todos fallaron -> mostramos placeholder (no rompe layout)
                const parent = imgElement.parentNode;
                if(parent) parent.innerHTML = placeholderHTML;
                console.warn('Todas las rutas fallaron para preview:', origSrc);
            } else {
                // re-intentar con siguiente candidato; limpiamos event handlers para evitar loops
                // crear nuevo img para reiniciar completamente (para evitar estado corrupto)
                const nextSrc = candidates[idx];
                const parent = imgElement.parentNode;
                if(!parent) return;
                const newImg = document.createElement('img');
                newImg.alt = imgElement.alt || 'item';
                newImg.decoding = 'async';
                // asignar onload y onerror igual que este
                newImg.onload = function(){ /* carga ok */ };
                // enlazamos recursivamente la misma función para gestionar futuros fallbacks
                parent.replaceChild(newImg, imgElement);
                // llamar recursivamente con el nuevo elemento
                setImageWithFallback(newImg, nextSrc);
            }
        };
        imgElement.onload = function(){ /* si carga, todo ok */ };
        // Establecer la primera src
        imgElement.src = candidates[idx];
    }

    function renderInventory() {
        const sidebar = document.getElementById('inv-sidebar');
        const content = document.getElementById('inv-content');
        sidebar.innerHTML = ''; content.innerHTML = '';

        inventoryGroups.forEach(group => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'inv-group';
            const groupBtn = document.createElement('button');
            groupBtn.className = 'group-btn';
            groupBtn.innerHTML = `<span>${group.emoji} ${group.label}</span> <span style="transition:0.3s; transform: ${openGroup === group.id ? 'rotate(90deg)' : 'rotate(0deg)'}">▶</span>`;
            groupBtn.onclick = () => { openGroup = openGroup === group.id ? null : group.id; renderInventory(); };
            groupDiv.appendChild(groupBtn);

            const groupContent = document.createElement('div');
            groupContent.className = `group-content ${openGroup === group.id ? 'open' : ''}`;

            group.categories.forEach(catKey => {
                const cat = inventoryData[catKey];
                if(!cat) return;
                const btn = document.createElement('button');
                btn.className = `cat-btn ${catKey === currentCategory ? 'active' : ''}`;
                btn.innerHTML = `<span class="cat-icon-emoji">${cat.emoji}</span> <span>${cat.label}</span>`;
                btn.onclick = () => { currentCategory = catKey; renderInventory(); };
                groupContent.appendChild(btn);
            });

            groupDiv.appendChild(groupContent);
            sidebar.appendChild(groupDiv);
        });

        const catData = inventoryData[currentCategory];
        if(!catData) return;

        for(let itemId in catData.items) {
            const item = catData.items[itemId];
            const isEquipped = catData.equipped === itemId;
            const card = document.createElement('div'); card.className = 'item-card';

            const previewDiv = document.createElement('div'); previewDiv.className = 'item-preview';
            const img = document.createElement('img');
            img.decoding = 'async';
            img.alt = item.name || 'item';
            // NO asignamos crossOrigin/referrerPolicy por defecto (evita fallos en algunos hosts)
            const previewSrc = item.preview || item.file || null;
            setImageWithFallback(img, previewSrc);
            previewDiv.appendChild(img);

            const title = document.createElement('h4'); title.textContent = item.name || 'Sin nombre';
            const priceDiv = document.createElement('div'); priceDiv.className = 'item-price';
            priceDiv.textContent = item.owned ? 'Adquirido' : `🪙 ${item.price}`;

            const btn = document.createElement('button');
            if(isEquipped){
                btn.className = 'item-btn btn-equipped'; btn.disabled = true; btn.textContent = 'Equipado ✓';
            } else if(item.owned){
                btn.className = 'item-btn btn-equip'; btn.textContent = 'Equipar';
                btn.addEventListener('click', ()=> equipItem(currentCategory, itemId));
            } else {
                btn.className = 'item-btn btn-buy'; btn.textContent = `Comprar 🪙${item.price}`;
                btn.addEventListener('click', ()=> buyItem(currentCategory, itemId));
            }

            card.appendChild(previewDiv);
            card.appendChild(title);
            card.appendChild(priceDiv);
            card.appendChild(btn);
            content.appendChild(card);
        }
    }

    function equipItem(category, itemId) {
        inventoryData[category].equipped = itemId;
        saveGame();
        renderInventory();
        const itemData = inventoryData[category].items[itemId];
        loadItemForSlot(category, itemData.file, false);
        if(category === 'foco' && itemData.baseFile) loadItemForSlot('base_foco', itemData.baseFile, false);
    }

    function buyItem(category, itemId) {
        const item = inventoryData[category].items[itemId];
        if(playerCoins >= item.price){
            playerCoins -= item.price; item.owned = true; saveGame(); renderInventory();
        } else alert('No tienes suficientes monedas.');
    }

    // UI events
    document.getElementById('inventory-button').onclick = ()=>{ document.getElementById('inventory-modal').classList.add('visible'); renderInventory(); };
    document.getElementById('close-inv').onclick = ()=>{ document.getElementById('inventory-modal').classList.remove('visible'); };
    document.getElementById('settings-button').onclick = ()=>{ document.getElementById('settings-panel').classList.toggle('visible'); };

    // Animación
    function animate(){ requestAnimationFrame(animate); controls.update(); effect.render(scene, camera); }
    animate();
    window.addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); effect.setSize(innerWidth, innerHeight); });

    updateQuality();
    </script>
</body>
</html>
