<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Foco desde arriba</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #light-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Detectar tipo de dispositivo ---
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const width = window.innerWidth;
        
        let deviceType = 'desktop';
        if (width < 768 || (isMobileUA && width < 1024)) {
            deviceType = 'mobile';
        } else if (width >= 768 && width <= 1024 || (isMobileUA && width >= 1024)) {
            deviceType = 'tablet';
        }

        console.log('Dispositivo detectado:', deviceType, 'ancho:', width);

        // --- Variables globales ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // --- Luz ambiental suave (para rellenar sin quitar protagonismo al foco) ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.2);
        scene.add(ambientLight);

        // --- Cámara según dispositivo ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        let camPosY = 10, camPosZ = 20, targetY = 2;
        if (deviceType === 'mobile') {
            camPosY = 7;
            camPosZ = 10;
            targetY = 7;
        } else if (deviceType === 'tablet') {
            camPosY = 9;
            camPosZ = 16;
            targetY = 2;
        } else {
            camPosY = 10;
            camPosZ = 20;
            targetY = 2;
        }
        
        camera.position.set(0, camPosY, camPosZ);
        camera.lookAt(0, targetY, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombreado suave original
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
        document.body.appendChild(renderer.domElement);

        // --- Controles base ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 4;
        controls.maxDistance = 50;
        controls.target.set(0, targetY, 0);

        // --- Límites de rotación según dispositivo ---
        let baseMinAzimuth, baseMaxAzimuth;
        let useDynamicLimits = false;

        if (deviceType === 'mobile') {
            controls.minAzimuthAngle = undefined;
            controls.maxAzimuthAngle = undefined;
            useDynamicLimits = false;
        } else if (deviceType === 'tablet') {
            baseMinAzimuth = -Math.PI / 1.5;
            baseMaxAzimuth = Math.PI / 1.5;
            controls.minAzimuthAngle = baseMinAzimuth;
            controls.maxAzimuthAngle = baseMaxAzimuth;
            useDynamicLimits = true;
        } else {
            baseMinAzimuth = -Math.PI / 4;
            baseMaxAzimuth = Math.PI / 4;
            controls.minAzimuthAngle = baseMinAzimuth;
            controls.maxAzimuthAngle = baseMaxAzimuth;
            useDynamicLimits = true;
        }

        // --- LUZ PRINCIPAL: Foco desde arriba (configuración original potente) ---
        const mainLight = new THREE.SpotLight(0xffeedd, 4.5);
        mainLight.position.set(0, 25, 0);
        mainLight.target.position.set(0, 1, 0);
        scene.add(mainLight.target);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.angle = 1.5;           // Ángulo amplio original
        mainLight.penumbra = 0.5;         // Penumbra original
        mainLight.decay = 1;
        mainLight.distance = 100;
        mainLight.shadow.bias = 0.0002;    // Bias positivo pequeño para evitar sombras falsas
        scene.add(mainLight);

        // Estado de la luz
        let lightOn = true;
        
        // Luz de señalización para el interruptor
        const indicatorLight = new THREE.PointLight(0xffaa00, 0.8, 5);
        indicatorLight.position.set(0, 0, 0);
        scene.add(indicatorLight);

        // Variables para el interruptor
        let switchMesh = null;
        const switchPosition = new THREE.Vector3();

        // --- Cargador de modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20;

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    scene.add(model);
                    
                    if (path.includes('interruptor.glb')) {
                        switchMesh = model;
                        model.traverse((node) => {
                            if (node.isMesh) {
                                node.getWorldPosition(switchPosition);
                                indicatorLight.position.copy(switchPosition);
                            }
                        });
                        console.log('Interruptor cargado en:', switchPosition);
                    }
                    
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {},
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Raycasting para el interruptor ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            if (event.touches) {
                mouse.x = ((event.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.touches[0].clientY - rect.top) / rect.height) * 2 + 1;
            } else {
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            }

            raycaster.setFromCamera(mouse, camera);

            if (switchMesh) {
                const intersects = raycaster.intersectObject(switchMesh, true);
                if (intersects.length > 0) {
                    lightOn = !lightOn;
                    mainLight.visible = lightOn;
                    localStorage.setItem('lightState', lightOn ? 'on' : 'off');
                    document.getElementById('light-status').innerText = lightOn ? '💡 Luz encendida' : '💡 Luz apagada';
                    indicatorLight.intensity = lightOn ? 0.8 : 1.5;
                }
            }
        }

        renderer.domElement.addEventListener('click', onClick);
        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            onClick(e);
        });

        // --- Persistencia del estado de la luz ---
        const savedLightState = localStorage.getItem('lightState');
        if (savedLightState === 'off') {
            lightOn = false;
            mainLight.visible = false;
            document.getElementById('light-status').innerText = '💡 Luz apagada';
        } else {
            lightOn = true;
            mainLight.visible = true;
            document.getElementById('light-status').innerText = '💡 Luz encendida';
        }

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);

            if (useDynamicLimits) {
                const distance = camera.position.length();
                const nearDist = controls.minDistance;
                const farDist = controls.maxDistance;
                let factor = (distance - nearDist) / (farDist - nearDist);
                factor = Math.max(0, Math.min(1, factor));
                const minMultiplier = 0.4;
                const maxMultiplier = 1.6;
                const currentMinAngle = baseMinAzimuth * (minMultiplier + factor * (maxMultiplier - minMultiplier));
                const currentMaxAngle = baseMaxAzimuth * (minMultiplier + factor * (maxMultiplier - minMultiplier));
                controls.minAzimuthAngle = currentMinAngle;
                controls.maxAzimuthAngle = currentMaxAngle;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir scroll táctil ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página cargada. Dispositivo:', deviceType, 'con foco restaurado y sombras corregidas.');
    </script>
</body>
</html>
