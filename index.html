<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Pro</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover {
            transform: scale(1.1);
        }
        #settings-button:active {
            transform: scale(0.95);
        }
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible {
            display: block;
        }
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 10px;
        }
        #settings-panel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            #settings-button { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 22px; }
            #settings-panel { top: 60px; right: 10px; padding: 12px 15px; font-size: 13px; min-width: 180px; }
        }
        #loading {
            position: absolute; bottom: 20px; right: 20px; color: white;
            background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px;
            font-size: 12px; z-index: 100; pointer-events: none; backdrop-filter: blur(4px);
        }
        #light-status {
            position: absolute; bottom: 20px; left: 20px; color: white;
            background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px;
            font-size: 12px; z-index: 100; pointer-events: none; backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="settings-button">⚙️</div>
    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Detección de dispositivo ---
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const width = window.innerWidth;
        let deviceType = (width < 768 || (isMobileUA && width < 1024)) ? 'mobile' : 
                         (width >= 768 && width <= 1024) ? 'tablet' : 'desktop';

        // --- Escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);

        // --- Cámara optimizada para evitar Z-Fighting ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        let camPosY = 10, camPosZ = 20, targetY = 2;
        if (deviceType === 'mobile') { camPosY = 8; camPosZ = 12; targetY = 5; }
        camera.position.set(0, camPosY, camPosZ);

        // --- RENDERIZADOR PRO (Logarithmic Depth Buffer para eliminar líneas) ---
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            powerPreference: "high-performance",
            logarithmicDepthBuffer: true // ESTO ELIMINA EL PARPADEO Y RAYAS POR CÁMARA
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Controles ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, targetY, 0);

        // --- Luz Principal Mejorada ---
        const mainLight = new THREE.SpotLight(0xffeedd, 4);
        mainLight.position.set(0, 20, 0);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(2048, 2048);
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.bias = -0.0001;
        mainLight.shadow.normalBias = 0.02; // Evita rayas sin separar la sombra del objeto
        scene.add(mainLight);
        scene.add(mainLight.target);

        // Luces extra para que no se vea plano
        const ambient = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambient);

        const indicatorLight = new THREE.PointLight(0xffaa00, 0.8, 5);
        scene.add(indicatorLight);

        // --- Carga de Modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];
        let switchMesh = null;

        modelos.forEach(path => {
            loader.load(path, (gltf) => {
                const model = gltf.scene;
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        
                        // FIX DE MATERIALES PARA RAYAS
                        if(node.material) {
                            node.material.shadowSide = THREE.FrontSide; // Mejor para objetos cerrados
                            if(node.name.toLowerCase().includes('pared') || node.name.toLowerCase().includes('piso')) {
                                node.material.shadowSide = THREE.BackSide; // Específico para paredes/suelos
                            }
                            node.material.side = THREE.DoubleSide; // Asegura que se vea todo
                        }
                    }
                });
                scene.add(model);
                if (path.includes('interruptor.glb')) {
                    switchMesh = model;
                    const box = new THREE.Box3().setFromObject(model);
                    box.getCenter(indicatorLight.position);
                }
                modelsLoaded++;
                document.getElementById('loading').innerText = `Cargando: ${modelsLoaded}/${modelos.length}`;
                if (modelsLoaded === modelos.length) document.getElementById('loading').style.display = 'none';
            });
        });

        // --- Interacción Interruptor ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lightOn = localStorage.getItem('lightState') !== 'off';

        function toggleLight() {
            lightOn = !lightOn;
            mainLight.visible = lightOn;
            localStorage.setItem('lightState', lightOn ? 'on' : 'off');
            document.getElementById('light-status').innerText = lightOn ? '💡 Luz encendida' : '💡 Luz apagada';
            indicatorLight.intensity = lightOn ? 0.8 : 2;
        }

        function handleInteraction(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;
            mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((y - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (switchMesh && raycaster.intersectObject(switchMesh, true).length > 0) {
                toggleLight();
            }
        }

        renderer.domElement.addEventListener('click', handleInteraction);
        renderer.domElement.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e); }, {passive: false});

        // --- Calidad / Modo Humilde ---
        const perfCheck = document.getElementById('performance-mode');
        function updateQuality() {
            const isLow = perfCheck.checked;
            renderer.shadowMap.enabled = !isLow;
            renderer.setPixelRatio(isLow ? 1 : Math.min(window.devicePixelRatio, 2));
            document.getElementById('quality-indicator').textContent = isLow ? 'Modo Humilde' : 'Calidad Alta';
            scene.traverse(n => { if(n.isMesh) { n.castShadow = !isLow; n.receiveShadow = !isLow; }});
            localStorage.setItem('performanceMode', isLow);
        }

        perfCheck.checked = localStorage.getItem('performanceMode') === 'true';
        perfCheck.addEventListener('change', updateQuality);
        
        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Configuración inicial de UI
        if(!lightOn) { mainLight.visible = false; document.getElementById('light-status').innerText = '💡 Luz apagada'; }
        updateQuality();
        document.getElementById('settings-button').onclick = () => document.getElementById('settings-panel').classList.toggle('visible');
    </script>
</body>
</html>
