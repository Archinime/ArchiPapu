<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport para correcto escalado en móviles y evitar zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Ultra Optimizada Móvil</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 600px) {
            #info {
                font-size: 12px;
                top: 10px;
                left: 10px;
                padding: 5px 10px;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="info">🏠 Habitación (modo móvil: calidad baja)</div>
    <div id="loading">Cargando modelos...</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- DETECCIÓN DE MÓVIL ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // --- Configuración básica de la escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // --- Cámara (frontal elevada y lejana) ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        // --- Renderizador con configuraciones extremas para móvil ---
        const renderer = new THREE.WebGLRenderer({ 
            antialias: !isMobile,                // Sin antialiasing en móvil
            powerPreference: isMobile ? "high-performance" : "default"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // EN MÓVIL: DESACTIVAMOS SOMBRAS COMPLETAMENTE (principal causa de lag)
        renderer.shadowMap.enabled = !isMobile;   // Sombra solo en desktop
        
        // En móvil, forzamos pixel ratio a 1 (más rápido)
        renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio, 3));
        
        document.body.appendChild(renderer.domElement);

        // --- Controles de órbita con límites (igual para ambos) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = isMobile ? 0.1 : 0.05; // Menos damping en móvil (más responsive)
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        
        // Límites de rotación horizontal (azimuth) para no salir de la habitación
        controls.minAzimuthAngle = -Math.PI / 6; // -30 grados
        controls.maxAzimuthAngle = Math.PI / 6;  // +30 grados
        
        controls.minDistance = 4;
        controls.maxDistance = isMobile ? 20 : 30; // Menor distancia en móvil para menos carga
        controls.target.set(0, 2, 0);

        // --- LUCES: Versión simplificada para móvil vs completa para desktop ---
        if (isMobile) {
            // MÓVIL: solo luces esenciales y sin sombras
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // Más brillante para compensar
            scene.add(ambientLight);

            // Una única luz direccional SIN sombras
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
            dirLight.position.set(5, 10, 7);
            // No se activan sombras
            scene.add(dirLight);

            // Pequeña luz de relleno desde atrás
            const backLight = new THREE.PointLight(0x4466ff, 0.8);
            backLight.position.set(-3, 4, -3);
            scene.add(backLight);

            // Luz puntual cálida (solo una)
            const pointLight = new THREE.PointLight(0xffaa66, 1.0);
            pointLight.position.set(2, 4, 2);
            scene.add(pointLight);

            // No incluimos spotLight ni sillaLight para reducir cálculos
        } else {
            // DESKTOP: versión completa con sombras y todas las luces (como antes)
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
            directionalLight.position.set(5, 15, 7);
            directionalLight.castShadow = true;
            directionalLight.receiveShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            const d = 10;
            directionalLight.shadow.camera.left = -d;
            directionalLight.shadow.camera.right = d;
            directionalLight.shadow.camera.top = d;
            directionalLight.shadow.camera.bottom = -d;
            directionalLight.shadow.camera.near = 2;
            directionalLight.shadow.camera.far = 20;
            directionalLight.shadow.bias = -0.0005;
            scene.add(directionalLight);

            const backLight = new THREE.PointLight(0x4466ff, 1.0);
            backLight.position.set(-3, 6, -3);
            backLight.distance = 30;
            scene.add(backLight);

            const pointLight = new THREE.PointLight(0xffaa66, 1.5);
            pointLight.position.set(2, 6, 2);
            pointLight.distance = 25;
            scene.add(pointLight);

            const spotLight = new THREE.SpotLight(0xffffff, 1.8);
            spotLight.position.set(0, 10, 0);
            spotLight.target.position.set(0, 1, 0);
            scene.add(spotLight.target);
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            spotLight.angle = 1.0;
            spotLight.penumbra = 0.5;
            spotLight.decay = 1;
            spotLight.distance = 30;
            scene.add(spotLight);

            const sillaLight = new THREE.PointLight(0xffcc88, 1.2);
            sillaLight.position.set(1.5, 4, 1.5);
            sillaLight.distance = 15;
            scene.add(sillaLight);
        }

        // --- Cargador de modelos GLB con indicador de progreso ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según tu lista

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            // En móvil no hay sombras, pero dejamos las propiedades por si acaso
                            node.castShadow = !isMobile;
                            node.receiveShadow = !isMobile;
                        }
                    });
                    scene.add(model);
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {
                    // Progreso individual (opcional)
                },
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        // Lista completa de modelos (ajústala a tus archivos)
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Manejar cambio de tamaño de la ventana (incluyendo orientación) ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir el desplazamiento táctil de la página ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página optimizada para móvil: sin sombras, pocas luces, pixel ratio 1.');
    </script>
</body>
</html>
