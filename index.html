<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Interactiva y Realista</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-color: #4CAF50;
            --accent-glow: 0 4px 15px rgba(76, 175, 80, 0.4);
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #050508;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        /* UI Base */
        #ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            pointer-events: auto;
        }

        /* Botones y controles */
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: var(--accent-glow);
        }

        /* Top Bar */
        #top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
        }

        /* Ajustes */
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        #settings-panel.visible { display: flex; }

        /* Inventario */
        #inventory-modal {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            height: 60vh;
            padding: 20px;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }
        #inventory-modal.visible { bottom: 20px; }

        #close-inv {
            align-self: flex-end;
            margin-bottom: 10px;
        }

        /* Loader */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass-bg);
            padding: 20px 40px;
            border-radius: 12px;
            display: none;
            pointer-events: none;
            text-align: center;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-container">
        <div id="top-bar">
            <button class="btn glass-panel" id="open-inv">📦 Inventario</button>
            <div style="display:flex; gap: 10px;">
                <button class="btn glass-panel" id="toggle-light">💡 Luz</button>
                <button class="btn glass-panel" id="settings-button">⚙️</button>
            </div>
        </div>

        <div id="settings-panel" class="glass-panel">
            <h3 style="margin:0 0 10px 0; font-size: 16px;">Ajustes</h3>
            <label><input type="checkbox" id="shadows-toggle" checked> Sombras Suaves</label>
            <label><input type="checkbox" id="hd-toggle"> Alta Calidad (HD)</label>
        </div>

        <div id="inventory-modal" class="glass-panel">
            <button class="btn" id="close-inv">Cerrar ❌</button>
            <div id="inventory-content" style="overflow-y: auto; flex-grow: 1;">
                </div>
        </div>

        <div id="loader" class="glass-panel">Cargando modelo...</div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registrado con éxito:', registration.scope);
                }).catch(error => {
                    console.log('Error al registrar el SW:', error);
                });
            });
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        
        // Importamos los datos de tu inventario
        import { defaultInventoryConfig, inventoryGroups } from './inventory-data.js';

        // --- 1. CONFIGURACIÓN BASE Y OPTIMIZACIÓN EXTREMA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);

        // powerPreference fuerza la GPU dedicada. antialias: false sube los FPS.
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        
        // Limitamos los píxeles para que no haya lag en móviles de alta gama
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // Realismo: Colores de cine y sombras suaves
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(5, 3, 5);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Bloquea ver debajo del suelo
        controls.minDistance = 2;
        controls.maxDistance = 10;

        // --- 2. ENTORNO Y LUCES (ARREGLO DE OSCURIDAD) ---
        const environment = new RoomEnvironment();
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(environment).texture;
        
        // Luz base (suave)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        // Foco Principal (cálido)
        const mainLight = new THREE.PointLight(0xffebc2, 1.5, 20);
        mainLight.position.set(0, 2.5, 0);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.bias = -0.001; 
        scene.add(mainLight);

        // Lógica de apagado realista
        let isLightOn = true;
        document.getElementById('toggle-light').onclick = () => {
            isLightOn = !isLightOn;
            if (isLightOn) {
                mainLight.intensity = 1.5;
                ambientLight.intensity = 0.3;
                scene.environmentIntensity = 1.0; // Vuelve el entorno 3D
                document.getElementById('toggle-light').innerText = "💡 Luz";
            } else {
                mainLight.intensity = 0;
                ambientLight.intensity = 0.02; // Oscuridad casi total
                scene.environmentIntensity = 0.05; // Apaga los reflejos falsos
                document.getElementById('toggle-light').innerText = "🌙 Luz";
            }
        };

        // --- 3. CARGA DE MODELOS (OPTIMIZADO CON DRACO) ---
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader);

        let lunariMixer = null;
        const clock = new THREE.Clock();
        const loadedModels = {}; 
        let activeMeshes = {}; // Para reemplazar partes cuando te equipas algo nuevo
        const loaderUI = document.getElementById('loader');

        // Función de carga que usa tu lógica de inventario
        function loadModel(url, category) {
            if (!url) return;
            loaderUI.style.display = 'block';

            gltfLoader.load(url, (gltf) => {
                const model = gltf.scene;
                
                // Aplicar sombras a todo lo cargado
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // Si ya había un modelo en esa categoría (ej. cambiamos de cama), lo borramos
                if (activeMeshes[category]) {
                    scene.remove(activeMeshes[category]);
                }

                scene.add(model);
                activeMeshes[category] = model;

                // Animaciones
                if (gltf.animations && gltf.animations.length > 0) {
                    lunariMixer = new THREE.AnimationMixer(model);
                    const action = lunariMixer.clipAction(gltf.animations[0]);
                    action.play();
                }

                loaderUI.style.display = 'none';
            }, undefined, (error) => {
                console.error("Error cargando modelo:", error);
                loaderUI.style.display = 'none';
            });
        }

        // --- 4. LÓGICA DE TU INVENTARIO ---
        let userInventory = JSON.parse(JSON.stringify(defaultInventoryConfig));

        function renderInventory() {
            const container = document.getElementById('inventory-content');
            container.innerHTML = ''; 

            inventoryGroups.forEach(group => {
                const groupTitle = document.createElement('h3');
                groupTitle.innerText = `${group.emoji} ${group.label}`;
                groupTitle.style.borderBottom = "1px solid rgba(255,255,255,0.2)";
                groupTitle.style.paddingBottom = "5px";
                container.appendChild(groupTitle);

                const itemsGrid = document.createElement('div');
                itemsGrid.style.display = 'grid';
                itemsGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(120px, 1fr))';
                itemsGrid.style.gap = '10px';
                itemsGrid.style.marginBottom = '20px';

                group.categories.forEach(category => {
                    const catData = userInventory[category];
                    if (!catData) return;

                    const activeItemId = catData.equipped;
                    const activeItem = catData.items[activeItemId];

                    const itemCard = document.createElement('div');
                    itemCard.style.background = 'rgba(0,0,0,0.3)';
                    itemCard.style.padding = '10px';
                    itemCard.style.borderRadius = '8px';
                    itemCard.style.textAlign = 'center';

                    itemCard.innerHTML = `
                        <div style="font-size: 12px; color: #aaa;">${catData.label}</div>
                        <img src="${activeItem.preview}" style="width:100%; height:80px; object-fit:cover; border-radius:4px; margin:5px 0;">
                        <div style="font-size: 14px; font-weight: bold;">${activeItem.name}</div>
                    `;
                    itemsGrid.appendChild(itemCard);
                });

                container.appendChild(itemsGrid);
            });
        }

        // Cargar los objetos equipados al iniciar
        function loadEquippedItems() {
            for (const category in userInventory) {
                const equippedId = userInventory[category].equipped;
                const fileUrl = userInventory[category].items[equippedId].file;
                loadModel(fileUrl, category);
            }
        }

        // Inicializamos los modelos de la habitación
        loadEquippedItems();

        // --- 5. EVENTOS DE UI (LOS TUYOS, INTACTOS) ---
        document.getElementById('open-inv').onclick = () => {
            document.getElementById('inventory-modal').classList.add('visible');
            renderInventory(); // Llamamos a tu función al abrir
        };
        
        document.getElementById('close-inv').onclick = () => {
            document.getElementById('inventory-modal').classList.remove('visible');
        };
        
        document.getElementById('settings-button').onclick = () => {
            document.getElementById('settings-panel').classList.toggle('visible');
        };
        
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('settings-panel');
            const btn = document.getElementById('settings-button');
            if (panel.classList.contains('visible') && !panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.remove('visible');
            }
        });

        // Controles de calidad
        function updateQuality() {
            const isHD = document.getElementById('hd-toggle').checked;
            renderer.setPixelRatio(isHD ? window.devicePixelRatio : Math.min(window.devicePixelRatio, 1.5));
        }

        document.getElementById('hd-toggle').addEventListener('change', updateQuality);

        document.getElementById('shadows-toggle').addEventListener('change', (e) => {
            renderer.shadowMap.enabled = e.target.checked;
            scene.traverse((child) => {
                if (child.material) child.material.needsUpdate = true;
            });
        });

        // --- 6. BUCLE DE ANIMACIÓN Y RESIZE ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (lunariMixer) lunariMixer.update(delta);
            controls.update();
            
            renderer.render(scene, camera); 
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateQuality(); // Aplicar calidad inicial
    </script>
</body>
</html>
