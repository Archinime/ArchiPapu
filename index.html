<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Con datos externos</title>
    <style>
        /* (mismos estilos que en el index.txt original, se omiten por brevedad, pero debes copiarlos igual) */
        body { margin:0; overflow:hidden; font-family:Arial; background:#111; }
        /* ... todo el CSS original ... */
    </style>
</head>
<body>
    <div id="coin-display">🪙 <span id="coin-amount">0</span></div>
    <div id="inventory-button" class="top-btn" title="Inventario y Tienda">🎒</div>
    <div id="settings-button" class="top-btn" title="Ajustes">⚙️</div>
    <div id="settings-panel">...</div>
    <div id="inventory-modal">...</div>
    <div id="loading">Preparando habitación...</div>
    <div id="light-status">💡 Luz encendida</div>

    <!-- Import map (igual) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // Importar datos y funciones desde inventario.js (debe estar en la misma carpeta)
        import { defaultInventoryConfig, inventoryGroups, loadInventory, saveInventory, loadCoins, saveCoins } from './inventario.js';

        // ============================================================
        // INICIALIZAR DATOS
        // ============================================================
        let inventoryData = loadInventory();  // carga desde localStorage o usa default
        let playerCoins = loadCoins();
        document.getElementById('coin-amount').innerText = playerCoins;

        // Función para guardar todo (coins + inventario)
        function saveGame() {
            saveCoins(playerCoins);
            saveInventory(inventoryData);
            document.getElementById('coin-amount').innerText = playerCoins;
        }

        // ============================================================
        // RESTO DEL CÓDIGO 3D (casi idéntico al original, pero usando inventoryData)
        // ============================================================
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

        // ... (todo el código de Three.js, luces, etc. igual que en el index.txt original)
        // Pero debes reemplazar la parte donde se define defaultInventoryConfig por el import.
        // También la parte de renderInventory() debe usar inventoryGroups importado.
        // Aquí te pongo solo las modificaciones clave:

        // Ejemplo de la función equipItem modificada para guardar:
        function equipItem(category, itemId) {
            inventoryData[category].equipped = itemId;
            saveGame();  // <-- guarda automático
            renderInventory(); 
            
            const itemData = inventoryData[category].items[itemId];
            loadItemForSlot(category, itemData.file, false);
            if (category === 'foco' && itemData.baseFile) {
                loadItemForSlot('base_foco', itemData.baseFile, false);
            }
        }

        function buyItem(category, itemId) {
            let item = inventoryData[category].items[itemId];
            if (playerCoins >= item.price) {
                playerCoins -= item.price;
                item.owned = true;
                saveGame();  // <-- guarda automático
                renderInventory();
            } else {
                alert("No tienes suficientes monedas.");
            }
        }

        // Al cargar modelos, también se puede forzar el guardado si se modifica algo (no necesario)

        // En resumen, donde estaba la definición de inventoryData, ahora se usa la variable importada.
        // El resto del código 3D (cámaras, luces, animación) se mantiene igual.

        // ============================================================
        // NOTA: Para que funcione, debes copiar TODO el código Three.js original 
        // desde el index.txt y pegarlo aquí, pero eliminando la parte donde se declara 
        // defaultInventoryConfig y playerCoins, y usando los importados.
        // ============================================================
    </script>
</body>
</html>
