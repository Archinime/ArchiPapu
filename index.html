<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Habitación 3D — Inventario</title>
  <style>
    /* --- CSS completo y conservado (coloco aquí la versión completa que preserva diseño original) --- */
    :root { --bg:#0b0b0f; --panel: rgba(30,30,40,0.85); --glass: rgba(255,255,255,0.06); --accent: #4caf50; --gold: #ffd700; }
    * { box-sizing: border-box; }
    html,body { height:100%; }
    body {
      margin:0;
      overflow:hidden;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background-color: var(--bg);
      color: #fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.12); border-radius:10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius:10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

    /* Top controls */
    .top-btn {
      position:absolute;
      top:20px;
      width:44px;
      height:44px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:20px;
      cursor:pointer;
      z-index:400;
      user-select:none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      transition: transform .18s cubic-bezier(.2,.9,.3,1);
    }
    .top-btn:hover { transform: scale(1.12); }
    #inventory-button { right: 78px; }
    #settings-button { right: 20px; }

    #coin-display {
      position:absolute; left:20px; top:20px;
      background: var(--panel); padding:10px 14px; border-radius:18px;
      border:1px solid rgba(255,215,0,0.12); color: var(--gold); font-weight:700; z-index:400;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }

    /* Settings panel */
    #settings-panel {
      position:absolute; right:20px; top:80px; z-index:380;
      width:220px; padding:14px; border-radius:14px; display:none;
      background: linear-gradient(180deg, rgba(20,20,30,0.95), rgba(10,10,15,0.86));
      border:1px solid rgba(255,255,255,0.06);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      color:#e9f5ea;
    }
    #settings-panel.visible { display:block; }
    #quality-indicator { display:inline-block; background:var(--accent); color:#fff; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; margin-bottom:10px; }
    #settings-panel label { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; cursor:pointer; font-size:14px; }
    #settings-panel input[type="checkbox"] { width:18px; height:18px; cursor:pointer; accent-color: var(--accent); }

    /* Inventory modal */
    #inventory-modal {
      position:fixed; left:5%; top:5%; width:90%; height:90%; z-index:350;
      background: linear-gradient(180deg, rgba(10,10,14,0.92), rgba(12,12,18,0.92));
      border-radius:16px; padding:18px; display:none; box-shadow: 0 30px 90px rgba(0,0,0,0.75);
      border:1px solid rgba(255,255,255,0.04);
      color:#fff;
      overflow:hidden;
    }
    #inventory-modal.visible { display:flex; flex-direction:column; }

    #inv-header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.04); }
    #inv-header h2 { margin:0; font-size:20px; font-weight:800; letter-spacing:0.2px; }
    #close-inv { background: transparent; border:none; color:#fff; cursor:pointer; font-size:18px; width:42px; height:42px; border-radius:12px; transition: transform .18s; }
    #close-inv:hover { transform: rotate(30deg); color:#ff6b6b; }

    #inv-body { display:flex; flex:1; gap:20px; margin-top:12px; overflow:hidden; }

    #inv-sidebar {
      width:28%; min-width:220px; max-width:360px; overflow-y:auto; padding-right:8px;
      border-right:1px solid rgba(255,255,255,0.03);
    }

    .inv-group { margin-bottom:12px; }
    .group-btn {
      width:100%; padding:12px 14px; background: rgba(255,255,255,0.03); border-radius:12px; border:1px solid rgba(0,0,0,0.12);
      display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:700; font-size:15px; color:#f3f6f3;
    }
    .group-content { margin-top:8px; display:none; padding-left:8px; gap:6px; flex-direction:column; }
    .group-content.open { display:flex; }

    .cat-btn {
      background:transparent; border:none; text-align:left; padding:8px 10px; border-radius:10px; color:#d1d7d1; cursor:pointer; display:flex; gap:10px; align-items:center; font-size:14px;
    }
    .cat-btn:hover { background: rgba(255,255,255,0.03); padding-left:14px; color:#fff; }
    .cat-btn.active { background: linear-gradient(135deg, rgba(76,175,80,0.18), rgba(46,125,50,0.12)); color:#fff; font-weight:800; box-shadow: 0 6px 18px rgba(46,125,50,0.08); }

    #inv-content {
      width:72%; height:100%; overflow-y:auto;
      display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:16px; align-content:start; padding-bottom:16px;
    }

    .item-card {
      background: linear-gradient(145deg, rgba(40,40,50,0.9), rgba(25,25,30,0.9));
      border-radius:14px; padding:12px; border:1px solid rgba(255,255,255,0.03); display:flex; flex-direction:column; justify-content:space-between;
      transition: transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s;
    }
    .item-card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(0,0,0,0.45); border-color: rgba(255,255,255,0.06); }

    .item-preview { width:100%; height:120px; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; background: rgba(0,0,0,0.28); border:1px solid rgba(255,255,255,0.03); margin-bottom:10px; }
    .item-preview img { width:100%; height:100%; object-fit:cover; display:block; user-select:none; pointer-events:none; }
    .item-preview .placeholder { font-size:36px; opacity:0.5; }

    .item-card h4 { margin:0 0 8px 0; font-size:15px; }
    .item-price { color: var(--gold); font-weight:700; margin-bottom:8px; font-size:13px; text-shadow: 0 0 6px rgba(255,215,0,0.08); }

    .item-btn { width:100%; padding:10px; border-radius:10px; border:none; cursor:pointer; font-weight:800; font-size:13px; }
    .btn-buy { background: linear-gradient(135deg,#ff9800,#f57c00); color:#fff; }
    .btn-equip { background: linear-gradient(135deg,#2196f3,#1976d2); color:#fff; }
    .btn-equipped { background: linear-gradient(135deg,#4caf50,#2e7d32); color:#fff; cursor:default; box-shadow: inset 0 2px 6px rgba(0,0,0,0.2); }

    #loading, #light-status { position: absolute; bottom:20px; padding:8px 12px; border-radius:10px; font-weight:700; z-index:330; background: rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.04); }
    #loading { right:20px; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%{opacity:0.7}50%{opacity:1}100%{opacity:0.7} }
    #light-status { left:20px; }

    /* Responsive */
    @media (max-width:720px) {
      #inv-body { flex-direction:column; gap:10px; }
      #inv-sidebar { width:100%; max-height:36%; border-right:none; border-bottom:1px solid rgba(255,255,255,0.03); }
      #inv-content { width:100%; height:60%; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); overflow-y:auto; }
      #inventory-button { right: 70px; top:12px; }
      #settings-button { right:14px; top:12px; }
      #coin-display { top:12px; left:12px; padding:8px 10px; font-size:14px; }
    }

    /* small debug overlay (hidden by default) */
    #debug-overlay { position: absolute; left:10px; bottom:80px; z-index: 450; background: rgba(0,0,0,0.6); color:#fff; font-size:12px; padding:8px 10px; border-radius:8px; display:none; max-width:300px; }
    #debug-overlay.visible { display:block; }
  </style>
</head>
<body>
  <div id="coin-display">🪙 <span id="coin-amount">0</span></div>

  <div id="inventory-button" class="top-btn" title="Inventario y Tienda">🎒</div>
  <div id="settings-button" class="top-btn" title="Ajustes">⚙️</div>

  <div id="settings-panel">
    <div id="quality-indicator">Calidad Alta</div>
    <label><span>Modo humilde</span><input id="performance-mode" type="checkbox"></label>
    <label><span>Mostrar debug (rutas)</span><input id="debug-toggle" type="checkbox"></label>
  </div>

  <div id="inventory-modal" aria-hidden="true">
    <div id="inv-header">
      <h2>🎒 Inventario y Tienda</h2>
      <button id="close-inv" aria-label="Cerrar">✖</button>
    </div>

    <div id="inv-body">
      <div id="inv-sidebar"></div>
      <div id="inv-content"></div>
    </div>
  </div>

  <div id="loading">Preparando habitación...</div>
  <div id="light-status">💡 Luz encendida</div>
  <div id="debug-overlay" role="status" aria-live="polite"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
  import { defaultInventoryConfig, inventoryGroups } from './inventory-data.js';

  /* ========== Datos y persistencia ========== */
  let playerCoins = parseInt(localStorage.getItem('room_coins')) || 1000;
  document.getElementById('coin-amount').innerText = playerCoins;

  // Cargar inventario guardado o usar defaults
  let inventoryData = JSON.parse(localStorage.getItem('room_inventory')) || structuredClone(defaultInventoryConfig);

  // Asegura compatibilidad y campos preview: conserva orden e información original
  for (const catKey in defaultInventoryConfig) {
    if (!inventoryData[catKey]) inventoryData[catKey] = structuredClone(defaultInventoryConfig[catKey]);
    inventoryData[catKey].emoji = defaultInventoryConfig[catKey].emoji;
    inventoryData[catKey].label = defaultInventoryConfig[catKey].label;

    for (const itemKey in defaultInventoryConfig[catKey].items) {
      const defItem = defaultInventoryConfig[catKey].items[itemKey];
      if (!inventoryData[catKey].items[itemKey]) inventoryData[catKey].items[itemKey] = structuredClone(defItem);
      else {
        // mantener propiedades del usuario pero asegurar rutas a modelos y nombres
        inventoryData[catKey].items[itemKey].file = defItem.file || inventoryData[catKey].items[itemKey].file;
        inventoryData[catKey].items[itemKey].name = inventoryData[catKey].items[itemKey].name || defItem.name;
        if (defItem.baseFile) inventoryData[catKey].items[itemKey].baseFile = defItem.baseFile;
      }
      // Si no hay preview, intentamos inferir un nombre local (basename) para compatibilidad
      if (!inventoryData[catKey].items[itemKey].preview) {
        const defPreview = defItem.preview || null;
        if (defPreview) inventoryData[catKey].items[itemKey].preview = defPreview;
        else {
          // preferir nombre simple: itemKey.png (por compatibilidad con tu petición)
          inventoryData[catKey].items[itemKey].preview = itemKey + '.png';
        }
      }
    }
  }

  function saveGame() {
    localStorage.setItem('room_coins', playerCoins);
    localStorage.setItem('room_inventory', JSON.stringify(inventoryData));
    document.getElementById('coin-amount').innerText = playerCoins;
  }

  /* ========== Escena Three.js ========== */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050508);

  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 200);
  camera.position.set(0, 6, 14);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 6, 0);
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.minDistance = 2.5; controls.maxDistance = 16;

  const effect = new OutlineEffect(renderer, { defaultThickness: 0.0008, defaultColor: [0.05, 0.05, 0.08], defaultAlpha: 0.85, defaultKeepAlive: true });

  const ambient = new THREE.AmbientLight(0xffffff, 0.3); scene.add(ambient);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4); hemi.position.set(0, 20, 0); scene.add(hemi);
  const mainLight = new THREE.SpotLight(0xffeedd, 6); mainLight.position.set(2, 22, 2); mainLight.castShadow = true; scene.add(mainLight); scene.add(mainLight.target);

  const loader = new GLTFLoader();
  const loadedSlotMeshes = {};
  let focoMesh = null, switchMesh = null;

  function applyMaterialLogic(model, categoryKey) {
    const low = document.getElementById('performance-mode').checked;
    model.traverse(node => {
      if (node.isMesh) {
        if (categoryKey === 'foco') {
          node.castShadow = false; node.receiveShadow = false;
          if (node.material) { node.material.emissive = new THREE.Color(0xffeedd); node.material.emissiveIntensity = (localStorage.getItem('lightState') !== 'off') ? 1.5 : 0; }
        } else {
          node.castShadow = !low; node.receiveShadow = !low;
          if (node.material) { node.material.side = THREE.DoubleSide; node.material.needsUpdate = true; }
        }
      }
    });
  }

  function loadItemForSlot(categoryKey, itemFile, isInitial = false) {
    if (!itemFile) return;
    if (loadedSlotMeshes[categoryKey]) {
      try { scene.remove(loadedSlotMeshes[categoryKey]); } catch (e) {}
    }
    loader.load(itemFile, gltf => {
      const model = gltf.scene;
      applyMaterialLogic(model, categoryKey);
      if (categoryKey === 'foco') focoMesh = model;
      if (categoryKey === 'interruptor') switchMesh = model;
      scene.add(model);
      loadedSlotMeshes[categoryKey] = model;
      if (isInitial) checkLoading();
    }, undefined, err => {
      console.warn('Error cargando GLB', itemFile, err);
      if (isInitial) checkLoading();
    });
  }

  // cargar equipados inicialmente
  let modelsToLoad = 0, modelsLoaded = 0;
  for (const k in inventoryData) modelsToLoad++;
  modelsToLoad += 1; // margen
  function checkLoading() {
    modelsLoaded++;
    document.getElementById('loading').innerText = `Cargando: ${modelsLoaded}/${modelsToLoad}`;
    if (modelsLoaded >= modelsToLoad) document.getElementById('loading').style.display = 'none';
  }

  for (const cat in inventoryData) {
    const equipped = inventoryData[cat].equipped;
    const item = inventoryData[cat].items?.[equipped];
    if (item && item.file) loadItemForSlot(cat, item.file, true);
    if (cat === 'foco' && item && item.baseFile) loadItemForSlot('base_foco', item.baseFile, true);
  }

  /* ========== Iluminación y interacción ========== */
  let lightOn = localStorage.getItem('lightState') !== 'off';
  function updateLighting() {
    if (lightOn) { mainLight.visible = true; ambient.intensity = document.getElementById('performance-mode').checked ? 0.8 : 0.3; document.getElementById('light-status').innerText = '💡 Luz encendida'; }
    else { mainLight.visible = false; ambient.intensity = 0.02; document.getElementById('light-status').innerText = '💡 Luz apagada'; }
    // actualizar emissive en foco si existe
    if (focoMesh) focoMesh.traverse(n => { if (n.isMesh && n.material) n.material.emissiveIntensity = lightOn ? 1.5 : 0; });
  }
  updateLighting();

  function toggleLight() {
    lightOn = !lightOn;
    localStorage.setItem('lightState', lightOn ? 'on' : 'off');
    updateLighting();
  }

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  function handleInteraction(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((y - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    if (switchMesh && raycaster.intersectObject(switchMesh, true).length > 0) toggleLight();
  }

  renderer.domElement.addEventListener('click', handleInteraction);
  renderer.domElement.addEventListener('touchstart', (e) => {
    if (document.getElementById('inventory-modal').classList.contains('visible')) return;
    handleInteraction(e);
  }, { passive: true });

  /* ========== Calidad ========== */
  const perfCheck = document.getElementById('performance-mode');
  perfCheck.checked = localStorage.getItem('performanceMode') === 'true';
  function updateQuality() {
    const low = perfCheck.checked;
    renderer.shadowMap.enabled = !low;
    renderer.setPixelRatio(low ? 1 : Math.min(devicePixelRatio, 2));
    document.getElementById('quality-indicator').textContent = low ? 'Modo Humilde' : 'Calidad Alta';
    localStorage.setItem('performanceMode', low ? 'true' : 'false');
    updateLighting();
  }
  perfCheck.addEventListener('change', updateQuality);

  /* ========== Loader de miniaturas robusto ========== */

  // recibe la cadena que viene en inventoryData[item].preview o item.file y construye candidatos
  function basename(path) {
    return path ? path.split('/').pop().split('?')[0].split('#')[0] : '';
  }

  function buildPreviewCandidates(orig) {
    if (!orig) return [];
    const s = orig.trim();
    const c = [];
    // 1) si es absoluto con protocolo -> usar tal cual
    if (/^https?:\/\//i.test(s) || s.startsWith('//')) {
      c.push(s);
      // intentar el basename en local
      const b = basename(s);
      if (b) {
        c.push('./' + b);
        c.push('images/' + b);
        c.push('./images/' + b);
        c.push('https://cdn.jsdelivr.net/gh/Archinime/ArchiPapu@main/' + b);
        c.push('https://raw.githubusercontent.com/Archinime/ArchiPapu/main/' + b);
      }
    } else if (s.startsWith('/')) {
      // path absoluto en servidor
      c.push(s);
      const b = basename(s); if (b) { c.push('./' + b); c.push('images/' + b); c.push('https://cdn.jsdelivr.net/gh/Archinime/ArchiPapu@main/' + b); }
    } else {
      // nombre simple o relativo (favor preferir local)
      // si es algo como ./file.png o images/file.png, probar tal cual primero
      if (s.startsWith('./') || s.includes('/')) {
        c.push(s);
        const b = basename(s); if (b) {
          c.push('./' + b);
          c.push('images/' + b);
          c.push('./images/' + b);
          c.push('https://cdn.jsdelivr.net/gh/Archinime/ArchiPapu@main/' + b);
          c.push('https://raw.githubusercontent.com/Archinime/ArchiPapu/main/' + b);
        }
      } else {
        // nombre simple: prioridad local
        c.push('./' + s);
        c.push('images/' + s);
        c.push('./images/' + s);
        c.push(s); // tambien probar sin prefijo
        c.push('https://cdn.jsdelivr.net/gh/Archinime/ArchiPapu@main/' + s);
        c.push('https://raw.githubusercontent.com/Archinime/ArchiPapu/main/' + s);
      }
    }
    // dedupe while preserving order
    return [...new Map(c.map(url => [url, url])).values()];
  }

  // setImageWithFallback: itera candidatos hasta que uno carga; si fallan coloca placeholder
  function setImageWithFallback(imgElement, origSrc, debugCallback) {
    const candidates = buildPreviewCandidates(origSrc);
    if (!candidates.length) {
      const parent = imgElement.parentNode; if (parent) parent.innerHTML = '<span class="placeholder">📦</span>'; return;
    }
    let idx = 0;
    const parent = imgElement.parentNode;
    const tryNext = () => {
      if (idx >= candidates.length) {
        // falló todo
        if (parent) parent.innerHTML = '<span class="placeholder">📦</span>';
        debugCallback && debugCallback(origSrc, candidates, idx, false);
        return;
      }
      const next = candidates[idx++];
      // asignar src y esperar onload/onerror
      imgElement.onload = () => { debugCallback && debugCallback(origSrc, candidates, idx - 1, true); };
      imgElement.onerror = () => { 
        // crear nuevo img para reiniciar estado y probar siguiente
        const newImg = document.createElement('img');
        newImg.alt = imgElement.alt || 'preview';
        newImg.decoding = 'async';
        if (parent) parent.replaceChild(newImg, imgElement);
        imgElement = newImg;
        tryNext();
      };
      // importante: NO establecer crossOrigin ni referrerPolicy por defecto
      try { imgElement.src = next; } catch (e) { imgElement.onerror(); }
    };
    tryNext();
  }

  /* ========== UI / Inventario ========== */
  let currentCategory = 'cama';
  let openGroup = 'muebles';
  const debugOverlay = document.getElementById('debug-overlay');
  const debugToggle = document.getElementById('debug-toggle');

  function renderInventory() {
    const sidebar = document.getElementById('inv-sidebar');
    const content = document.getElementById('inv-content');
    sidebar.innerHTML = ''; content.innerHTML = '';

    // Sidebar groups (mantener orden definido por inventoryGroups)
    for (const group of inventoryGroups) {
      const gDiv = document.createElement('div'); gDiv.className = 'inv-group';
      const gBtn = document.createElement('button'); gBtn.className = 'group-btn';
      gBtn.innerHTML = `<span>${group.emoji} ${group.label}</span><span style="transform:${openGroup === group.id ? 'rotate(90deg)' : 'rotate(0)'}">▶</span>`;
      gBtn.onclick = () => { openGroup = (openGroup === group.id ? null : group.id); renderInventory(); };
      gDiv.appendChild(gBtn);

      const gContent = document.createElement('div'); gContent.className = `group-content ${openGroup === group.id ? 'open' : ''}`;
      for (const catKey of group.categories) {
        const cat = inventoryData[catKey]; if (!cat) continue;
        const btn = document.createElement('button'); btn.className = `cat-btn ${catKey === currentCategory ? 'active' : ''}`;
        btn.innerHTML = `<span style="font-size:18px">${cat.emoji}</span><span>${cat.label}</span>`;
        btn.onclick = () => { currentCategory = catKey; renderInventory(); };
        gContent.appendChild(btn);
      }
      gDiv.appendChild(gContent);
      sidebar.appendChild(gDiv);
    }

    // Content: items for currentCategory — respetando orden de keys (inserción original)
    const catData = inventoryData[currentCategory];
    if (!catData) return;

    for (const itemId of Object.keys(catData.items)) {
      const item = catData.items[itemId];
      const isEquipped = catData.equipped === itemId;

      const card = document.createElement('div'); card.className = 'item-card';
      const previewDiv = document.createElement('div'); previewDiv.className = 'item-preview';
      const img = document.createElement('img'); img.alt = item.name || 'item'; img.decoding = 'async';

      // loader debug callback para mostrar intentos en overlay si está activo
      const debugFn = (orig, candidates, triedIndex, success) => {
        if (!debugToggle.checked) { debugOverlay.classList.remove('visible'); return; }
        debugOverlay.classList.add('visible');
        const tried = candidates.slice(0, Math.min(triedIndex + (success?1:0), candidates.length));
        debugOverlay.innerText = `Preview: ${orig}\nIntentos:\n- ${tried.join('\n- ')}\n${success ? '✅ cargado' : '❌ falló todo'}`;
      };

      // establecer previews: preferir campo preview, luego file
      const previewSrc = item.preview || item.file || itemId + '.png';
      setImageWithFallback(img, previewSrc, debugFn);
      previewDiv.appendChild(img);

      const title = document.createElement('h4'); title.textContent = item.name || 'Sin nombre';
      const price = document.createElement('div'); price.className = 'item-price'; price.textContent = item.owned ? 'Adquirido' : `🪙 ${item.price}`;

      const btn = document.createElement('button');
      if (isEquipped) { btn.className = 'item-btn btn-equipped'; btn.disabled = true; btn.textContent = 'Equipado ✓'; }
      else if (item.owned) { btn.className = 'item-btn btn-equip'; btn.textContent = 'Equipar'; btn.addEventListener('click', () => equipItem(currentCategory, itemId)); }
      else { btn.className = 'item-btn btn-buy'; btn.textContent = `Comprar 🪙${item.price}`; btn.addEventListener('click', () => buyItem(currentCategory, itemId)); }

      card.appendChild(previewDiv);
      card.appendChild(title);
      card.appendChild(price);
      card.appendChild(btn);

      content.appendChild(card);
    }
  }

  function equipItem(category, itemId) {
    inventoryData[category].equipped = itemId;
    saveGame();
    renderInventory();
    const itemData = inventoryData[category].items[itemId];
    loadItemForSlot(category, itemData.file, false);
    if (category === 'foco' && itemData.baseFile) loadItemForSlot('base_foco', itemData.baseFile, false);
  }

  function buyItem(category, itemId) {
    const item = inventoryData[category].items[itemId];
    if (playerCoins >= (item.price || 0)) {
      playerCoins -= item.price || 0;
      item.owned = true;
      saveGame();
      renderInventory();
    } else {
      alert('No tienes suficientes monedas.');
    }
  }

  /* ========== Eventos UI ========== */
  document.getElementById('inventory-button').onclick = () => { document.getElementById('inventory-modal').classList.add('visible'); renderInventory(); };
  document.getElementById('close-inv').onclick = () => { document.getElementById('inventory-modal').classList.remove('visible'); debugOverlay.classList.remove('visible'); };
  document.getElementById('settings-button').onclick = () => { document.getElementById('settings-panel').classList.toggle('visible'); };
  debugToggle.addEventListener('change', () => { if (!debugToggle.checked) debugOverlay.classList.remove('visible'); });

  /* ========== Animación & resize ========== */
  function animate() { requestAnimationFrame(animate); controls.update(); effect.render(scene, camera); }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); effect.setSize(innerWidth, innerHeight);
  });

  updateQuality(); // aplicar calidad inicial
  </script>
</body>
</html>
