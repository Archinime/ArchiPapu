<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Modo Humilde</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        /* Botón de configuración (tuerca) */
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s;
            user-select: none;
            line-height: 1;
        }
        #settings-button:hover {
            transform: scale(1.1);
            background: rgba(40, 40, 50, 0.9);
        }
        #settings-button:active {
            transform: scale(0.95);
        }
        /* Panel de configuración (oculto por defecto) */
        #settings-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 18px 22px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 250;
            font-size: 15px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            display: none;
            min-width: 240px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #settings-panel.visible {
            display: block;
        }
        #settings-panel .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        #settings-panel .panel-header span {
            font-size: 22px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        #settings-panel .panel-header h3 {
            margin: 0;
            font-weight: 500;
            font-size: 18px;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.9);
        }
        #quality-indicator {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-align: center;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
            margin-bottom: 16px;
            width: fit-content;
        }
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            padding: 8px 0;
            border-radius: 12px;
            transition: background 0.2s;
        }
        #settings-panel label:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        #settings-panel label span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #settings-panel label span i {
            font-size: 18px;
            opacity: 0.8;
        }
        #settings-panel input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4CAF50;
            border-radius: 6px;
        }
        @media (max-width: 600px) {
            #settings-button {
                top: 12px;
                right: 12px;
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
            #settings-panel {
                top: 70px;
                right: 12px;
                padding: 16px 18px;
                font-size: 14px;
                min-width: 200px;
            }
            #settings-panel .panel-header h3 {
                font-size: 16px;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <!-- Botón de tuerca -->
    <div id="settings-button">⚙️</div>
    <!-- Panel de configuración -->
    <div id="settings-panel">
        <div class="panel-header">
            <span>⚙️</span>
            <h3>Ajustes de calidad</h3>
        </div>
        <div id="quality-indicator">Alta calidad</div>
        <label>
            <span>
                <i>🌱</i>
                Modo humilde (ahorro rendimiento)
            </span>
            <input type="checkbox" id="humilde-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Detectar móvil ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // --- Variables globales ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controles
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minAzimuthAngle = -Math.PI / 6;
        controls.maxAzimuthAngle = Math.PI / 6;
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // Contenedores para las luces
        let currentLights = [];

        // --- Funciones de configuración de calidad ---
        function setupHighQuality() {
            // Eliminar luces anteriores
            currentLights.forEach(light => {
                if (light.target) scene.remove(light.target);
                scene.remove(light);
            });
            currentLights = [];

            // Renderer
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));

            // Controles
            controls.enableDamping = true;
            controls.maxDistance = 30;

            // --- Luces de alta calidad (con sombras) ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            currentLights.push(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
            directionalLight.position.set(5, 15, 7);
            directionalLight.castShadow = true;
            directionalLight.receiveShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            const d = 10;
            directionalLight.shadow.camera.left = -d;
            directionalLight.shadow.camera.right = d;
            directionalLight.shadow.camera.top = d;
            directionalLight.shadow.camera.bottom = -d;
            directionalLight.shadow.camera.near = 2;
            directionalLight.shadow.camera.far = 20;
            directionalLight.shadow.bias = -0.0005;
            scene.add(directionalLight);
            currentLights.push(directionalLight);

            const backLight = new THREE.PointLight(0x4466ff, 1.0);
            backLight.position.set(-3, 6, -3);
            backLight.distance = 30;
            scene.add(backLight);
            currentLights.push(backLight);

            const pointLight = new THREE.PointLight(0xffaa66, 1.5);
            pointLight.position.set(2, 6, 2);
            pointLight.distance = 25;
            scene.add(pointLight);
            currentLights.push(pointLight);

            const spotLight = new THREE.SpotLight(0xffffff, 1.8);
            spotLight.position.set(0, 10, 0);
            spotLight.target.position.set(0, 1, 0);
            scene.add(spotLight.target);
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            spotLight.angle = 1.0;
            spotLight.penumbra = 0.5;
            spotLight.decay = 1;
            spotLight.distance = 30;
            scene.add(spotLight);
            currentLights.push(spotLight);
            currentLights.push(spotLight.target);

            const sillaLight = new THREE.PointLight(0xffcc88, 1.2);
            sillaLight.position.set(1.5, 4, 1.5);
            sillaLight.distance = 15;
            scene.add(sillaLight);
            currentLights.push(sillaLight);

            // Actualizar sombras en modelos
            scene.traverse(node => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });

            document.getElementById('quality-indicator').textContent = 'Alta calidad';
        }

        function setupHumildeMode() {
            // Eliminar luces anteriores
            currentLights.forEach(light => {
                if (light.target) scene.remove(light.target);
                scene.remove(light);
            });
            currentLights = [];

            // Renderer: sin sombras, pixel ratio bajo
            renderer.shadowMap.enabled = false;
            renderer.setPixelRatio(1);

            // Controles: sin damping, menor distancia máxima
            controls.enableDamping = false;
            controls.maxDistance = 18;

            // --- Luces de modo humilde (mínimas, sin sombras) ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
            scene.add(ambientLight);
            currentLights.push(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);
            currentLights.push(dirLight);

            const fillLight = new THREE.PointLight(0x4466aa, 0.6);
            fillLight.position.set(-2, 3, 2);
            scene.add(fillLight);
            currentLights.push(fillLight);

            // Desactivar sombras en modelos
            scene.traverse(node => {
                if (node.isMesh) {
                    node.castShadow = false;
                    node.receiveShadow = false;
                }
            });

            document.getElementById('quality-indicator').textContent = 'Modo humilde';
        }

        // --- Determinar estado inicial según localStorage y dispositivo ---
        let humildeActivo = false;

        // Cargar preferencia guardada
        const savedMode = localStorage.getItem('humildeMode');
        if (savedMode !== null) {
            humildeActivo = savedMode === 'true';
        } else {
            // Si no hay guardado, activar en móvil por defecto
            humildeActivo = isMobile;
        }

        // Aplicar configuración inicial
        if (humildeActivo) {
            setupHumildeMode();
        } else {
            setupHighQuality();
        }

        // Sincronizar checkbox
        const humildeCheck = document.getElementById('humilde-mode');
        humildeCheck.checked = humildeActivo;

        // --- Evento del checkbox ---
        humildeCheck.addEventListener('change', (e) => {
            const activado = e.target.checked;
            if (activado) {
                setupHumildeMode();
            } else {
                setupHighQuality();
            }
            // Guardar preferencia
            localStorage.setItem('humildeMode', activado);
        });

        // --- Mostrar/ocultar panel al hacer clic en la tuerca ---
        const settingsButton = document.getElementById('settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        settingsButton.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.classList.toggle('visible');
        });

        // Cerrar panel si se hace clic fuera
        document.addEventListener('click', (e) => {
            if (!settingsButton.contains(e.target) && !settingsPanel.contains(e.target)) {
                settingsPanel.classList.remove('visible');
            }
        });

        // Evitar que clic dentro del panel lo cierre
        settingsPanel.addEventListener('click', (e) => e.stopPropagation());

        // --- Cargador de modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según tu lista

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    // Las sombras según el modo actual
                    const currentShadowState = renderer.shadowMap.enabled;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = currentShadowState;
                            node.receiveShadow = currentShadowState;
                        }
                    });
                    scene.add(model);
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {},
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        // Lista de modelos
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir scroll táctil ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página cargada. Modo humilde inicial:', humildeActivo ? 'activado' : 'desactivado');
    </script>
</body>
</html>
