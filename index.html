<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitación 3D - Modelos GLB</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="info">🏠 Habitación interactiva (Usa el mouse para mover la cámara)</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuración básica de la escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // Color de fondo oscuro para simular una habitación cerrada

        // --- Cámara ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Vista más arriba y lejos
        camera.position.set(8, 12, 15);
        camera.lookAt(0, 2, 0);

        // --- Renderizador ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controles de órbita ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 2;
        controls.maxDistance = 25;
        controls.target.set(0, 2, 0);

        // --- Luces existentes ---
        
        // Luz ambiental
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Luz direccional principal
        const directionalLight = new THREE.DirectionalLight(0xfff5e6, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        directionalLight.receiveShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        const d = 10;
        directionalLight.shadow.camera.left = -d;
        directionalLight.shadow.camera.right = d;
        directionalLight.shadow.camera.top = d;
        directionalLight.shadow.camera.bottom = -d;
        directionalLight.shadow.camera.near = 2;
        directionalLight.shadow.camera.far = 20;
        directionalLight.shadow.bias = -0.0005;
        scene.add(directionalLight);

        // Luz de relleno desde atrás
        const backLight = new THREE.PointLight(0x4466ff, 0.5);
        backLight.position.set(-3, 2, -3);
        scene.add(backLight);

        // Luz puntual cálida
        const pointLight = new THREE.PointLight(0xffaa66, 0.8, 10);
        pointLight.position.set(2, 3, 2);
        scene.add(pointLight);

        // --- NUEVA LUZ DE FOCO (SPOTLIGHT) ---
        // Creamos un spotlight con intensidad 1.5, ángulo de apertura de 30° (0.5 rad aprox) y atenuación suave
        const spotLight = new THREE.SpotLight(0xffeedd, 1.5);
        spotLight.position.set(2, 5, 3); // Colócalo donde quieras, por ejemplo encima de la silla
        spotLight.target.position.set(0, 1, 0); // Hacia dónde apunta (centro de la habitación)
        scene.add(spotLight.target); // ¡Importante añadir el target a la escena!
        
        // Configuración del foco
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        spotLight.shadow.bias = -0.0001;
        spotLight.angle = 0.6; // Ángulo del cono (radianes) ~34 grados
        spotLight.penumbra = 0.3; // Suavizado del borde
        spotLight.decay = 1; // Atenuación
        spotLight.distance = 20; // Distancia máxima de alcance
        
        scene.add(spotLight);

        // Opcional: añadir un pequeño helper para visualizar la posición del foco (puedes eliminarlo después)
        // const spotLightHelper = new THREE.SpotLightHelper(spotLight);
        // scene.add(spotLightHelper);

        // --- Cargador de modelos GLB ---
        const loader = new GLTFLoader();

        function loadModel(path, scene) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    scene.add(model);
                    console.log(`Modelo cargado: ${path}`);
                },
                (xhr) => {
                    console.log(`${path} ${(xhr.loaded / xhr.total * 100)}% cargado`);
                },
                (error) => {
                    console.error(`Error al cargar ${path}:`, error);
                }
            );
        }

        // Cargamos todos los modelos
        loadModel('piso.glb', scene);
        loadModel('alfombra.glb', scene);
        loadModel('silla.glb', scene);
        loadModel('paredes.glb', scene);
        loadModel('cama.glb', scene);
        loadModel('cortinas.glb', scene);
        loadModel('tele.glb', scene);
        loadModel('mueble1.glb', scene);
        loadModel('mueble2.glb', scene);
        loadModel('pc.glb', scene);
        loadModel('decoracion_escritorio.glb', scene);
        loadModel('decoracion_mueble_1.glb', scene);
        loadModel('decoracion_mueble_2.glb', scene);
        loadModel('poster_1.glb', scene);
        loadModel('poster_2.glb', scene);
        loadModel('poster_3.glb', scene);
        loadModel('poster_4.glb', scene);
        loadModel('interruptor.glb', scene);
        loadModel('maouse_pad.glb', scene);
        loadModel('lunari2.glb', scene);

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('Página lista. Se ha añadido un spotlight adicional.');
    </script>
</body>
</html>
