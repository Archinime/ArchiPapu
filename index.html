<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitación 3D - Iluminación Mejorada</title>
    <style>
        body { margin:0; overflow:hidden; font-family:Arial, Helvetica, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="info">🏠 Habitación interactiva (Iluminación mejorada)</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // Cámara (vista elevada)
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 12, 15);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 2;
        controls.maxDistance = 25;
        controls.target.set(0, 2, 0);

        // --- LUCES MEJORADAS ---

        // 1. Ambiental más brillante (color más claro y mayor intensidad)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // Intensidad 1.2
        scene.add(ambientLight);

        // 2. Direccional principal más fuerte
        const directionalLight = new THREE.DirectionalLight(0xfff5e6, 2.0); // Intensidad 2.0
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        directionalLight.receiveShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        const d = 10;
        directionalLight.shadow.camera.left = -d;
        directionalLight.shadow.camera.right = d;
        directionalLight.shadow.camera.top = d;
        directionalLight.shadow.camera.bottom = -d;
        directionalLight.shadow.camera.near = 2;
        directionalLight.shadow.camera.far = 20;
        directionalLight.shadow.bias = -0.0005;
        scene.add(directionalLight);

        // 3. Luz de relleno desde atrás (más intensa)
        const backLight = new THREE.PointLight(0x4466ff, 1.0);
        backLight.position.set(-3, 4, -3);
        scene.add(backLight);

        // 4. Luz puntual cálida (más intensa)
        const pointLight = new THREE.PointLight(0xffaa66, 1.5, 15);
        pointLight.position.set(2, 4, 2);
        scene.add(pointLight);

        // 5. NUEVO: Foco desde el techo hacia el centro
        const spotLight = new THREE.SpotLight(0xffffff, 1.8);
        spotLight.position.set(0, 8, 0); // En el techo
        spotLight.target.position.set(0, 1, 0);
        scene.add(spotLight.target);
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        spotLight.angle = 0.8;        // Cono amplio
        spotLight.penumbra = 0.5;
        spotLight.decay = 1;
        spotLight.distance = 20;
        scene.add(spotLight);

        // 6. NUEVO: Luz puntual adicional cerca de la silla
        const sillaLight = new THREE.PointLight(0xffcc88, 1.2, 8);
        sillaLight.position.set(1.5, 2.5, 1.5);
        scene.add(sillaLight);

        // --- Cargador de modelos ---
        const loader = new GLTFLoader();

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    scene.add(model);
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {
                    console.log(`${path} ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`);
                },
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                }
            );
        }

        // Lista de modelos (agrega aquí todos los que tengas)
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(m => loadModel(m));

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Escena cargada con iluminación mejorada.');
    </script>
</body>
</html>
