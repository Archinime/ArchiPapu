<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Inventario Total</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
        /* --- BOTONES SUPERIORES --- */
        .top-btn {
            position: absolute;
            top: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        .top-btn:hover { transform: scale(1.1); }
        .top-btn:active { transform: scale(0.95); }
        
        #settings-button { right: 20px; }
        #inventory-button { right: 75px; }

        /* --- UI DE MONEDAS --- */
        #coin-display {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.5);
            color: gold;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            z-index: 300;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* --- PANELES --- */
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible { display: block; }
        #settings-panel label {
            display: flex; align-items: center; justify-content: space-between; gap: 15px; cursor: pointer; user-select: none; margin-bottom: 10px;
        }
        #settings-panel input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #4CAF50; }
        
        #quality-indicator {
            background: #4CAF50; color: white; padding: 4px 10px; border-radius: 50px; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; text-align: center; margin-bottom: 10px;
        }

        /* --- MODAL INVENTARIO / TIENDA --- */
        #inventory-modal {
            display: none; position: fixed; top: 5%; left: 5%; width: 90%; height: 90%;
            background: rgba(20,20,25,0.95); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            z-index: 1000; color: white; padding: 20px; box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            flex-direction: column;
        }
        #inventory-modal.visible { display: flex; }
        #inv-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        #inv-header h2 { margin: 0; font-size: 24px; }
        #close-inv { cursor: pointer; font-size: 24px; background: none; border: none; color: white; }
        
        #inv-body { display: flex; flex: 1; margin-top: 15px; gap: 20px; overflow: hidden; }
        #inv-sidebar { width: 30%; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; padding-right: 10px; }
        .cat-btn { width: 100%; text-align: left; padding: 12px 15px; background: transparent; color: #ccc; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 5px; font-size: 14px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cat-btn:hover { background: rgba(255,255,255,0.05); color: white; }
        .cat-btn.active { background: #4CAF50; color: white; font-weight: bold; }
        
        #inv-content { width: 70%; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; align-content: start; }
        .item-card { background: rgba(40,40,50,0.8); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .item-card h4 { margin: 0 0 10px 0; font-size: 16px; color: #eee; }
        .item-price { color: gold; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        .item-btn { padding: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-buy { background: #FF9800; color: white; }
        .btn-buy:hover { background: #F57C00; }
        .btn-equip { background: #2196F3; color: white; }
        .btn-equip:hover { background: #1976D2; }
        .btn-equipped { background: #4CAF50; color: white; cursor: default; }

        @media (max-width: 600px) {
            .top-btn { top: 10px; width: 40px; height: 40px; font-size: 20px; }
            #settings-button { right: 10px; }
            #inventory-button { right: 60px; }
            #settings-panel { top: 60px; right: 10px; padding: 12px 15px; font-size: 13px; min-width: 180px; }
            #coin-display { top: 10px; left: 10px; font-size: 14px; padding: 8px 12px; }
            #inv-body { flex-direction: column; }
            #inv-sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; overflow-x: auto; padding-bottom: 10px; }
            .cat-btn { width: auto; margin-right: 10px; margin-bottom: 0; }
            #inv-content { width: 100%; }
        }

        /* --- ESTADOS --- */
        #loading, #light-status {
            position: absolute; bottom: 20px; color: white; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 10px; font-size: 12px; z-index: 100; pointer-events: none; backdrop-filter: blur(4px);
        }
        #loading { right: 20px; }
        #light-status { left: 20px; }
    </style>
</head>
<body>
    <div id="coin-display">🪙 <span id="coin-amount">0</span></div>
    
    <div id="inventory-button" class="top-btn" title="Inventario y Tienda">🎒</div>
    <div id="settings-button" class="top-btn" title="Ajustes">⚙️</div>

    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>

    <div id="inventory-modal">
        <div id="inv-header">
            <h2>🎒 Inventario y Tienda</h2>
            <button id="close-inv">✖</button>
        </div>
        <div id="inv-body">
            <div id="inv-sidebar"></div>
            <div id="inv-content"></div>
        </div>
    </div>

    <div id="loading">Preparando habitación...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

        // --- SISTEMA DE DATOS E INVENTARIO ---
        let playerCoins = parseInt(localStorage.getItem('room_coins')) || 1000;
        document.getElementById('coin-amount').innerText = playerCoins;

        // CADA OBJETO TIENE SU PROPIA CATEGORÍA (SLOT INDIVIDUAL)
        const defaultInventoryConfig = {
            // Estructura de la habitación
            piso: { label: "🪵 Piso", equipped: "base", items: { "base": { name: "Piso Estándar", file: "piso.glb", price: 0, owned: true } } },
            paredes: { label: "🧱 Paredes", equipped: "base", items: { "base": { name: "Paredes Blancas", file: "paredes.glb", price: 0, owned: true } } },
            techo: { label: "قف Techo", equipped: "base", items: { "base": { name: "Techo Base", file: "techo.glb", price: 0, owned: true } } },
            puerta: { label: "🚪 Puerta", equipped: "base", items: { "base": { name: "Puerta Madera", file: "puerta.glb", price: 0, owned: true } } },
            
            // Iluminación
            interruptor: { label: "🔘 Interruptor", equipped: "base", items: { "base": { name: "Interruptor Simple", file: "interruptor.glb", price: 0, owned: true } } },
            base_foco: { label: "🔌 Base Foco", equipped: "base", items: { "base": { name: "Base Blanca", file: "base_foco.glb", price: 0, owned: true } } },
            foco: { label: "💡 Foco", equipped: "base", items: { "base": { name: "Foco Led", file: "foco.glb", price: 0, owned: true } } },
            
            // Muebles principales
            cama: { label: "🛏️ Cama", equipped: "base", items: { "base": { name: "Cama Estándar", file: "cama.glb", price: 0, owned: true } } },
            silla: { label: "🪑 Silla", equipped: "base", items: { "base": { name: "Silla Escritorio", file: "silla.glb", price: 0, owned: true } } },
            pc: { label: "💻 Setup PC", equipped: "base", items: { "base": { name: "PC Básica", file: "pc.glb", price: 0, owned: true } } },
            tele: { label: "📺 Televisor", equipped: "base", items: { "base": { name: "TV Plasma", file: "tele.glb", price: 0, owned: true } } },
            mueble1: { label: "🗄️ Mueble 1 (Principal)", equipped: "base", items: { "base": { name: "Estante 1", file: "mueble1.glb", price: 0, owned: true } } },
            mueble2: { label: "🗄️ Mueble 2 (Secundario)", equipped: "base", items: { "base": { name: "Estante 2", file: "mueble2.glb", price: 0, owned: true } } },
            
            // Textiles y Extras
            alfombra: { label: "🧶 Alfombra", equipped: "base", items: { "base": { name: "Alfombra Gris", file: "alfombra.glb", price: 0, owned: true } } },
            cortinas: { label: "🪟 Cortinas", equipped: "base", items: { "base": { name: "Cortinas Claras", file: "cortinas.glb", price: 0, owned: true } } },
            mousepad: { label: "🖱️ Mouse Pad", equipped: "base", items: { "base": { name: "Mouse Pad Negro", file: "maouse_pad.glb", price: 0, owned: true } } },

            // Pósters (CADA UNO SEPARADO)
            poster_1: { label: "🖼️ Póster 1", equipped: "base", items: { "base": { name: "Póster Default 1", file: "poster_1.glb", price: 0, owned: true } } },
            poster_2: { label: "🖼️ Póster 2", equipped: "base", items: { "base": { name: "Póster Default 2", file: "poster_2.glb", price: 0, owned: true } } },
            poster_3: { label: "🖼️ Póster 3", equipped: "base", items: { "base": { name: "Póster Default 3", file: "poster_3.glb", price: 0, owned: true } } },
            poster_4: { label: "🖼️ Póster 4", equipped: "base", items: { "base": { name: "Póster Default 4", file: "poster_4.glb", price: 0, owned: true } } },
            
            // Decoraciones (CADA UNA SEPARADA)
            deco_escritorio: { label: "🪴 Deco: Escritorio", equipped: "base", items: { "base": { name: "Plantita Escritorio", file: "decoracion_escritorio.glb", price: 0, owned: true } } },
            deco_piso: { label: "🪴 Deco: Piso", equipped: "base", items: { "base": { name: "Planta de Piso", file: "decoracion_piso.glb", price: 0, owned: true } } },
            deco_mueble_1: { label: "🪴 Deco: Mueble 1 (A)", equipped: "base", items: { "base": { name: "Adorno 1", file: "decoracion_mueble_1.glb", price: 0, owned: true } } },
            deco_2_mueble_1: { label: "🪴 Deco: Mueble 1 (B)", equipped: "base", items: { "base": { name: "Adorno 2", file: "decoracion_2_mueble_1.glb", price: 0, owned: true } } },
            deco_3_mueble_1: { label: "🪴 Deco: Mueble 1 (C)", equipped: "base", items: { "base": { name: "Adorno 3", file: "decoracion_3_mueble_1.glb", price: 0, owned: true } } },
            deco_4_mueble_1: { label: "🪴 Deco: Mueble 1 (D)", equipped: "base", items: { "base": { name: "Adorno 4", file: "decoracion_4_mueble_1.glb", price: 0, owned: true } } },
            deco_5_mueble_1: { label: "🪴 Deco: Mueble 1 (E)", equipped: "base", items: { "base": { name: "Adorno 5", file: "decoracion_5_mueble_1.glb", price: 0, owned: true } } },
            deco_mueble_2: { label: "🪴 Deco: Mueble 2 (A)", equipped: "base", items: { "base": { name: "Libros", file: "decoracion_mueble_2.glb", price: 0, owned: true } } },
            deco_2_mueble_2: { label: "🪴 Deco: Mueble 2 (B)", equipped: "base", items: { "base": { name: "Reloj", file: "decoracion_2_mueble_2.glb", price: 0, owned: true } } }
        };

        // Cargar o inicializar progreso
        let inventoryData = JSON.parse(localStorage.getItem('room_inventory')) || defaultInventoryConfig;

        // Sincronizar objetos nuevos por si agregas algo al código base en el futuro
        for (let cat in defaultInventoryConfig) {
            if(!inventoryData[cat]) inventoryData[cat] = defaultInventoryConfig[cat];
            for(let item in defaultInventoryConfig[cat].items) {
                if(!inventoryData[cat].items[item]) {
                    inventoryData[cat].items[item] = defaultInventoryConfig[cat].items[item];
                }
            }
        }

        function saveGame() {
            localStorage.setItem('room_coins', playerCoins);
            localStorage.setItem('room_inventory', JSON.stringify(inventoryData));
            document.getElementById('coin-amount').innerText = playerCoins;
        }

        const loadedSlotMeshes = {}; 
        let switchMesh = null;
        let focoMesh = null;

        // --- Detección de dispositivo ---
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const width = window.innerWidth;
        let deviceType = (width < 768 || (isMobileUA && width < 1024)) ? 'mobile' : (width >= 768 && width <= 1024) ? 'tablet' : 'desktop';

        // --- Escena y Cámara ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 200);
        let camPosY = 6, camPosZ = 14, targetY = 6;
        if (deviceType === 'mobile') { camPosY = 6; camPosZ = 12; targetY = 5; }
        camera.position.set(0, camPosY, camPosZ);

        // --- RENDERIZADOR ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.0;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const effect = new OutlineEffect(renderer, {
            defaultThickness: 0.0008, defaultColor: [0.05, 0.05, 0.08], defaultAlpha: 0.85, defaultKeepAlive: true
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, targetY, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 2.5; controls.maxDistance = 16;
        controls.enablePan = false;

        // --- LUCES ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.3); scene.add(ambient);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4); hemiLight.position.set(0, 20, 0); scene.add(hemiLight);
        
        const mainLight = new THREE.SpotLight(0xffeedd, 6);
        mainLight.position.set(2, 22, 2); mainLight.angle = Math.PI / 3; mainLight.penumbra = 0.8; mainLight.decay = 2; mainLight.distance = 60;
        mainLight.castShadow = true; mainLight.shadow.mapSize.set(2048, 2048);
        mainLight.shadow.camera.near = 0.5; mainLight.shadow.camera.far = 40; mainLight.shadow.bias = -0.0001; mainLight.shadow.normalBias = 0.02; mainLight.shadow.radius = 4; 
        scene.add(mainLight); scene.add(mainLight.target);

        let lightOn = localStorage.getItem('lightState') !== 'off';
        const perfCheck = document.getElementById('performance-mode');
        perfCheck.checked = localStorage.getItem('performanceMode') === 'true';

        function applyMaterialLogic(model, categoryKey) {
            const isLow = perfCheck.checked;
            const isFoco = categoryKey === 'foco';
            
            model.traverse((node) => {
                if (node.isMesh) {
                    if (isFoco) {
                        node.castShadow = false; node.receiveShadow = false;
                        if (node.material) {
                            node.material.emissive = new THREE.Color(0xffeedd);
                            node.material.emissiveIntensity = lightOn ? 1.5 : 0;
                        }
                    } else {
                        node.castShadow = !isLow; node.receiveShadow = !isLow;
                        if(node.material) {
                            node.material.shadowSide = THREE.FrontSide;
                            if(node.name.toLowerCase().includes('pared') || node.name.toLowerCase().includes('piso')) {
                                node.material.shadowSide = THREE.BackSide;
                            }
                            node.material.side = THREE.DoubleSide;
                            node.material.needsUpdate = true;
                        }
                    }
                }
            });
        }

        // --- CARGA DE MODELOS ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        let totalModelsToLoad = Object.keys(inventoryData).length; 

        function checkLoading() {
            modelsLoaded++;
            document.getElementById('loading').innerText = `Cargando: ${modelsLoaded}/${totalModelsToLoad}`;
            if (modelsLoaded >= totalModelsToLoad) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadItemForSlot(categoryKey, itemFile, isInitialLoad = false) {
            if (loadedSlotMeshes[categoryKey]) {
                scene.remove(loadedSlotMeshes[categoryKey]);
            }

            loader.load(itemFile, (gltf) => {
                const model = gltf.scene;
                applyMaterialLogic(model, categoryKey);
                
                // Lógica especial para Foco y Luz
                if (categoryKey === 'foco') {
                    focoMesh = model;
                    const box = new THREE.Box3().setFromObject(model);
                    const center = new THREE.Vector3(); box.getCenter(center);
                    mainLight.position.copy(center); mainLight.position.y -= 0.2; 
                }
                
                // Lógica especial para Interruptor
                if (categoryKey === 'interruptor') switchMesh = model;

                scene.add(model);
                loadedSlotMeshes[categoryKey] = model; 
                if(isInitialLoad) checkLoading();
            }, undefined, (e) => { 
                console.error(`Falta el modelo para [${categoryKey}]:`, itemFile); 
                if(isInitialLoad) checkLoading(); 
            });
        }

        // Cargar todos los objetos equipados al inicio
        for (let cat in inventoryData) {
            let equippedItemId = inventoryData[cat].equipped;
            let file = inventoryData[cat].items[equippedItemId].file;
            loadItemForSlot(cat, file, true);
        }

        // --- SISTEMA DE ILUMINACIÓN ---
        function updateLighting() {
            const isLow = perfCheck.checked;
            if (lightOn) {
                mainLight.visible = true; ambient.intensity = isLow ? 0.8 : 0.3; hemiLight.intensity = isLow ? 0.8 : 0.4;
                document.getElementById('light-status').innerText = '💡 Luz encendida';
                if (focoMesh) focoMesh.traverse((n) => { if (n.isMesh && n.material) n.material.emissiveIntensity = 1.5; });
            } else {
                mainLight.visible = false; ambient.intensity = 0.02; hemiLight.intensity = 0.05; 
                document.getElementById('light-status').innerText = '💡 Luz apagada';
                if (focoMesh) focoMesh.traverse((n) => { if (n.isMesh && n.material) n.material.emissiveIntensity = 0; });
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        function toggleLight() {
            lightOn = !lightOn; localStorage.setItem('lightState', lightOn ? 'on' : 'off'); updateLighting();
        }

        function handleInteraction(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;
            mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((y - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            if (switchMesh && raycaster.intersectObject(switchMesh, true).length > 0) {
                toggleLight();
            }
        }
        renderer.domElement.addEventListener('click', handleInteraction);
        renderer.domElement.addEventListener('touchstart', (e) => { 
            if(document.getElementById('inventory-modal').classList.contains('visible')) return;
            handleInteraction(e); 
        }, {passive: true});

        // --- Calidad / Modo Humilde ---
        function updateQuality() {
            const isLow = perfCheck.checked;
            renderer.shadowMap.enabled = !isLow;
            renderer.setPixelRatio(isLow ? 1 : Math.min(window.devicePixelRatio, 2));
            document.getElementById('quality-indicator').textContent = isLow ? 'Modo Humilde' : 'Calidad Alta';
            
            scene.traverse(n => { 
                if(n.isMesh) { 
                    if (focoMesh && (n === focoMesh || focoMesh.children.includes(n))) return;
                    n.castShadow = !isLow; n.receiveShadow = !isLow; 
                    if(n.material) n.material.needsUpdate = true; 
                }
            });
            localStorage.setItem('performanceMode', isLow);
            updateLighting(); 
        }
        perfCheck.addEventListener('change', updateQuality);

        // --- LÓGICA DE INTERFAZ DEL INVENTARIO ---
        let currentCategory = 'cama';

        function renderInventory() {
            const sidebar = document.getElementById('inv-sidebar');
            const content = document.getElementById('inv-content');
            sidebar.innerHTML = ''; content.innerHTML = '';

            for (let catKey in inventoryData) {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${catKey === currentCategory ? 'active' : ''}`;
                btn.innerText = inventoryData[catKey].label;
                btn.onclick = () => { currentCategory = catKey; renderInventory(); };
                sidebar.appendChild(btn);
            }

            const catData = inventoryData[currentCategory];
            for (let itemId in catData.items) {
                const item = catData.items[itemId];
                const isEquipped = catData.equipped === itemId;
                
                const card = document.createElement('div');
                card.className = 'item-card';
                
                let btnHTML = '';
                if (isEquipped) {
                    btnHTML = `<button class="item-btn btn-equipped" disabled>Equipado ✓</button>`;
                } else if (item.owned) {
                    btnHTML = `<button class="item-btn btn-equip" data-id="${itemId}">Equipar</button>`;
                } else {
                    btnHTML = `<button class="item-btn btn-buy" data-id="${itemId}">Comprar 🪙${item.price}</button>`;
                }

                card.innerHTML = `
                    <div>
                        <h4>${item.name}</h4>
                        <div class="item-price">${item.owned ? 'Adquirido' : `🪙 ${item.price}`}</div>
                    </div>
                    ${btnHTML}
                `;
                content.appendChild(card);
            }

            document.querySelectorAll('.btn-equip').forEach(b => {
                b.onclick = (e) => equipItem(currentCategory, e.target.getAttribute('data-id'));
            });
            document.querySelectorAll('.btn-buy').forEach(b => {
                b.onclick = (e) => buyItem(currentCategory, e.target.getAttribute('data-id'));
            });
        }

        function equipItem(category, itemId) {
            inventoryData[category].equipped = itemId;
            saveGame();
            renderInventory(); 
            loadItemForSlot(category, inventoryData[category].items[itemId].file, false);
        }

        function buyItem(category, itemId) {
            let item = inventoryData[category].items[itemId];
            if (playerCoins >= item.price) {
                playerCoins -= item.price;
                item.owned = true;
                saveGame();
                renderInventory();
            } else {
                alert("No tienes suficientes monedas.");
            }
        }

        // Eventos UI
        document.getElementById('inventory-button').onclick = () => {
            document.getElementById('inventory-modal').classList.add('visible');
            renderInventory();
        };
        document.getElementById('close-inv').onclick = () => {
            document.getElementById('inventory-modal').classList.remove('visible');
        };
        document.getElementById('settings-button').onclick = () => {
            document.getElementById('settings-panel').classList.toggle('visible');
        };

        // --- Animación y Resize ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            effect.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight); 
        });

        updateQuality();
    </script>
</body>
</html>
