<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Luz interactiva</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        /* Botón de configuración (tuerca) */
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover {
            transform: scale(1.1);
        }
        #settings-button:active {
            transform: scale(0.95);
        }
        /* Panel de configuración (oculto por defecto) */
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible {
            display: block;
        }
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 10px;
        }
        #settings-panel label:last-child {
            margin-bottom: 0;
        }
        #settings-panel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            #settings-button {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            #settings-panel {
                top: 60px;
                right: 10px;
                padding: 12px 15px;
                font-size: 13px;
                min-width: 180px;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #light-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- Botón de tuerca -->
    <div id="settings-button">⚙️</div>
    <!-- Panel de configuración -->
    <div id="settings-panel">
        <div id="quality-indicator">Modo Humilde</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="humble-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <!-- Importamos Three.js y extras -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Detectar móvil ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // --- Variables globales ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // --- Cámara ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        // --- Renderizador WebGL ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Activado pero solo lo usará el foco si está encendido
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
        document.body.appendChild(renderer.domElement);

        // --- Renderizador CSS2D para el glow (usaremos un div en lugar de CSS2D para mejor efecto) ---
        // Mejor usar un sprite o un objeto 3D, pero para simplificar haremos un halo con un punto luminoso
        
        // --- Controles ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        
        // Ajustar rango de rotación horizontal: más amplio en móvil, estándar en PC
        if (isMobile) {
            controls.minAzimuthAngle = -Math.PI / 3; // -60 grados
            controls.maxAzimuthAngle = Math.PI / 3;  // +60 grados
        } else {
            controls.minAzimuthAngle = -Math.PI / 6; // -30 grados
            controls.maxAzimuthAngle = Math.PI / 6;  // +30 grados
        }
        
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // --- Variables para la luz y el interruptor ---
        let mainLight; // Será el spotlight único
        let lightOn = true; // Estado inicial: encendida
        let switchModel = null; // Referencia al modelo interruptor.glb
        let glowSprite = null; // Para el efecto de brillo alrededor del interruptor

        // --- Configurar la luz única (foco) ---
        function createMainLight() {
            if (mainLight) scene.remove(mainLight);
            
            // Creamos un spotlight con alta intensidad y gran rango
            mainLight = new THREE.SpotLight(0xffeedd, 2.5); // Intensidad alta
            mainLight.position.set(0, 10, 2); // Posición del foco (ajústala según tu habitación)
            mainLight.target.position.set(0, 1, 0); // Apunta al centro
            scene.add(mainLight.target);
            
            // Configurar sombras
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            mainLight.shadow.bias = -0.0005;
            mainLight.angle = 0.8;       // Ángulo del cono (~45°)
            mainLight.penumbra = 0.3;     // Borde suave
            mainLight.decay = 1;           // Atenuación realista
            mainLight.distance = 40;        // Gran alcance
            
            scene.add(mainLight);
            
            // Luz ambiental mínima para que no quede todo negro cuando se apaga el foco
            const ambient = new THREE.AmbientLight(0x333344, 0.3);
            scene.add(ambient);
        }
        
        createMainLight();

        // --- Función para encender/apagar la luz ---
        function toggleLight() {
            lightOn = !lightOn;
            mainLight.intensity = lightOn ? 2.5 : 0;
            // Actualizar texto indicador
            document.getElementById('light-status').innerHTML = lightOn ? '💡 Luz encendida' : '💡 Luz apagada';
            
            // También podríamos animar el glow del interruptor (parpadeo)
            if (glowSprite) {
                glowSprite.material.opacity = lightOn ? 0.8 : 0.2;
            }
        }

        // --- Cargador de modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según tu lista

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Función para crear un sprite de glow alrededor de un objeto
        function createGlowSprite(position) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // Dibujar un círculo radial con gradiente
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
            gradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 100, 50, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ 
                map: texture, 
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(0.8, 0.8, 1); // Tamaño del glow
            sprite.position.copy(position);
            sprite.position.y += 0.3; // Ajustar para que rodee el interruptor
            return sprite;
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    
                    // Si es el interruptor, guardamos referencia y añadimos glow
                    if (path.includes('interruptor.glb')) {
                        switchModel = model;
                        
                        // Añadir un sprite de glow alrededor
                        model.traverse((node) => {
                            if (node.isMesh) {
                                // Usamos la posición del mesh para el glow
                                const worldPos = new THREE.Vector3();
                                node.getWorldPosition(worldPos);
                                glowSprite = createGlowSprite(worldPos);
                                scene.add(glowSprite);
                            }
                        });
                        
                        // Hacer el modelo interactivo
                        model.userData.interactable = true;
                        model.userData.onClick = toggleLight;
                        
                        // Opcional: resaltar cuando el mouse está cerca (pero eso es más complejo)
                    }
                    
                    // Configurar sombras según el modo actual (pero como solo tenemos un foco, solo él proyecta sombras)
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    
                    scene.add(model);
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {},
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        // Lista de modelos
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Sistema de detección de clics en objetos ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onClick(event) {
            // Calcular posición del mouse en coordenadas normalizadas (-1 a 1)
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Encontrar objetos intersectados
            const intersects = raycaster.intersectObjects(scene.children, true); // true para hijos
            
            for (let intersect of intersects) {
                let obj = intersect.object;
                // Buscar hacia arriba si el objeto tiene userData.interactable
                while (obj && !obj.userData?.interactable) {
                    obj = obj.parent;
                }
                if (obj && obj.userData?.interactable && obj.userData?.onClick) {
                    obj.userData.onClick();
                    break;
                }
            }
        }

        renderer.domElement.addEventListener('click', onClick);
        // Para móvil, también con touch
        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            onClick(e.touches[0]);
        }, { passive: false });

        // --- Configuración del modo humilde (para móvil por defecto) ---
        const humbleCheck = document.getElementById('humble-mode');
        const qualityIndicator = document.getElementById('quality-indicator');
        
        // Leer preferencia guardada
        const savedHumble = localStorage.getItem('humbleMode');
        let humbleMode = savedHumble !== null ? savedHumble === 'true' : isMobile; // Por defecto true en móvil
        
        humbleCheck.checked = humbleMode;
        applyHumbleMode(humbleMode);
        
        function applyHumbleMode(active) {
            if (active) {
                // Modo humilde: reducir calidad visual pero mantener el foco
                renderer.setPixelRatio(1);
                renderer.shadowMap.enabled = false; // Desactivar sombras para mejorar rendimiento
                controls.enableDamping = false;
                controls.maxDistance = 18;
                qualityIndicator.textContent = 'Modo Humilde (bajo consumo)';
            } else {
                // Modo normal (alta calidad)
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
                renderer.shadowMap.enabled = true;
                controls.enableDamping = true;
                controls.maxDistance = 30;
                qualityIndicator.textContent = 'Modo Normal (alta calidad)';
            }
            // Las sombras del foco se ven afectadas por shadowMap.enabled
            if (mainLight) {
                mainLight.castShadow = !active; // En modo humilde, desactivar sombras del foco
            }
            // Guardar preferencia
            localStorage.setItem('humbleMode', active);
        }
        
        humbleCheck.addEventListener('change', (e) => {
            applyHumbleMode(e.target.checked);
        });

        // --- Mostrar/ocultar panel de configuración ---
        const settingsButton = document.getElementById('settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        settingsButton.addEventListener('click', () => {
            settingsPanel.classList.toggle('visible');
        });
        document.addEventListener('click', (e) => {
            if (!settingsButton.contains(e.target) && !settingsPanel.contains(e.target)) {
                settingsPanel.classList.remove('visible');
            }
        });

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotar el glow suavemente (opcional)
            if (glowSprite) {
                glowSprite.rotation.y += 0.01;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir scroll táctil ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página cargada con un único foco interactivo.');
    </script>
</body>
</html>
