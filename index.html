<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitación 3D - Modelos GLB</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="info">🏠 Habitación interactiva (Usa el mouse para mover la cámara)</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuración básica de la escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // Color de fondo oscuro para simular una habitación cerrada

        // --- Cámara ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Vista más arriba y lejos
        camera.position.set(8, 12, 15); // Aumentamos Y y alejamos en Z
        camera.lookAt(0, 2, 0);

        // --- Renderizador ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Activamos sombras por si acaso (los modelos deben tener configuradas las sombras en Blender)
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombras más suaves
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controles de órbita (para moverse como en un videojuego) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Suavizado de movimiento
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2; // Evita que la cámara vaya por debajo del suelo
        controls.minDistance = 2;
        controls.maxDistance = 25; // Aumentamos para permitir alejarse más
        controls.target.set(0, 2, 0); // El centro de interés ahora más alto

        // --- Luces ---
        
        // Luz ambiental suave para iluminar todo
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Luz principal (similar a una ventana o foco)
        const directionalLight = new THREE.DirectionalLight(0xfff5e6, 1);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        directionalLight.receiveShadow = true;
        
        // Configurar sombras para la luz direccional
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        const d = 10;
        directionalLight.shadow.camera.left = -d;
        directionalLight.shadow.camera.right = d;
        directionalLight.shadow.camera.top = d;
        directionalLight.shadow.camera.bottom = -d;
        directionalLight.shadow.camera.near = 2;
        directionalLight.shadow.camera.far = 20;
        directionalLight.shadow.bias = -0.0005;
        scene.add(directionalLight);

        // Luz de relleno desde atrás
        const backLight = new THREE.PointLight(0x4466ff, 0.5);
        backLight.position.set(-3, 2, -3);
        scene.add(backLight);

        // Una luz puntual cálida para dar ambiente
        const pointLight = new THREE.PointLight(0xffaa66, 0.8, 10);
        pointLight.position.set(2, 3, 2);
        scene.add(pointLight);

        // --- Cargador de modelos GLB ---
        const loader = new GLTFLoader();

        // Función para cargar modelos manteniendo su transformación original
        function loadModel(path, scene) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    
                    // Asegurar que el modelo y sus hijos puedan recibir y proyectar sombras
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    
                    scene.add(model);
                    console.log(`Modelo cargado: ${path}`);
                },
                (xhr) => {
                    // Progreso de carga (opcional)
                    console.log(`${path} ${(xhr.loaded / xhr.total * 100)}% cargado`);
                },
                (error) => {
                    console.error(`Error al cargar ${path}:`, error);
                }
            );
        }

        // Cargamos los modelos (asegúrate de que están en la misma carpeta)
        loadModel('piso.glb', scene);
        loadModel('alfombra.glb', scene);
        loadModel('silla.glb', scene);
        loadModel('lunari2.glb', scene); // Modelo adicional

        // --- Animación y renderizado continuo ---
        function animate() {
            requestAnimationFrame(animate);

            // Actualizar controles (necesario para damping)
            controls.update();

            // Renderizar la escena
            renderer.render(scene, camera);
        }

        animate();

        // --- Manejar cambio de tamaño de la ventana ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Pequeño mensaje en consola
        console.log('Página lista. Modelos: piso, alfombra, silla, lunari2');
    </script>
</body>
</html>
