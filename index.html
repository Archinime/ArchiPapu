<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport para correcto escalado en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Optimizada Móvil</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            /* Evita el rebote en iOS */
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            /* Adaptación para móvil: texto más pequeño si es necesario */
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 600px) {
            #info {
                font-size: 12px;
                top: 10px;
                left: 10px;
                padding: 5px 10px;
            }
        }
        /* Indicador de carga opcional (se puede añadir luego) */
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="info">🏠 Habitación interactiva (vista fija, optimizada móvil)</div>
    <div id="loading">Cargando modelos...</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Detectar móvil para ajustar calidad ---
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        // --- Configuración básica de la escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // --- Cámara (frontal elevada y lejana) ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        // --- Renderizador con optimizaciones para móvil ---
        const renderer = new THREE.WebGLRenderer({ 
            antialias: !isMobile, // En móvil, desactivamos antialiasing para mejorar rendimiento
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = isMobile ? THREE.PCFSoftShadowMap : THREE.PCFSoftShadowMap; // Ambos usan el mismo, pero podríamos cambiar a Basic en móvil extremo
        // Limitar pixel ratio en móvil para evitar sobrecarga de GPU
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 2 : 3));
        document.body.appendChild(renderer.domElement);

        // --- Controles de órbita con límites de rotación horizontal ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2; // Evita que la cámara baje del suelo
        
        // Límites de rotación horizontal (azimuth) para no salir de la habitación
        controls.minAzimuthAngle = -Math.PI / 6; // -30 grados
        controls.maxAzimuthAngle = Math.PI / 6;  // +30 grados
        
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // --- LUCES MEJORADAS (más arriba y mayor rango) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
        directionalLight.position.set(5, 15, 7);
        directionalLight.castShadow = true;
        directionalLight.receiveShadow = true;
        
        // En móvil, reducimos resolución de sombras para mejorar rendimiento
        const shadowMapSize = isMobile ? 512 : 1024;
        directionalLight.shadow.mapSize.width = shadowMapSize;
        directionalLight.shadow.mapSize.height = shadowMapSize;
        
        const d = 10;
        directionalLight.shadow.camera.left = -d;
        directionalLight.shadow.camera.right = d;
        directionalLight.shadow.camera.top = d;
        directionalLight.shadow.camera.bottom = -d;
        directionalLight.shadow.camera.near = 2;
        directionalLight.shadow.camera.far = 20;
        directionalLight.shadow.bias = -0.0005;
        scene.add(directionalLight);

        const backLight = new THREE.PointLight(0x4466ff, 1.0);
        backLight.position.set(-3, 6, -3);
        backLight.distance = 30;
        scene.add(backLight);

        const pointLight = new THREE.PointLight(0xffaa66, 1.5);
        pointLight.position.set(2, 6, 2);
        pointLight.distance = 25;
        scene.add(pointLight);

        const spotLight = new THREE.SpotLight(0xffffff, 1.8);
        spotLight.position.set(0, 10, 0);
        spotLight.target.position.set(0, 1, 0);
        scene.add(spotLight.target);
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = shadowMapSize;
        spotLight.shadow.mapSize.height = shadowMapSize;
        spotLight.angle = 1.0;
        spotLight.penumbra = 0.5;
        spotLight.decay = 1;
        spotLight.distance = 30;
        scene.add(spotLight);

        const sillaLight = new THREE.PointLight(0xffcc88, 1.2);
        sillaLight.position.set(1.5, 4, 1.5);
        sillaLight.distance = 15;
        scene.add(sillaLight);

        // --- Cargador de modelos GLB con indicador de progreso ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según la lista

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            // En móvil, si hay muchas texturas, podríamos reducir calidad, pero no aplicamos cambios aquí
                        }
                    });
                    scene.add(model);
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {
                    // Progreso individual (opcional)
                    // console.log(`${path} ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`);
                },
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++; // Para no bloquear el contador
                    updateLoading();
                }
            );
        }

        // Lista completa de modelos (ajústala según tus archivos)
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        // Iniciamos carga
        modelos.forEach(modelo => loadModel(modelo));

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Manejar cambio de tamaño de la ventana (incluyendo orientación) ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir el desplazamiento táctil de la página (para que no compita con los controles) ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página optimizada para móvil. Rotación limitada a ±30°.');
    </script>
</body>
</html>
