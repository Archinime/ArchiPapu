<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Pro con Contorno</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover { transform: scale(1.1); }
        #settings-button:active { transform: scale(0.95); }
        
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible { display: block; }
        
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 10px;
        }
        #settings-panel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            #settings-button { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 22px; }
            #settings-panel { top: 60px; right: 10px; padding: 12px 15px; font-size: 13px; min-width: 180px; }
        }
        #loading, #light-status {
            position: absolute;
            bottom: 20px;
            color: white;
            background: rgba(0,0,0,0.5); 
            padding: 5px 10px; 
            border-radius: 10px;
            font-size: 12px; 
            z-index: 100; 
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #loading { right: 20px; }
        #light-status { left: 20px; }
    </style>
</head>
<body>
    <div id="settings-button">⚙️</div>
    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

        // --- Configuración Escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508); 

        // --- Cámara ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);

        // --- Renderizador ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- EFECTO DE CONTORNO (OutlineEffect) ---
        // El grosor general es sutil para no saturar la escena
        const effect = new OutlineEffect(renderer, {
            defaultThickness: 0.001, 
            defaultColor: [0, 0, 0], 
            defaultAlpha: 1.0,
            defaultKeepAlive: true
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Luces ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambient);

        const mainLight = new THREE.SpotLight(0xffeedd, 6);
        mainLight.position.set(2, 22, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(2048, 2048);
        scene.add(mainLight);

        const indicatorLight = new THREE.PointLight(0xffaa00, 0.8, 5);
        scene.add(indicatorLight);

        let lightOn = localStorage.getItem('lightState') !== 'off';

        // --- Carga de Modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'decoracion_2_mueble_1.glb', 'decoracion_3_mueble_1.glb', 'decoracion_4_mueble_1.glb',
            'decoracion_5_mueble_1.glb', 'decoracion_2_mueble_2.glb', 'decoracion_piso.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'techo.glb', 'base_foco.glb', 'lunari2.glb', 
            'foco.glb'
        ];

        let switchMesh = null;
        let focoMesh = null;

        modelos.forEach(path => {
            loader.load(path, (gltf) => {
                const model = gltf.scene;
                
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        
                        if(node.material) {
                            node.material.side = THREE.DoubleSide;
                            
                            // APLICACIÓN DE CONTORNO A TODO EL MODELO LUNARI2
                            if (path.includes('lunari2.glb')) {
                                // Aquí activamos el contorno para TODO (piel, ojos, boca, ropa)
                                // Usamos un grosor ultra fino para que los ojos y boca se vean bien definidos 
                                // pero sin manchas negras gruesas.
                                node.material.userData.outlineParameters = {
                                    thickness: 0.0003, // Grosor muy fino para detalles delicados
                                    color: [0, 0, 0],
                                    alpha: 0.8,        // Un poco de transparencia suaviza los bordes en la cara
                                    visible: true      // Forzamos visibilidad en todas las partes
                                };
                            }
                        }
                    }
                });

                if (path.includes('foco.glb')) {
                    focoMesh = model;
                    model.traverse(n => { if(n.isMesh) { n.castShadow = false; n.material.emissiveIntensity = lightOn ? 1.5 : 0; }});
                }
                 
                scene.add(model);

                if (path.includes('interruptor.glb')) {
                    switchMesh = model;
                    const box = new THREE.Box3().setFromObject(model);
                    box.getCenter(indicatorLight.position);
                }
                
                modelsLoaded++;
                document.getElementById('loading').innerText = `Cargando: ${modelsLoaded}/${modelos.length}`;
                if (modelsLoaded === modelos.length) document.getElementById('loading').style.display = 'none';
            });
        });

        // --- Funciones de Luz y Calidad ---
        const perfCheck = document.getElementById('performance-mode');

        function updateLighting() {
            const isLow = perfCheck.checked;
            if (lightOn) {
                mainLight.visible = true;
                document.getElementById('light-status').innerText = '💡 Luz encendida';
                if (focoMesh) focoMesh.traverse(n => { if(n.isMesh) n.material.emissiveIntensity = 1.5; });
            } else {
                mainLight.visible = false;
                document.getElementById('light-status').innerText = '💡 Luz apagada';
                if (focoMesh) focoMesh.traverse(n => { if(n.isMesh) n.material.emissiveIntensity = 0; });
            }
        }

        function updateQuality() {
            const isLow = perfCheck.checked;
            renderer.shadowMap.enabled = !isLow;
            renderer.setPixelRatio(isLow ? 1 : Math.min(window.devicePixelRatio, 2));
            document.getElementById('quality-indicator').textContent = isLow ? 'Modo Humilde' : 'Calidad Alta';
            updateLighting();
        }

        // --- Interacciones ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleInteraction(event) {
            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;
            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (switchMesh && raycaster.intersectObject(switchMesh, true).length > 0) {
                lightOn = !lightOn;
                localStorage.setItem('lightState', lightOn ? 'on' : 'off');
                updateLighting();
            }
        }

        renderer.domElement.addEventListener('click', handleInteraction);
        perfCheck.addEventListener('change', updateQuality);

        // --- Bucle de Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            // Renderizamos usando el efecto de contorno
            effect.render(scene, camera);
        }
        
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        });

        updateQuality();
        document.getElementById('settings-button').onclick = () => document.getElementById('settings-panel').classList.toggle('visible');
    </script>
</body>
</html>
