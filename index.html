<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Foco desde arriba</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
        /* Botón de tuerca */
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover {
            transform: scale(1.1);
        }
        #settings-button:active {
            transform: scale(0.95);
        }
        /* Panel de configuración (oculto por defecto) */
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible {
            display: block;
        }
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 10px;
        }
        #settings-panel label:last-child {
            margin-bottom: 0;
        }
        #settings-panel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            #settings-button {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            #settings-panel {
                top: 60px;
                right: 10px;
                padding: 12px 15px;
                font-size: 13px;
                min-width: 180px;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #light-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <!-- Botón de tuerca -->
    <div id="settings-button">⚙️</div>
    <!-- Panel de configuración -->
    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Detectar tipo de dispositivo por ancho y user agent ---
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const width = window.innerWidth;
        
        let deviceType = 'desktop';
        if (width < 768 || (isMobileUA && width < 1024)) {
            deviceType = 'mobile';
        } else if (width >= 768 && width <= 1024 || (isMobileUA && width >= 1024)) {
            deviceType = 'tablet';
        }

        console.log('Dispositivo detectado:', deviceType, 'ancho:', width);

        // --- Variables globales ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // --- Cámara según dispositivo ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        if (deviceType === 'mobile') {
            camera.position.set(0, 15, 38); // Móvil: más lejos
        } else if (deviceType === 'tablet') {
            camera.position.set(0, 13, 30); // Tablet: intermedio
        } else {
            camera.position.set(0, 8, 18); // Escritorio: como antes
        }
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controles con límites de rotación según dispositivo ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        
        if (deviceType === 'mobile') {
            controls.minAzimuthAngle = -Math.PI / 5.14; // -35°
            controls.maxAzimuthAngle = Math.PI / 5.14;  // +35°
        } else if (deviceType === 'tablet') {
            controls.minAzimuthAngle = -Math.PI / 4;    // -45°
            controls.maxAzimuthAngle = Math.PI / 4;     // +45°
        } else {
            controls.minAzimuthAngle = -Math.PI / 6;    // -30°
            controls.maxAzimuthAngle = Math.PI / 6;     // +30°
        }
        
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // --- Luz principal: foco desde arriba (más alto, mayor alcance) ---
        const mainLight = new THREE.SpotLight(0xffeedd, 4.2);
        mainLight.position.set(0, 22, 0); // Subido a Y=22
        mainLight.target.position.set(0, 1, 0);
        scene.add(mainLight.target);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.angle = 1.4;            // Ángulo más abierto (aprox 80°)
        mainLight.penumbra = 0.5;
        mainLight.decay = 1;
        mainLight.distance = 80;           // Alcance aumentado
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        // Estado de la luz
        let lightOn = true;
        
        // Luz de señalización para el interruptor
        const indicatorLight = new THREE.PointLight(0xffaa00, 0.8, 5);
        indicatorLight.position.set(0, 0, 0);
        scene.add(indicatorLight);

        // Variables para el interruptor
        let switchMesh = null;
        const switchPosition = new THREE.Vector3();

        // --- Cargador de modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según tu lista

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    
                    const currentShadowState = renderer.shadowMap.enabled;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = currentShadowState;
                            node.receiveShadow = currentShadowState;
                        }
                    });
                    
                    scene.add(model);
                    
                    if (path.includes('interruptor.glb')) {
                        switchMesh = model;
                        model.traverse((node) => {
                            if (node.isMesh) {
                                node.getWorldPosition(switchPosition);
                                indicatorLight.position.copy(switchPosition);
                            }
                        });
                        console.log('Interruptor cargado en:', switchPosition);
                    }
                    
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {},
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        // Lista de modelos (asegúrate de que 'interruptor.glb' esté incluido)
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Raycaster para detectar clic en el interruptor ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            if (event.touches) {
                mouse.x = ((event.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.touches[0].clientY - rect.top) / rect.height) * 2 + 1;
            } else {
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            }

            raycaster.setFromCamera(mouse, camera);

            if (switchMesh) {
                const intersects = raycaster.intersectObject(switchMesh, true);
                if (intersects.length > 0) {
                    lightOn = !lightOn;
                    mainLight.visible = lightOn;
                    localStorage.setItem('lightState', lightOn ? 'on' : 'off');
                    document.getElementById('light-status').innerText = lightOn ? '💡 Luz encendida' : '💡 Luz apagada';
                    indicatorLight.intensity = lightOn ? 0.8 : 1.5; // feedback
                }
            }
        }

        renderer.domElement.addEventListener('click', onClick);
        renderer.domElement.addEventListener('touchstart', (e) => {
            e.preventDefault();
            onClick(e);
        });

        // --- Persistencia del estado de la luz ---
        const savedLightState = localStorage.getItem('lightState');
        if (savedLightState === 'off') {
            lightOn = false;
            mainLight.visible = false;
            document.getElementById('light-status').innerText = '💡 Luz apagada';
        } else {
            lightOn = true;
            mainLight.visible = true;
            document.getElementById('light-status').innerText = '💡 Luz encendida';
        }

        // --- Configuración de calidad (modo humilde) ---
        function setupHighQuality() {
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            document.getElementById('quality-indicator').textContent = 'Calidad Alta';
        }

        function setupLowQuality() {
            renderer.shadowMap.enabled = false;
            renderer.setPixelRatio(1);
            mainLight.shadow.mapSize.width = 512;
            mainLight.shadow.mapSize.height = 512;
            document.getElementById('quality-indicator').textContent = 'Modo Humilde';
        }

        // Inicializar según dispositivo y localStorage (usamos deviceType para decidir el modo por defecto)
        const savedPerformanceMode = localStorage.getItem('performanceMode');
        const perfCheck = document.getElementById('performance-mode');
        
        // Por defecto, en móvil/tablet activamos modo humilde, en desktop no
        if (deviceType !== 'desktop') {
            if (savedPerformanceMode === null) {
                perfCheck.checked = true;
                setupLowQuality();
            } else {
                perfCheck.checked = savedPerformanceMode === 'true';
                if (perfCheck.checked) setupLowQuality();
                else setupHighQuality();
            }
        } else {
            if (savedPerformanceMode === null) {
                perfCheck.checked = false;
                setupHighQuality();
            } else {
                perfCheck.checked = savedPerformanceMode === 'true';
                if (perfCheck.checked) setupLowQuality();
                else setupHighQuality();
            }
        }

        perfCheck.addEventListener('change', (e) => {
            if (e.target.checked) {
                setupLowQuality();
            } else {
                setupHighQuality();
            }
            localStorage.setItem('performanceMode', e.target.checked);
        });

        // --- Mostrar/ocultar panel de configuración ---
        const settingsButton = document.getElementById('settings-button');
        const settingsPanel = document.getElementById('settings-panel');
        settingsButton.addEventListener('click', () => {
            settingsPanel.classList.toggle('visible');
        });

        document.addEventListener('click', (e) => {
            if (!settingsButton.contains(e.target) && !settingsPanel.contains(e.target)) {
                settingsPanel.classList.remove('visible');
            }
        });

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir scroll táctil ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página cargada. Dispositivo:', deviceType);
    </script>
</body>
</html>
