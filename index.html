<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Inventario y Lunari</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }

        /* --- SCROLLBAR PERSONALIZADO --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        /* --- BOTONES SUPERIORES --- */
        .top-btn {
            position: absolute;
            top: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }
        .top-btn:active { transform: scale(0.9); }
        #inventory-button { left: 20px; }
        #settings-button { right: 20px; }

        /* --- MONEDAS --- */
        #coin-counter {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 8px 15px;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            backdrop-filter: blur(5px);
            font-size: 16px;
        }

        /* --- MODAL INVENTARIO --- */
        #inventory-modal {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 70%;
            background: rgba(20, 20, 20, 0.95);
            border-top: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px 20px 0 0;
            transition: bottom 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
            z-index: 20;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        #inventory-modal.visible { bottom: 0; }
        
        .modal-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .modal-header h2 { margin: 0; color: white; font-size: 18px; }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        /* TABS GRUPOS */
        .group-tabs {
            display: flex;
            overflow-x: auto;
            padding: 10px;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .group-tab {
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            color: white;
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .group-tab.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255,255,255,0.3);
            font-weight: bold;
        }

        /* CONTENIDO CATEGORÍAS */
        .categories-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .category-section h3 {
            color: #aaa;
            font-size: 14px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .item-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .item-card.equipped { border-color: #4CAF50; background: rgba(76, 175, 80, 0.1); }
        .item-card.locked { opacity: 0.6; filter: grayscale(1); }
        
        .item-preview {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 8px;
            background: #000;
        }
        
        .item-name {
            color: white;
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-price {
            color: #ffd700;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* --- PANEL AJUSTES --- */
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            color: white;
            display: none;
            z-index: 15;
            backdrop-filter: blur(10px);
        }
        #settings-panel.visible { display: block; }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        /* --- PANTALLA CARGA --- */
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
            color: white;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text" style="font-weight: bold;">Iniciando entorno 3D...</div>
    </div>

    <div id="coin-counter">🪙 <span id="coins-display">0</span></div>
    <button class="top-btn" id="inventory-button">🎒</button>
    <button class="top-btn" id="settings-button">⚙️</button>

    <div id="settings-panel">
        <label class="setting-row">
            <input type="checkbox" id="chk-humilde" onchange="updateQuality()">
            Modo Humilde (Mejora Rendimiento)
        </label>
        <button id="add-coins-debug" style="width:100%; padding:5px; margin-top:5px; background:#333; color:white; border:none; border-radius:5px; cursor:pointer;">
            [Dev] +100 Monedas
        </button>
    </div>

    <div id="inventory-modal">
        <div class="modal-header">
            <h2>Inventario</h2>
            <button class="close-btn" id="close-inv">&times;</button>
        </div>
        <div class="group-tabs" id="group-tabs-container"></div>
        <div class="categories-container" id="categories-container"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { inventoryGroups, defaultInventoryConfig } from './inventory-data.js';

        // --- SISTEMA DE DATOS ---
        let inventoryConfig = JSON.parse(JSON.stringify(defaultInventoryConfig));
        let playerCoins = 0;
        let activeGroupId = inventoryGroups[0].id;

        function loadGame() {
            const saved = localStorage.getItem('archiSaveData');
            if (saved) {
                const data = JSON.parse(saved);
                playerCoins = data.coins || 0;
                
                // Mezclar inventario guardado
                if (data.inventory) {
                    Object.keys(data.inventory).forEach(category => {
                        if (inventoryConfig[category]) {
                            inventoryConfig[category].equipped = data.inventory[category].equipped;
                            Object.keys(data.inventory[category].items).forEach(itemId => {
                                if (inventoryConfig[category].items[itemId]) {
                                    inventoryConfig[category].items[itemId].owned = data.inventory[category].items[itemId].owned;
                                }
                            });
                        }
                    });
                }
            } else {
                playerCoins = 500; // Monedas iniciales para nuevos
            }
            updateCoinsUI();
        }

        function saveGame() {
            const dataToSave = {
                coins: playerCoins,
                inventory: {}
            };
            Object.keys(inventoryConfig).forEach(cat => {
                dataToSave.inventory[cat] = {
                    equipped: inventoryConfig[cat].equipped,
                    items: {}
                };
                Object.keys(inventoryConfig[cat].items).forEach(item => {
                    dataToSave.inventory[cat].items[item] = {
                        owned: inventoryConfig[cat].items[item].owned
                    };
                });
            });
            localStorage.setItem('archiSaveData', JSON.stringify(dataToSave));
        }

        function updateCoinsUI() {
            document.getElementById('coins-display').innerText = playerCoins;
        }

        document.getElementById('add-coins-debug').onclick = () => {
            playerCoins += 100;
            updateCoinsUI();
            saveGame();
            renderInventory(); // Actualizar botones de compra
        };

        // --- SISTEMA 3D (OPTIMIZADO) ---
        let scene, camera, renderer, controls;
        let ambientLight, directionalLight;
        const loadedModels = {};
        let lunariMixer = null;
        let clock = new THREE.Clock();

        // Detectar si es un dispositivo móvil
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // --- GESTOR DE CARGA SEGURA ---
        const manager = new THREE.LoadingManager();
        manager.onProgress = function ( url, itemsLoaded, itemsTotal ) {
            const porcentaje = Math.round((itemsLoaded / itemsTotal) * 100);
            document.getElementById('loading-text').innerText = `Cargando recursos... ${porcentaje}%`;
        };
        manager.onLoad = function ( ) {
            // Un pequeño retraso para asegurar que los shaders compilaron
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        };
        manager.onError = function ( url ) {
            console.error('Error al cargar:', url);
        };

        const dracoLoader = new DRACOLoader(manager);
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
        const gltfLoader = new GLTFLoader(manager);
        gltfLoader.setDRACOLoader(dracoLoader);

        init();
        loadGame();
        loadRoomModel(); // Carga de cuarto con el manager activo
        renderInventoryUI(); // Inicializa botones de UI

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#000000'); // Fondo optimizado para prevenir render residual

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(5, 4, 5);

            // OPTIMIZACIÓN DEL RENDERER PARA MÓVILES
            renderer = new THREE.WebGLRenderer({ 
                antialias: !isMobile, // Desactivado en móviles para prevenir OOM (Out of Memory)
                alpha: false, 
                powerPreference: "high-performance",
                precision: isMobile ? "mediump" : "highp" // Ahorra mucha memoria GPU en móviles
            });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Limitamos la densidad de píxeles (mata móviles de gama baja si no se controla)
            renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // No ver debajo del suelo
            controls.minDistance = 2;
            controls.maxDistance = 10;
            controls.target.set(0, 1, 0);

            // Iluminación
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(5, 8, 3);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = isMobile ? 512 : 1024; // Sombras ligeras en móvil
            directionalLight.shadow.mapSize.height = isMobile ? 512 : 1024;
            scene.add(directionalLight);
        }

        // --- SISTEMA DE LIBERACIÓN DE MEMORIA (PREVIENE CRASHEOS) ---
        function disposeHierarchy(node) {
            for (let i = node.children.length - 1; i >= 0; i--) {
                const child = node.children[i];
                disposeHierarchy(child);
                node.remove(child);
            }
            if (node.isMesh) {
                if (node.geometry) node.geometry.dispose();
                if (node.material) {
                    if (Array.isArray(node.material)) {
                        node.material.forEach(mat => disposeMaterial(mat));
                    } else {
                        disposeMaterial(node.material);
                    }
                }
            }
        }

        function disposeMaterial(mat) {
            mat.dispose();
            if (mat.map) mat.map.dispose();
            if (mat.lightMap) mat.lightMap.dispose();
            if (mat.bumpMap) mat.bumpMap.dispose();
            if (mat.normalMap) mat.normalMap.dispose();
            if (mat.specularMap) mat.specularMap.dispose();
            if (mat.envMap) mat.envMap.dispose();
        }

        function removeModel(category) {
            if (loadedModels[category]) {
                const model = loadedModels[category];
                scene.remove(model);
                disposeHierarchy(model); // Libera VRAM y RAM!
                loadedModels[category] = null;
            }
        }

        function loadModel(url, category) {
            // Mostrar UI de carga si estábamos jugando y decidimos cambiar un mueble
            if(document.getElementById('loading').style.display === 'none') {
                 document.getElementById('loading').style.display = 'flex';
                 document.getElementById('loading-text').innerText = 'Cargando nuevo modelo...';
            }

            removeModel(category);

            gltfLoader.load(url, (gltf) => {
                const model = gltf.scene;
                
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                scene.add(model);
                loadedModels[category] = model;
                
                // Actualizar sombras según la calidad
                window.updateQuality(); 
            });
        }

        // Carga inicial secuencial
        function loadRoomModel() {
            Object.keys(inventoryConfig).forEach(category => {
                const itemData = inventoryConfig[category].items[inventoryConfig[category].equipped];
                if (itemData && itemData.file) {
                    loadModel(itemData.file, category);
                }
            });

            // Personaje (Lunari)
            gltfLoader.load('https://cdn.jsdelivr.net/gh/Archinime/ArchiPapu@main/lunari_con_animacion.glb', (gltf) => {
                const lunari = gltf.scene;
                lunari.traverse(node => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                scene.add(lunari);
                
                if (gltf.animations && gltf.animations.length > 0) {
                    lunariMixer = new THREE.AnimationMixer(lunari);
                    const action = lunariMixer.clipAction(gltf.animations[0]);
                    action.play();
                }
            });
        }

        // --- SISTEMA DE INVENTARIO UI ---
        function renderInventoryUI() {
            renderGroupTabs();
            renderInventory();
        }

        function renderGroupTabs() {
            const container = document.getElementById('group-tabs-container');
            container.innerHTML = '';
            
            inventoryGroups.forEach(group => {
                const tab = document.createElement('div');
                tab.className = `group-tab ${group.id === activeGroupId ? 'active' : ''}`;
                tab.innerHTML = `${group.emoji} ${group.label}`;
                tab.onclick = () => {
                    activeGroupId = group.id;
                    renderGroupTabs();
                    renderInventory();
                };
                container.appendChild(tab);
            });
        }

        function renderInventory() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            const activeGroup = inventoryGroups.find(g => g.id === activeGroupId);
            if (!activeGroup) return;

            activeGroup.categories.forEach(catId => {
                const categoryData = inventoryConfig[catId];
                if (!categoryData) return;

                const section = document.createElement('div');
                section.className = 'category-section';
                
                const title = document.createElement('h3');
                title.innerText = `${categoryData.emoji} ${categoryData.label}`;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'items-grid';

                Object.keys(categoryData.items).forEach(itemId => {
                    const item = categoryData.items[itemId];
                    const isEquipped = categoryData.equipped === itemId;
                    const isLocked = !item.owned;

                    const card = document.createElement('div');
                    card.className = `item-card ${isEquipped ? 'equipped' : ''} ${isLocked ? 'locked' : ''}`;
                    
                    card.innerHTML = `
                        <img src="${item.preview || ''}" class="item-preview" alt="preview" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='">
                        <span class="item-name">${item.name}</span>
                        ${isLocked ? `<span class="item-price">🪙 ${item.price}</span>` : `<span class="item-price">${isEquipped ? 'Equipado' : 'Equipar'}</span>`}
                    `;

                    card.onclick = () => {
                        if (isLocked) {
                            handlePurchase(item, catId, itemId);
                        } else if (!isEquipped) {
                            equipItem(catId, itemId);
                        }
                    };

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function equipItem(categoryId, itemId) {
            inventoryConfig[categoryId].equipped = itemId;
            saveGame();
            renderInventory();
            const file = inventoryConfig[categoryId].items[itemId].file;
            if (file) {
                loadModel(file, categoryId);
            } else {
                removeModel(categoryId); // Opción de "quitar" o dejar vacío
            }
        }

        function handlePurchase(item, categoryId, itemId) {
            if (playerCoins >= item.price) {
                playerCoins -= item.price;
                item.owned = true;
                saveGame();
                updateCoinsUI();
                renderInventory();
            } else {
                alert("No tienes suficientes monedas.");
            }
        }

        // --- OPTIMIZADOR "MODO HUMILDE" ---
        window.updateQuality = function() {
            const isHumilde = document.getElementById('chk-humilde').checked;
            
            // 1. Sombras e Iluminación
            renderer.shadowMap.enabled = !isHumilde;
            ambientLight.intensity = isHumilde ? 1.0 : 0.6;
            if (directionalLight) {
                directionalLight.castShadow = !isHumilde;
            }

            // 2. ESCALADO DE RESOLUCIÓN (Clave para móviles lentos)
            if (isHumilde) {
                renderer.setPixelRatio(isMobile ? 0.75 : 1); // Renderiza a menor resolución interna y estira (gran aumento de FPS)
            } else {
                renderer.setPixelRatio(isMobile ? 1 : Math.min(window.devicePixelRatio, 1.5));
            }

            // Forzar actualización de materiales
            scene.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = !isHumilde;
                    child.receiveShadow = !isHumilde;
                    if (child.material) {
                        child.material.needsUpdate = true;
                    }
                }
            });
        };

        // Eventos UI
        document.getElementById('inventory-button').onclick = () => {
            document.getElementById('inventory-modal').classList.add('visible');
            renderInventory();
        };
        document.getElementById('close-inv').onclick = () => {
            document.getElementById('inventory-modal').classList.remove('visible');
        };
        document.getElementById('settings-button').onclick = () => {
            document.getElementById('settings-panel').classList.toggle('visible');
        };
        
        // --- ANIMACIÓN Y REDIMENSIONADO SEGURO ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (lunariMixer) lunariMixer.update(delta);

            controls.update();
            renderer.render(scene, camera); 
        }
        animate();
        
        // Debounce del resize para no crashear móviles al scrollear (cuando la barra de URL desaparece)
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }, 200);
        });
        
    </script>
</body>
</html>
