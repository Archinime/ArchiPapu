<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Pro con Contorno</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover { transform: scale(1.1); }
        #settings-button:active { transform: scale(0.95); }
        
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible { display: block; }
        
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 10px;
        }
        #settings-panel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            #settings-button { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 22px; }
            #settings-panel { top: 60px; right: 10px; padding: 12px 15px; font-size: 13px; min-width: 180px; }
        }
        #loading, #light-status {
            position: absolute;
            bottom: 20px;
            color: white;
            background: rgba(0,0,0,0.5); 
            padding: 5px 10px; 
            border-radius: 10px;
            font-size: 12px; 
            z-index: 100; 
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #loading { right: 20px; }
        #light-status { left: 20px; }
    </style>
</head>
<body>
    <div id="settings-button">⚙️</div>
    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

        // --- Detección de dispositivo ---
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const width = window.innerWidth;
        let deviceType = (width < 768 || (isMobileUA && width < 1024)) ?
                         'mobile' : 
                         (width >= 768 && width <= 1024) ?
                         'tablet' : 'desktop';

        // --- Escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508); 

        // --- Cámara optimizada ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 200);
        
        // Ajuste: Cámara más cerca y centrada para PC
        let camPosY = 6, camPosZ = 14, targetY = 6; 
        
        // Se mantiene igual para móvil
        if (deviceType === 'mobile') { camPosY = 6; camPosZ = 12; targetY = 5; }
        
        camera.position.set(0, camPosY, camPosZ);

        // --- RENDERIZADOR PRO ---
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // Mejoras de realismo en renderizado
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.0;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- EFECTO DE CONTORNO ANIME SUAVIZADO ---
        const effect = new OutlineEffect(renderer, {
            defaultThickness: 0.0008, 
            defaultColor: [0.05, 0.05, 0.08], 
            defaultAlpha: 0.85, 
            defaultKeepAlive: true
        });

        // --- Controles y "Colisiones" ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, targetY, 0);

        // LÍMITES DE LA CÁMARA (Anti-traspaso)
        // 1. Evita que la cámara pase por debajo del piso
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        
        // 2. Limita el Zoom para no atravesar muebles por delante ni paredes por detrás
        controls.minDistance = 2.5; // Distancia mínima al centro
        controls.maxDistance = 16;  // Distancia máxima (ajusta si la habitación es muy grande)
        
        // 3. Desactiva el paneo (arrastre lateral con clic derecho) para que la cámara no salga del cuarto
        controls.enablePan = false;

        // --- LUCES ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambient);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        // Luz Principal
        const mainLight = new THREE.SpotLight(0xffeedd, 6);
        mainLight.position.set(2, 22, 2);
        mainLight.angle = Math.PI / 3;
        mainLight.penumbra = 0.8; 
        mainLight.decay = 2; 
        mainLight.distance = 60;
        
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(2048, 2048);
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 40;
        mainLight.shadow.bias = -0.0001;
        mainLight.shadow.normalBias = 0.02;
        mainLight.shadow.radius = 4; 
        
        scene.add(mainLight);
        scene.add(mainLight.target);

        // Estado inicial de la luz
        let lightOn = localStorage.getItem('lightState') !== 'off';

        // --- Carga de Modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'decoracion_2_mueble_1.glb', 'decoracion_3_mueble_1.glb', 'decoracion_4_mueble_1.glb',
            'decoracion_5_mueble_1.glb', 'decoracion_2_mueble_2.glb', 'decoracion_piso.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb', 'puerta.glb',
            'interruptor.glb', 'maouse_pad.glb', 'techo.glb', 'base_foco.glb', 'lunari2.glb', 
            'foco.glb'
        ];

        let switchMesh = null;
        let focoMesh = null;

        // --- NUEVO: manejo específico para lunari2.glb ---
        const lunariMeshes = []; // nodos que pertenecen a lunari2
        const lunariMaterialData = new Map(); // key: material.uuid -> data { originalMaterial, replacementMaterial?, originalProps }

        function cloneMaterialProps(mat) {
            // guarda los atributos que vamos a restaurar
            return {
                color: mat.color ? mat.color.clone() : null,
                emissive: mat.emissive ? mat.emissive.clone() : null,
                emissiveIntensity: (typeof mat.emissiveIntensity !== 'undefined') ? mat.emissiveIntensity : 0,
                metalness: (typeof mat.metalness !== 'undefined') ? mat.metalness : null,
                roughness: (typeof mat.roughness !== 'undefined') ? mat.roughness : null,
                type: mat.type || '',
                opacity: (typeof mat.opacity !== 'undefined') ? mat.opacity : 1,
                transparent: (typeof mat.transparent !== 'undefined') ? mat.transparent : false,
                map: mat.map || null,
                normalMap: mat.normalMap || null,
                aoMap: mat.aoMap || null,
                envMap: mat.envMap || null,
                envMapIntensity: (typeof mat.envMapIntensity !== 'undefined') ? mat.envMapIntensity : 1
            };
        }

        function createStandardFromBasic(basicMatProps) {
            // crea un MeshStandardMaterial usando mapas y color del basic, para que responda a la iluminación
            const m = new THREE.MeshStandardMaterial({
                map: basicMatProps.map || null,
                normalMap: basicMatProps.normalMap || null,
                aoMap: basicMatProps.aoMap || null,
                envMap: basicMatProps.envMap || null,
                envMapIntensity: basicMatProps.envMapIntensity || 1,
                color: basicMatProps.color ? basicMatProps.color.clone() : new THREE.Color(0xffffff),
                metalness: (basicMatProps.metalness !== null) ? basicMatProps.metalness : 0.0,
                roughness: (basicMatProps.roughness !== null) ? basicMatProps.roughness : 1.0,
                transparent: basicMatProps.transparent,
                opacity: basicMatProps.opacity
            });
            return m;
        }

        loader.load = loader.load.bind(loader); // mantener contexto (no obligatorio, pero seguro)

        modelos.forEach(path => {
            loader.load(path, (gltf) => {
                const model = gltf.scene;
                
                if (path.includes('foco.glb')) {
                    focoMesh = model;
                    
                    const box = new THREE.Box3().setFromObject(model);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
            
                    mainLight.position.copy(center);
                    mainLight.position.y -= 0.2; 
                    
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = false;
                            node.receiveShadow = false;
                            
                            if (node.material) {
                                node.material.emissive = new THREE.Color(0xffeedd);
                                node.material.emissiveIntensity = lightOn ? 1.5 : 0;
                            }
                        }
                    });
                } else {
                    // Si es lunari2, aplicamos el tratamiento especial
                    if (path.includes('lunari2.glb')) {
                        model.traverse((node) => {
                            if (node.isMesh) {
                                // guardar referencia global del mesh
                                lunariMeshes.push(node);

                                // several meshes could share same material object; guardamos por material.uuid
                                let mats = Array.isArray(node.material) ? node.material : [node.material];
                                mats.forEach(mat => {
                                    if (!mat) return;
                                    if (!lunariMaterialData.has(mat.uuid)) {
                                        const originalProps = cloneMaterialProps(mat);
                                        let replacement = null;
                                        let replacedBasic = false;
                                        // Si es MeshBasicMaterial (no responde a la luz), crear sustituto MeshStandardMaterial
                                        if (mat.type === 'MeshBasicMaterial' || mat.isMeshBasicMaterial) {
                                            replacement = createStandardFromBasic(originalProps);
                                            replacement.emissive = new THREE.Color(0x000000);
                                            replacement.emissiveIntensity = 0;
                                            replacedBasic = true;
                                        } else {
                                            // asegurarnos de que exista emissive para controlarlo
                                            if (!mat.emissive) mat.emissive = new THREE.Color(0x000000);
                                        }

                                        lunariMaterialData.set(mat.uuid, {
                                            originalMaterial: mat,
                                            originalProps,
                                            replacementMaterial: replacement,
                                            replacedBasic
                                        });
                                    }
                                });

                                // Si se creó replacement para algún material, lo aplicamos (por ejemplo para Basic -> Standard)
                                if (Array.isArray(node.material)) {
                                    node.material = node.material.map(m => {
                                        const info = m ? lunariMaterialData.get(m.uuid) : null;
                                        return info && info.replacementMaterial ? info.replacementMaterial : m;
                                    });
                                } else {
                                    const info = lunariMaterialData.get(node.material.uuid);
                                    if (info && info.replacementMaterial) node.material = info.replacementMaterial;
                                }

                                // Configuraciones de sombras para lunari
                                node.castShadow = true;
                                node.receiveShadow = true;
                            }
                        });
                    } else {
                        model.traverse((node) => {
                            if (node.isMesh) {
                                node.castShadow = true;
                                node.receiveShadow = true;
                                
                                if(node.material) {
                                    node.material.shadowSide = THREE.FrontSide;
                                    if(node.name.toLowerCase().includes('pared') || node.name.toLowerCase().includes('piso')) {
                                        node.material.shadowSide = THREE.BackSide;
                                    }
                                    node.material.side = THREE.DoubleSide;
                                }
                            }
                        });
                    }
                }
                 
                scene.add(model);

                if (path.includes('interruptor.glb')) {
                    switchMesh = model;
                }
                
                modelsLoaded++;
                document.getElementById('loading').innerText = `Cargando: ${modelsLoaded}/${modelos.length}`;
                if (modelsLoaded === modelos.length) document.getElementById('loading').style.display = 'none';

                // una vez cargado lunari (o su material de reemplazo), aplicar estado inicial de luz
                if (path.includes('lunari2.glb')) {
                    // aplicar estado de luz actual a lunari inmediatamente
                    applyLightToLunari(lightOn, /*instant=*/true);
                }
            });
        });

        // --- Aplica luz/oscurecimiento solo a lunari ---
        function applyLightToLunari(turnOn, instant = false) {
            // turnOn = true -> restaurar original y permitir emissive
            // turnOn = false -> forzar oscuro (emissive 0, colores más oscuros)
            lunariMeshes.forEach(mesh => {
                const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
                mats.forEach(mat => {
                    if (!mat) return;
                    // podemos encontrar que mat es replacement o el original. Buscamos por uuid en lunariMaterialData:
                    // en el Map guardamos info con key originalMaterial.uuid, pero mat.uuid podría ser replacement.uuid.
                    // Por eso buscamos por equivalencia buscando la entry que tenga replacementMaterial === mat o originalMaterial === mat.
                    let entry = null;
                    for (const [k, v] of lunariMaterialData.entries()) {
                        if (v.originalMaterial === mat || v.replacementMaterial === mat) {
                            entry = v;
                            break;
                        }
                    }

                    if (!entry) {
                        // fallback: si no hay entry (material no procesado), intentamos simplemente ajustar emissive
                        if (mat.emissive) {
                            if (turnOn) {
                                mat.emissiveIntensity = (mat.emissiveIntensity !== undefined) ? mat.emissiveIntensity : 1;
                            } else {
                                mat.emissive.setHex(0x000000);
                                mat.emissiveIntensity = 0;
                            }
                        } else {
                            if (!turnOn) {
                                if (mat.color) mat.color.multiplyScalar(0.08);
                            }
                        }
                        mat.needsUpdate = true;
                        return;
                    }

                    const orig = entry.originalProps;
                    // Si la material fue reemplazado desde Basic a Standard, trabajamos sobre replacement
                    const targetMat = entry.replacementMaterial ? entry.replacementMaterial : entry.originalMaterial;

                    if (turnOn) {
                        // Restaurar color y emissive
                        if (orig.color && targetMat.color) targetMat.color.copy(orig.color);
                        if (orig.emissive && targetMat.emissive) targetMat.emissive.copy(orig.emissive);
                        if (typeof orig.emissiveIntensity !== 'undefined' && targetMat.hasOwnProperty('emissiveIntensity')) {
                            targetMat.emissiveIntensity = orig.emissiveIntensity;
                        } else if (targetMat.hasOwnProperty('emissiveIntensity')) {
                            targetMat.emissiveIntensity = 1;
                        }
                        // restablecer envMapIntensity si existe
                        if (typeof orig.envMapIntensity !== 'undefined' && typeof targetMat.envMapIntensity !== 'undefined') {
                            targetMat.envMapIntensity = orig.envMapIntensity;
                        }
                        // si era Basic y lo reemplazamos, mantener la apariencia de encendido (emissive si corresponde)
                        targetMat.transparent = entry.originalProps.transparent;
                        targetMat.opacity = entry.originalProps.opacity;
                    } else {
                        // Oscurecer: quitar emissive y bajar color mucho
                        if (targetMat.emissive) {
                            targetMat.emissive.setHex(0x000000);
                        }
                        if (targetMat.hasOwnProperty('emissiveIntensity')) {
                            targetMat.emissiveIntensity = 0;
                        }
                        // Hacer color muy oscuro (mantener textura pero oscurecerla)
                        if (targetMat.color) {
                            // multiplicamos por factor pequeño para oscurecer sin perder textura
                            targetMat.color.multiplyScalar(0.06);
                        }
                        // reducir envMap reflectividad para que no parezca brillante
                        if (typeof targetMat.envMapIntensity !== 'undefined') {
                            targetMat.envMapIntensity = 0.02;
                        }
                        // si tenía transparencia, conservarla pero reducir impacto
                        targetMat.transparent = entry.originalProps.transparent;
                        targetMat.opacity = entry.originalProps.opacity;
                    }

                    targetMat.needsUpdate = true;
                });
            });
        }

        // --- SISTEMA DE ILUMINACIÓN CENTRALIZADO ---
        const perfCheck = document.getElementById('performance-mode');

        function updateLighting() {
            const isLow = perfCheck.checked;

            if (lightOn) {
                mainLight.visible = true;
                ambient.intensity = isLow ? 0.8 : 0.3;
                hemiLight.intensity = isLow ? 0.8 : 0.4;
                document.getElementById('light-status').innerText = '💡 Luz encendida';

                if (focoMesh) {
                    focoMesh.traverse((node) => {
                        if (node.isMesh && node.material) {
                            node.material.emissiveIntensity = 1.5;
                        }
                    });
                }

                // restaurar apariencia de lunari
                applyLightToLunari(true);
            } else {
                mainLight.visible = false;
                ambient.intensity = 0.02;
                hemiLight.intensity = 0.05; 
                document.getElementById('light-status').innerText = '💡 Luz apagada';

                if (focoMesh) {
                    focoMesh.traverse((node) => {
                        if (node.isMesh && node.material) {
                            node.material.emissiveIntensity = 0;
                        }
                    });
                }

                // oscurecer lunari
                applyLightToLunari(false);
            }
        }

        // --- Interacción Interruptor ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function toggleLight() {
            lightOn = !lightOn;
            localStorage.setItem('lightState', lightOn ? 'on' : 'off');
            updateLighting();
        }

        function handleInteraction(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((y - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (switchMesh && raycaster.intersectObject(switchMesh, true).length > 0) {
                toggleLight();
            }
        }

        renderer.domElement.addEventListener('click', handleInteraction);
        renderer.domElement.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e); }, {passive: false});

        // --- Calidad / Modo Humilde ---
        function updateQuality() {
            const isLow = perfCheck.checked;
            renderer.shadowMap.enabled = !isLow;
            renderer.setPixelRatio(isLow ? 1 : Math.min(window.devicePixelRatio, 2));
            document.getElementById('quality-indicator').textContent = isLow ? 'Modo Humilde' : 'Calidad Alta';

            scene.traverse(n => { 
                if(n.isMesh) { 
                    if (focoMesh && (n === focoMesh || focoMesh.children.includes(n))) return;
                    
                    n.castShadow = !isLow; 
                    n.receiveShadow = !isLow; 
                    if(n.material) n.material.needsUpdate = true; 
                }
            });

            localStorage.setItem('performanceMode', isLow);
            updateLighting(); 
        }

        perfCheck.checked = localStorage.getItem('performanceMode') === 'true';
        perfCheck.addEventListener('change', updateQuality);

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            effect.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight); 
        });

        // Configuración inicial de UI
        updateQuality();
        document.getElementById('settings-button').onclick = () => document.getElementById('settings-panel').classList.toggle('visible');
    </script>
</body>
</html>
