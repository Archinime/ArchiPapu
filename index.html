<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitación 3D - Vista Frontal Elevada y Lejana</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div id="info">🏠 Habitación interactiva (vista frontal, más arriba y más lejos)</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Configuración básica de la escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122); // Color de fondo oscuro

        // --- Cámara (frontal, mucho más arriba y más lejos) ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Vista frontal elevada y lejana: X=0 centrado, Y=8 altura, Z=18 distancia
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0); // Sigue mirando al centro de la habitación

        // --- Renderizador ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controles de órbita (punto de rotación centrado) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2; // Evita que la cámara baje del suelo
        controls.minDistance = 4;  // Un poco más de distancia mínima para no acercarse demasiado
        controls.maxDistance = 30;  // Aumentado para permitir alejarse aún más si se desea
        controls.target.set(0, 2, 0); // El centro de interés

        // --- LUCES MEJORADAS (más arriba y mayor rango) ---

        // Luz ambiental más brillante
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        // Luz direccional principal (más arriba)
        const directionalLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
        directionalLight.position.set(5, 15, 7);
        directionalLight.castShadow = true;
        directionalLight.receiveShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        const d = 10;
        directionalLight.shadow.camera.left = -d;
        directionalLight.shadow.camera.right = d;
        directionalLight.shadow.camera.top = d;
        directionalLight.shadow.camera.bottom = -d;
        directionalLight.shadow.camera.near = 2;
        directionalLight.shadow.camera.far = 20;
        directionalLight.shadow.bias = -0.0005;
        scene.add(directionalLight);

        // Luz de relleno desde atrás (más arriba y con distancia 30)
        const backLight = new THREE.PointLight(0x4466ff, 1.0);
        backLight.position.set(-3, 6, -3);
        backLight.distance = 30;
        scene.add(backLight);

        // Luz puntual cálida (más arriba y con distancia 25)
        const pointLight = new THREE.PointLight(0xffaa66, 1.5);
        pointLight.position.set(2, 6, 2);
        pointLight.distance = 25;
        scene.add(pointLight);

        // Foco desde el techo (más arriba, más ángulo y más distancia)
        const spotLight = new THREE.SpotLight(0xffffff, 1.8);
        spotLight.position.set(0, 10, 0);
        spotLight.target.position.set(0, 1, 0);
        scene.add(spotLight.target);
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        spotLight.angle = 1.0;
        spotLight.penumbra = 0.5;
        spotLight.decay = 1;
        spotLight.distance = 30;
        scene.add(spotLight);

        // Luz puntual adicional cerca de la silla (más arriba y más distancia)
        const sillaLight = new THREE.PointLight(0xffcc88, 1.2);
        sillaLight.position.set(1.5, 4, 1.5);
        sillaLight.distance = 15;
        scene.add(sillaLight);

        // --- Cargador de modelos GLB ---
        const loader = new GLTFLoader();

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    // Asegurar sombras
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                    scene.add(model);
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {
                    console.log(`${path} ${(xhr.loaded / xhr.total * 100).toFixed(0)}% cargado`);
                },
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                }
            );
        }

        // Lista completa de modelos
        const modelos = [
            'piso.glb',
            'alfombra.glb',
            'silla.glb',
            'paredes.glb',
            'cama.glb',
            'cortinas.glb',
            'tele.glb',
            'mueble1.glb',
            'mueble2.glb',
            'pc.glb',
            'decoracion_escritorio.glb',
            'decoracion_mueble_1.glb',
            'decoracion_mueble_2.glb',
            'poster_1.glb',
            'poster_2.glb',
            'poster_3.glb',
            'poster_4.glb',
            'interruptor.glb',
            'maouse_pad.glb',
            'lunari2.glb'
        ];

        // Cargar todos
        modelos.forEach(modelo => loadModel(modelo));

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('Página lista. Vista frontal, más arriba (Y=8) y más lejos (Z=18).');
    </script>
</body>
</html>
