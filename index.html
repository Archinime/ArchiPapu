<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Pro con Colisiones Corregidas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
        #settings-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 300;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
        }
        #settings-button:hover { transform: scale(1.1); }
        #settings-button:active { transform: scale(0.95); }
        
        #settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(30,30,40,0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 250;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: none;
            min-width: 200px;
        }
        #settings-panel.visible { display: block; }
        
        #settings-panel label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 10px;
        }
        #settings-panel input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            #settings-button { top: 10px; right: 10px; width: 40px; height: 40px; font-size: 22px; }
            #settings-panel { top: 60px; right: 10px; padding: 12px 15px; font-size: 13px; min-width: 180px; }
        }
        #loading, #light-status {
            position: absolute;
            bottom: 20px;
            color: white;
            background: rgba(0,0,0,0.5); 
            padding: 5px 10px; 
            border-radius: 10px;
            font-size: 12px; 
            z-index: 100; 
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #loading { right: 20px; }
        #light-status { left: 20px; }
    </style>
</head>
<body>
    <div id="settings-button">⚙️</div>
    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

        // --- Detección de dispositivo ---
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const width = window.innerWidth;
        let deviceType = (width < 768 || (isMobileUA && width < 1024)) ?
                         'mobile' : 
                         (width >= 768 && width <= 1024) ?
                         'tablet' : 'desktop';

        // --- Escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508); 

        // --- Cámara y Cámara Dummy (Fantasma) ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        const dummyCamera = camera.clone();
        
        // CORRECCIÓN DE POSICIÓN INICIAL: Un poco más atrás y abajo para evitar colisión inicial
        let camPosY = 5.5, camPosZ = 15, targetY = 4.5; 
        
        if (deviceType === 'mobile') { 
            camPosY = 5.5; camPosZ = 13; targetY = 4; 
        }
        
        // Posicionamos ambas cámaras al inicio
        dummyCamera.position.set(0, camPosY, camPosZ);
        camera.position.copy(dummyCamera.position);

        // --- RENDERIZADOR ---
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const effect = new OutlineEffect(renderer, {
            defaultThickness: 0.0008, 
            defaultColor: [0.05, 0.05, 0.08], 
            defaultAlpha: 0.85
        });

        // --- Controles acoplados a la dummyCamera ---
        const controls = new OrbitControls(dummyCamera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, targetY, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // No bajar del suelo
        controls.minDistance = 3.0; // Distancia mínima aumentada para evitar "atrapamientos"
        controls.maxDistance = 18;  
        controls.enablePan = false;

        // --- Raycaster para colisiones ---
        const cameraRaycaster = new THREE.Raycaster();
        const collidableObjects = []; 

        // --- LUCES ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambient);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const mainLight = new THREE.SpotLight(0xffeedd, 6);
        mainLight.position.set(2, 22, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(2048, 2048);
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);
        scene.add(mainLight.target);

        let lightOn = localStorage.getItem('lightState') !== 'off';

        // --- Carga de Modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'decoracion_2_mueble_1.glb', 'decoracion_3_mueble_1.glb', 'decoracion_4_mueble_1.glb',
            'decoracion_5_mueble_1.glb', 'decoracion_2_mueble_2.glb', 'decoracion_piso.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'techo.glb', 'base_foco.glb', 'lunari2.glb', 
            'foco.glb'
        ];

        let switchMesh = null, focoMesh = null;

        modelos.forEach(path => {
            loader.load(path, (gltf) => {
                const model = gltf.scene;
                
                model.traverse((node) => {
                    if (node.isMesh) {
                        if (path.includes('foco.glb')) {
                            focoMesh = model;
                            node.material.emissive = new THREE.Color(0xffeedd);
                            node.material.emissiveIntensity = lightOn ? 1.5 : 0;
                        } else {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            // Agregamos a colisiones, pero ignoramos interruptor y objetos muy pequeños que causen glitches
                            if (!path.includes('interruptor.glb') && !path.includes('decoracion')) {
                                collidableObjects.push(node);
                            }
                            if(node.material) {
                                node.material.side = THREE.DoubleSide;
                            }
                        }
                    }
                });
                scene.add(model);
                if (path.includes('interruptor.glb')) switchMesh = model;
                
                modelsLoaded++;
                document.getElementById('loading').innerText = `Cargando: ${modelsLoaded}/${modelos.length}`;
                if (modelsLoaded === modelos.length) document.getElementById('loading').style.display = 'none';
            });
        });

        // --- SISTEMA DE ILUMINACIÓN ---
        const perfCheck = document.getElementById('performance-mode');
        function updateLighting() {
            const isLow = perfCheck.checked;
            if (lightOn) {
                mainLight.visible = true;
                ambient.intensity = isLow ? 0.8 : 0.3;
                document.getElementById('light-status').innerText = '💡 Luz encendida';
                if (focoMesh) focoMesh.traverse(n => { if(n.isMesh) n.material.emissiveIntensity = 1.5; });
            } else {
                mainLight.visible = false;
                ambient.intensity = 0.05;
                document.getElementById('light-status').innerText = '💡 Luz apagada';
                if (focoMesh) focoMesh.traverse(n => { if(n.isMesh) n.material.emissiveIntensity = 0; });
            }
        }

        // --- Interacción ---
        const mouseRaycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        function handleInteraction(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;
            mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((y - rect.top) / rect.height) * 2 + 1;
            mouseRaycaster.setFromCamera(mouse, camera);
            if (switchMesh && mouseRaycaster.intersectObject(switchMesh, true).length > 0) {
                lightOn = !lightOn;
                localStorage.setItem('lightState', lightOn ? 'on' : 'off');
                updateLighting();
            }
        }
        renderer.domElement.addEventListener('click', handleInteraction);

        function updateQuality() {
            const isLow = perfCheck.checked;
            renderer.shadowMap.enabled = !isLow;
            renderer.setPixelRatio(isLow ? 1 : Math.min(window.devicePixelRatio, 2));
            document.getElementById('quality-indicator').textContent = isLow ? 'Modo Humilde' : 'Calidad Alta';
            localStorage.setItem('performanceMode', isLow);
            updateLighting(); 
        }
        perfCheck.addEventListener('change', updateQuality);

        // --- Animación con Lógica de Colisión Suavizada ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const target = controls.target;
            const desiredPos = dummyCamera.position.clone();
            const dir = new THREE.Vector3().subVectors(desiredPos, target);
            const maxDist = dir.length();
            dir.normalize();

            // Lanzamos rayo para chequear si hay algo entre el centro y la cámara
            cameraRaycaster.set(target, dir);
            cameraRaycaster.far = maxDist;

            const intersects = cameraRaycaster.intersectObjects(collidableObjects, false);

            if (intersects.length > 0) {
                // Si hay choque, colocamos la cámara un poco antes del punto de impacto
                const hitDist = intersects[0].distance - 0.5; 
                const safeDist = Math.max(controls.minDistance, hitDist);
                camera.position.copy(target).add(dir.multiplyScalar(safeDist));
            } else {
                // Si no hay choque, sigue a la cámara fantasma normalmente
                camera.position.copy(desiredPos);
            }
            
            camera.lookAt(target);
            effect.render(scene, camera);
        }
        
        perfCheck.checked = localStorage.getItem('performanceMode') === 'true';
        updateQuality();
        animate();

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h; camera.updateProjectionMatrix();
            dummyCamera.aspect = w / h; dummyCamera.updateProjectionMatrix();
            renderer.setSize(w, h); effect.setSize(w, h); 
        });

        document.getElementById('settings-button').onclick = () => document.getElementById('settings-panel').classList.toggle('visible');
    </script>
</body>
</html>
