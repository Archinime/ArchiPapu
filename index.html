<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Inventario y Lunari</title>
    <style>
        /* (los mismos estilos de antes, no los repito por brevedad, pero deben ir igual) */
        /* ... copiar los estilos exactos del bloque anterior ... */
    </style>
</head>
<body>
    <div id="coin-display">🪙 <span id="coin-amount">0</span></div>
    
    <div id="weather-status">🌍 Detectando clima...</div>
    
    <div id="inventory-button" class="top-btn" title="Inventario y Tienda">🎒</div>
    <div id="settings-button" class="top-btn" title="Ajustes">⚙️</div>

    <div id="settings-panel">
        <div id="quality-indicator">Calidad Alta</div>
        <label>
            <span>Modo humilde</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>

    <div id="character-layer">
        <div id="dialogue-box">
            <h3 class="char-name">Lunari</h3>
            <p id="dialogue-text">¡Hola!<br>Bienvenido de nuevo a casa.<br>¿Vemos un anime hoy?</p>
        </div>
    </div>

    <div id="inventory-modal">
        <div id="inv-header">
            <h2>🎒 Inventario y Tienda</h2>
            <button id="close-inv">✖</button>
        </div>
        <div id="inv-body">
            <div id="inv-sidebar"></div>
            <div id="inv-content"></div>
        </div>
    </div>

    <div id="poster-view-modal">
        <button id="close-poster-view">&times;</button>
        <img id="poster-enlarged-image" src="" alt="Póster">
    </div>

    <div id="loading">Preparando habitación...</div>
    <div id="light-status">💡 Luz encendida</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { defaultInventoryConfig, inventoryGroups } from './inventory-data.js';

        // --- Manejador global de errores para evitar que la página se rompa ---
        window.addEventListener('error', (event) => {
            console.error('Error global capturado:', event.error);
            // Mostrar un mensaje en la interfaz si es necesario, pero no interrumpir
            const loadingEl = document.getElementById('loading');
            if (loadingEl && loadingEl.style.display !== 'none') {
                loadingEl.innerText = 'Cargando... (con errores)';
            }
        });

        /************************************************************************
         * OPTIMIZACIONES PARA MÓVIL Y BAJA GAMA
         ************************************************************************/

        // --- Detección de dispositivo mejorada ---
        const ua = navigator.userAgent;
        const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        const width = window.innerWidth;
        const deviceType = (width < 768 || (isMobileUA && width < 1024)) ? 'mobile' : (width >= 768 && width <= 1024) ? 'tablet' : 'desktop';
        
        // Forzar modo humilde en móviles/tablets (el usuario podrá desactivarlo, pero recomendado)
        const isLowEndDevice = deviceType === 'mobile' || deviceType === 'tablet';
        
        // --- Sistema de datos e inventario (sin cambios) ---
        let playerCoins = parseInt(localStorage.getItem('room_coins')) || 1000;
        document.getElementById('coin-amount').innerText = playerCoins;

        let inventoryData = JSON.parse(localStorage.getItem('room_inventory')) || defaultInventoryConfig;
        if (inventoryData.base_foco) delete inventoryData.base_foco;
        
        for (let cat in defaultInventoryConfig) {
            if(!inventoryData[cat]) inventoryData[cat] = defaultInventoryConfig[cat];
            inventoryData[cat].emoji = defaultInventoryConfig[cat].emoji;
            inventoryData[cat].label = defaultInventoryConfig[cat].label;

            if (!inventoryData[cat].items[inventoryData[cat].equipped]) {
                inventoryData[cat].equipped = defaultInventoryConfig[cat].equipped;
            }

            for(let item in defaultInventoryConfig[cat].items) {
                if(!inventoryData[cat].items[item]) {
                    inventoryData[cat].items[item] = defaultInventoryConfig[cat].items[item];
                } else {
                    inventoryData[cat].items[item].file = defaultInventoryConfig[cat].items[item].file;
                    inventoryData[cat].items[item].name = defaultInventoryConfig[cat].items[item].name;
                    if(defaultInventoryConfig[cat].items[item].baseFile) {
                        inventoryData[cat].items[item].baseFile = defaultInventoryConfig[cat].items[item].baseFile;
                    }
                    if(defaultInventoryConfig[cat].items[item].preview) {
                        inventoryData[cat].items[item].preview = defaultInventoryConfig[cat].items[item].preview;
                    }
                }
            }
        }

        function saveGame() {
            localStorage.setItem('room_coins', playerCoins);
            localStorage.setItem('room_inventory', JSON.stringify(inventoryData));
            document.getElementById('coin-amount').innerText = playerCoins;
        }

        const loadedSlotMeshes = {};
        let switchMesh = null;
        let focoMesh = null;

        // --- Escena, cámara, reloj ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508); 
        const clock = new THREE.Clock();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 200);
        let camPosY = 6, camPosZ = 14, targetY = 6;
        if (deviceType === 'mobile') { camPosY = 6; camPosZ = 12; targetY = 5; }
        camera.position.set(0, camPosY, camPosZ);

        // --- Renderizador optimizado ---
        const renderer = new THREE.WebGLRenderer({ 
            antialias: !isLowEndDevice,          // Sin antialiasing en móvil
            powerPreference: isLowEndDevice ? "low-power" : "high-performance" 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Sombras: deshabilitadas completamente en móvil para mejorar rendimiento
        renderer.shadowMap.enabled = !isLowEndDevice;
        if (!isLowEndDevice) {
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.shadowMap.mapSize.width = 1024;  // Reducido de 2048
            renderer.shadowMap.mapSize.height = 1024;
        }
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.setPixelRatio(isLowEndDevice ? 1 : Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, targetY, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 2.5; 
        controls.maxDistance = 16;
        controls.enablePan = false;
        if (isLowEndDevice) {
            controls.enableDamping = false; // Desactivar damping en móvil para menos cálculos
        }

        // --- Luces optimizadas ---
        const ambient = new THREE.AmbientLight(0xffffff, isLowEndDevice ? 0.5 : 0.3);
        scene.add(ambient);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, isLowEndDevice ? 0.6 : 0.4);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        
        const mainLight = new THREE.SpotLight(0xffeedd, isLowEndDevice ? 4 : 6);
        mainLight.position.set(2, 22, 2); 
        mainLight.angle = Math.PI / 3; 
        mainLight.penumbra = 0.8; 
        mainLight.decay = 2; 
        mainLight.distance = 60;
        mainLight.castShadow = !isLowEndDevice;
        if (!isLowEndDevice) {
            mainLight.shadow.mapSize.set(1024, 1024);
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 40;
            mainLight.shadow.bias = -0.0001;
            mainLight.shadow.normalBias = 0.02;
            mainLight.shadow.radius = 4;
        }
        scene.add(mainLight);
        scene.add(mainLight.target);
        
        let lightOn = localStorage.getItem('lightState') !== 'off';
        const perfCheck = document.getElementById('performance-mode');
        // Inicializar checkbox según dispositivo
        perfCheck.checked = isLowEndDevice || localStorage.getItem('performanceMode') === 'true';

        // --- Función de materiales con lógica de calidad (más robusta)---
        function applyMaterialLogic(model, categoryKey) {
            if(!model) return;
            const isLow = perfCheck.checked;
            const isFoco = categoryKey === 'foco';
            
            model.traverse((node) => {
                if (node.isMesh) {
                    node.frustumCulled = false;
                    if (isFoco) {
                        node.castShadow = false; 
                        node.receiveShadow = false;
                        if (node.material) {
                            // Asegurar que material tenga propiedad emissive
                            if (!node.material.emissive) {
                                node.material.emissive = new THREE.Color(0x000000);
                            }
                            node.material.emissive.setHex(0xffeedd);
                            node.material.emissiveIntensity = lightOn ? 1.5 : 0;
                        }
                    } else {
                        node.castShadow = !isLow && !isLowEndDevice;
                        node.receiveShadow = !isLow && !isLowEndDevice;
                        if(node.material) {
                            node.material.shadowSide = THREE.FrontSide;
                            if(node.name.toLowerCase().includes('pared') || node.name.toLowerCase().includes('piso')) {
                                node.material.shadowSide = THREE.BackSide;
                            }
                            node.material.side = THREE.DoubleSide;
                            node.material.needsUpdate = true;
                        }
                    }
                    // Reducir calidad de texturas en móvil
                    if (isLowEndDevice && node.material && node.material.map) {
                        node.material.map.minFilter = THREE.LinearFilter;
                        node.material.map.magFilter = THREE.LinearFilter;
                    }
                }
            });
        }

        // --- Gestión de carga con timeout y contador robusto ---
        let totalModelsToLoad = 0;
        let modelsLoaded = 0;
        let loadingError = false;

        // Función para crear un modelo de respaldo para Lunari si falla la carga
        function createFallbackLunari() {
            const group = new THREE.Group();
            
            // Cuerpo (vestido)
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a90e2, emissive: 0x000000 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            
            // Cabeza
            const headGeo = new THREE.SphereGeometry(0.4, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.4;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);
            
            // Cabello (dos esferas aplanadas)
            const hairGeo = new THREE.SphereGeometry(0.45, 8);
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 1.65;
            hair.scale.set(1, 0.4, 1);
            hair.castShadow = true;
            group.add(hair);
            
            // Ojos
            const eyeGeo = new THREE.SphereGeometry(0.1, 6);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
            
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.15, 1.5, 0.35);
            group.add(eyeL);
            const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4), pupilMat);
            pupilL.position.set(-0.15, 1.5, 0.45);
            group.add(pupilL);
            
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.15, 1.5, 0.35);
            group.add(eyeR);
            const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 4), pupilMat);
            pupilR.position.set(0.15, 1.5, 0.45);
            group.add(pupilR);
            
            // Boca (pequeño cilindro)
            const mouthGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.2, 6);
            const mouthMat = new THREE.MeshStandardMaterial({ color: 0x883333 });
            const mouth = new THREE.Mesh(mouthGeo, mouthMat);
            mouth.position.set(0, 1.35, 0.4);
            mouth.rotation.x = Math.PI/2;
            mouth.scale.set(0.5, 0.5, 0.5);
            group.add(mouth);
            
            // Brazos (cilindros)
            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
            const armMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-0.6, 1.0, 0);
            armL.rotation.z = 0.3;
            armL.rotation.x = 0.2;
            armL.castShadow = true;
            group.add(armL);
            
            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(0.6, 1.0, 0);
            armR.rotation.z = -0.3;
            armR.rotation.x = -0.2;
            armR.castShadow = true;
            group.add(armR);
            
            group.position.set(0, 0, 0);
            group.scale.set(0.8, 0.8, 0.8);
            return group;
        }

        // --- Carga de Lunari con fallback ---
        function loadLunariWithFallback() {
            return new Promise((resolve) => {
                loader.load('lunari_durmiendo1.glb', 
                    (gltf) => {
                        console.log('Lunari cargado correctamente');
                        const model = gltf.scene;
                        applyMaterialLogic(model, 'lunari');
                        scene.add(model);
                        if (gltf.animations && gltf.animations.length > 0) {
                            lunariMixer = new THREE.AnimationMixer(model);
                            baseAction = lunariMixer.clipAction(gltf.animations[0]);
                            baseAction.play();
                            currentAction = baseAction;
                        }
                        resolve(model);
                    },
                    undefined,
                    (error) => {
                        console.warn('Error cargando Lunari, usando fallback', error);
                        const fallbackModel = createFallbackLunari();
                        scene.add(fallbackModel);
                        // Aplicar materiales
                        applyMaterialLogic(fallbackModel, 'lunari');
                        resolve(fallbackModel);
                    }
                );
            });
        }

        function loadLunariAnimWithFallback() {
            return new Promise((resolve) => {
                loader.load('Lunari_Duerme_2.glb',
                    (gltf) => {
                        console.log('Animación Lunari cargada');
                        if (gltf.animations && gltf.animations.length > 0 && lunariMixer) {
                            const clip = gltf.animations[0];
                            randomAction = lunariMixer.clipAction(clip);
                            randomAction.loop = THREE.LoopOnce;
                            randomAction.clampWhenFinished = true;
                        }
                        resolve();
                    },
                    undefined,
                    (error) => {
                        console.warn('Error cargando animación, se usará solo la animación base');
                        resolve(); // Resolvemos igual para no bloquear
                    }
                );
            });
        }

        // Ahora reemplazamos la carga directa por estas funciones con fallback
        // Ajustamos el contador total
        totalModelsToLoad = 0; // Reiniciamos para calcular bien
        for (let cat in inventoryData) {
            let equippedItemId = inventoryData[cat].equipped;
            if (inventoryData[cat].items && inventoryData[cat].items[equippedItemId]) {
                let itemData = inventoryData[cat].items[equippedItemId];
                if (itemData.file) totalModelsToLoad++;
                if (cat === 'foco' && itemData.baseFile) totalModelsToLoad++;
            }
        }
        totalModelsToLoad += 2; // Lunari y animación (aunque fallback no cuenta como carga de red, pero sumamos para control)
        totalModelsToLoad += 1; // Cuadro

        // Timeout global
        const loadingTimeout = setTimeout(() => {
            if (modelsLoaded < totalModelsToLoad) {
                console.warn('Timeout de carga, forzando ocultar loading');
                document.getElementById('loading').style.display = 'none';
            }
        }, 15000);

        function checkLoading() {
            modelsLoaded++;
            const loadingEl = document.getElementById('loading');
            if(loadingEl) {
                loadingEl.innerText = `Cargando: ${modelsLoaded}/${totalModelsToLoad}`;
                if (modelsLoaded >= totalModelsToLoad) {
                    clearTimeout(loadingTimeout);
                    loadingEl.style.display = 'none';
                }
            }
        }

        // --- Carga de modelos con secuencialidad en móvil ---
        const loader = new GLTFLoader();
        let lunariMixer = null;
        let baseAction = null;
        let randomAction = null;
        let currentAction = null;

        // Función para cargar modelos en serie (para móvil) o en paralelo (escritorio)
        const loadQueue = [];
        function queueLoad(url, onLoad, onError) {
            if (isLowEndDevice) {
                loadQueue.push({ url, onLoad, onError });
            } else {
                loader.load(url, onLoad, undefined, onError);
            }
        }

        // Procesar cola secuencialmente
        function processQueue() {
            if (loadQueue.length === 0) return;
            const next = loadQueue.shift();
            loader.load(next.url, (gltf) => {
                next.onLoad(gltf);
                processQueue(); // Siguiente
            }, undefined, (err) => {
                next.onError(err);
                processQueue();
            });
        }

        // Cargar Lunari con fallback (usando nuestra función)
        // En lugar de queueLoad, manejamos aparte porque queremos fallback
        if (isLowEndDevice) {
            // En móvil, cargamos Lunari primero y luego el resto
            loadLunariWithFallback().then(() => {
                checkLoading();
                return loadLunariAnimWithFallback();
            }).then(() => {
                checkLoading();
                // Luego procesamos el resto de la cola
                processQueue();
            }).catch(() => {
                // Ya hay fallback, pero incrementamos contadores
                checkLoading();
                checkLoading();
                processQueue();
            });
        } else {
            // Escritorio: carga paralela
            loadLunariWithFallback().then(checkLoading).catch(checkLoading);
            loadLunariAnimWithFallback().then(checkLoading).catch(checkLoading);
        }

        // El resto de modelos (suelo, paredes, etc.) los encolamos
        for (let cat in inventoryData) {
            let equippedItemId = inventoryData[cat].equipped;
            if (inventoryData[cat].items && inventoryData[cat].items[equippedItemId]) {
                let itemData = inventoryData[cat].items[equippedItemId];
                if (itemData.file) {
                    queueLoad(itemData.file, (gltf) => {
                        const model = gltf.scene;
                        applyMaterialLogic(model, cat);
                        if (cat === 'foco') {
                            focoMesh = model;
                            const box = new THREE.Box3().setFromObject(model);
                            const center = new THREE.Vector3(); box.getCenter(center);
                            mainLight.position.copy(center); mainLight.position.y -= 0.2;
                        }
                        if (cat === 'interruptor') switchMesh = model;
                        scene.add(model);
                        loadedSlotMeshes[cat] = model;
                        checkLoading();
                    }, (e) => {
                        console.error(`Error cargando ${cat}:`, e);
                        checkLoading();
                    });
                }
                if (cat === 'foco' && itemData.baseFile) {
                    queueLoad(itemData.baseFile, (gltf) => {
                        const model = gltf.scene;
                        applyMaterialLogic(model, 'base_foco');
                        scene.add(model);
                        loadedSlotMeshes['base_foco'] = model;
                        checkLoading();
                    }, (e) => {
                        console.error('Error cargando base_foco:', e);
                        checkLoading();
                    });
                }
            }
        }

        // --- Cuadro con video / imagen de respaldo (robusto) ---
        (async function setupWeatherVideo() {
            const video = document.createElement('video');
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.crossOrigin = 'anonymous';
            
            let videoFile = 'dia_soleado.mp4'; 
            let weatherEmoji = "☀️";
            let weatherName = "Clima estándar";
            let temperature = "--";
    
            const statusBox = document.getElementById('weather-status');

            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000 });
                });
                
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                
                const code = data.current_weather.weathercode;
                const isDay = data.current_weather.is_day;
                temperature = data.current_weather.temperature;
                
                if (code === 0) {
                    weatherName = isDay ? "Despejado" : "Noche despejada";
                    weatherEmoji = isDay ? "☀️" : "🌙";
                    videoFile = isDay ? 'dia_soleado.mp4' : 'noche_despejada.mp4';
                } else if (code === 1 || code === 2) {
                    weatherName = isDay ? "Parcialmente nublado" : "Noche algo nublada";
                    weatherEmoji = isDay ? "⛅" : "☁️";
                    videoFile = isDay ? 'dia_nublado.mp4' : 'noche_nublada.mp4';
                } else if (code === 3) {
                    weatherName = "Muy nublado";
                    weatherEmoji = "☁️";
                    videoFile = isDay ? 'dia_nublado.mp4' : 'noche_nublada.mp4';
                } else if (code === 45 || code === 48) {
                    weatherName = "Niebla";
                    weatherEmoji = "🌫️";
                    videoFile = isDay ? 'dia_niebla.mp4' : 'noche_niebla.mp4';
                } else if ([51,53,55,56,57].includes(code)) {
                    weatherName = "Llovizna";
                    weatherEmoji = isDay ? "🌦️" : "🌧️";
                    videoFile = isDay ? 'dia_lluvia.mp4' : 'noche_lluvia.mp4';
                } else if ([61,63,65,66,67].includes(code)) {
                    weatherName = "Lluvia";
                    weatherEmoji = "🌧️";
                    videoFile = isDay ? 'dia_lluvia.mp4' : 'noche_lluvia.mp4';
                } else if ([71,73,75,77].includes(code)) {
                    weatherName = "Nieve";
                    weatherEmoji = "❄️";
                    videoFile = isDay ? 'dia_nieve.mp4' : 'noche_nieve.mp4';
                } else if ([80,81,82].includes(code)) {
                    weatherName = "Aguaceros";
                    weatherEmoji = "🌧️";
                    videoFile = isDay ? 'dia_lluvia.mp4' : 'noche_lluvia.mp4';
                } else if ([85,86].includes(code)) {
                    weatherName = "Chubascos de nieve";
                    weatherEmoji = "🌨️";
                    videoFile = isDay ? 'dia_nieve.mp4' : 'noche_nieve.mp4';
                } else if ([95,96,99].includes(code)) {
                    weatherName = "Tormenta";
                    weatherEmoji = "⛈️";
                    videoFile = isDay ? 'dia_tormenta.mp4' : 'noche_tormenta.mp4';
                } else {
                    weatherName = "Desconocido";
                    videoFile = isDay ? 'dia_soleado.mp4' : 'noche_despejada.mp4';
                }

            } catch (error) {
                console.warn('Error con el clima, usando defecto:', error);
                weatherEmoji = "❌";
                weatherName = "Clima offline";
            }

            if (temperature !== "--") {
                statusBox.innerHTML = `${weatherEmoji} ${weatherName} | ${temperature}°C`;
            } else {
                statusBox.innerHTML = `${weatherEmoji} ${weatherName}`;
            }

            // Fallback: si el video no puede cargarse, usar una imagen estática
            let texture;
            let textureApplied = false;

            function applyTextureToCuadro(tex) {
                if (textureApplied) return;
                textureApplied = true;
                // Cargar el modelo del cuadro (solo una vez)
                loader.load('cuadro.glb', (gltf) => {
                    const cuadroModel = gltf.scene;
                    cuadroModel.traverse((node) => {
                        if (node.isMesh) {
                            if (Array.isArray(node.material)) {
                                node.material.forEach(mat => {
                                    mat.map = tex;
                                    mat.needsUpdate = true;
                                });
                            } else if (node.material) {
                                node.material.map = tex;
                                node.material.needsUpdate = true;
                            }
                        }
                    });
                    applyMaterialLogic(cuadroModel, 'cuadro');
                    scene.add(cuadroModel);
                    loadedSlotMeshes['cuadro'] = cuadroModel;
                    checkLoading();
                }, undefined, (e) => {
                    console.error('Error cargando cuadro:', e);
                    checkLoading();
                });
            }

            video.addEventListener('error', () => {
                console.warn('No se pudo cargar el video, usando imagen estática');
                const img = new Image();
                img.src = 'dia_soleado.jpg'; // imagen por defecto
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    texture = new THREE.CanvasTexture(canvas);
                    applyTextureToCuadro(texture);
                };
            });

            video.src = videoFile;
            video.load();
            video.play().catch(e => {
                console.log('Autoplay bloqueado, usando imagen');
                const img = new Image();
                img.src = 'dia_soleado.jpg';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    texture = new THREE.CanvasTexture(canvas);
                    applyTextureToCuadro(texture);
                };
            });

            // Si el video se carga correctamente, usar videoTexture
            video.addEventListener('canplay', () => {
                const videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                videoTexture.format = THREE.RGBAFormat;
                videoTexture.encoding = THREE.sRGBEncoding;
                applyTextureToCuadro(videoTexture);
            });
        })();

        // --- Iluminación ---
        function updateLighting() {
            const isLow = perfCheck.checked;
            if (lightOn) {
                mainLight.visible = true;
                ambient.intensity = isLow ? 0.8 : 0.3;
                hemiLight.intensity = isLow ? 0.8 : 0.4;
                document.getElementById('light-status').innerText = '💡 Luz encendida';
                if (focoMesh) focoMesh.traverse((n) => { if (n.isMesh && n.material) n.material.emissiveIntensity = 1.5; });
            } else {
                mainLight.visible = false;
                ambient.intensity = 0.02;
                hemiLight.intensity = 0.05; 
                document.getElementById('light-status').innerText = '💡 Luz apagada';
                if (focoMesh) focoMesh.traverse((n) => { if (n.isMesh && n.material) n.material.emissiveIntensity = 0; });
            }
        }

        // --- Raycaster e interacción ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let lastClick = 0;
        
        function toggleLight() {
            lightOn = !lightOn;
            localStorage.setItem('lightState', lightOn ? 'on' : 'off'); 
            updateLighting();
        }

        function handleInteraction(event) {
            // Debounce para evitar múltiples disparos
            const now = Date.now();
            if (now - lastClick < 300) return;
            lastClick = now;

            const rect = renderer.domElement.getBoundingClientRect();
            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;
            mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((y - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            if (switchMesh && raycaster.intersectObject(switchMesh, true).length > 0) {
                toggleLight();
                return; 
            }

            const posterCategories = ['poster_1', 'poster_2', 'poster_3', 'poster_4'];
            for (let cat of posterCategories) {
                const posterMesh = loadedSlotMeshes[cat];
                if (posterMesh) {
                    const intersects = raycaster.intersectObject(posterMesh, true);
                    if (intersects.length > 0) {
                        openPosterPreview(cat);
                        break;
                    }
                }
            }
        }
        
        renderer.domElement.addEventListener('click', handleInteraction);
        renderer.domElement.addEventListener('touchstart', (e) => { 
            if(document.getElementById('inventory-modal').classList.contains('visible')) return;
            handleInteraction(e); 
        }, {passive: true});
        
        // --- Calidad / Modo humilde ---
        function updateQuality() {
            const isLow = perfCheck.checked;
            renderer.shadowMap.enabled = !isLow && !isLowEndDevice; // En móvil siempre false
            renderer.setPixelRatio(isLow ? 1 : Math.min(window.devicePixelRatio, 2));
            document.getElementById('quality-indicator').textContent = isLow ? 'Modo Humilde' : 'Calidad Alta';
            for (let cat in loadedSlotMeshes) {
                applyMaterialLogic(loadedSlotMeshes[cat], cat);
            }
            
            localStorage.setItem('performanceMode', isLow);
            updateLighting(); 
        }
        perfCheck.addEventListener('change', updateQuality);
        
        // --- Inventario (sin cambios funcionales) ---
        let currentCategory = 'cama';
        let openGroup = 'muebles';

        function renderInventory() {
            const sidebar = document.getElementById('inv-sidebar');
            const content = document.getElementById('inv-content');
            sidebar.innerHTML = ''; content.innerHTML = '';
            
            inventoryGroups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'inv-group';

                const groupBtn = document.createElement('button');
                groupBtn.className = 'group-btn';
                groupBtn.innerHTML = `<span>${group.emoji} ${group.label}</span> <span style="transition:0.3s; transform: ${openGroup === group.id ? 'rotate(90deg)' : 'rotate(0deg)'}">▶</span>`;
                groupBtn.onclick = () => {
                    openGroup = openGroup === group.id ? null : group.id;
                    renderInventory();
                };
           
                groupDiv.appendChild(groupBtn);

                const groupContent = document.createElement('div');
                groupContent.className = `group-content ${openGroup === group.id ? 'open' : ''}`;

                group.categories.forEach(catKey => {
                    const catData = inventoryData[catKey];
                    if(!catData) return;
                    
                    const btn = document.createElement('button');
                    btn.className = `cat-btn ${catKey === currentCategory ? 'active' : ''}`;
                    btn.innerHTML = `<span class="cat-icon-emoji">${catData.emoji}</span> <span>${catData.label}</span>`;
                    btn.onclick = () => { currentCategory = catKey; renderInventory(); };
                    groupContent.appendChild(btn);
                });

                groupDiv.appendChild(groupContent);
                sidebar.appendChild(groupDiv);
            });

            const catData = inventoryData[currentCategory];
            if (!catData) return;
            
            for (let itemId in catData.items) {
                const item = catData.items[itemId];
                const isEquipped = catData.equipped === itemId;
                
                const card = document.createElement('div');
                card.className = 'item-card';

                const previewDiv = document.createElement('div');
                previewDiv.className = 'item-preview';
                if (item.preview) {
                    const img = document.createElement('img');
                    img.src = item.preview;
                    img.alt = item.name;
                    img.onerror = () => { previewDiv.innerHTML = `<span>${catData.emoji}</span>`; };
                    previewDiv.appendChild(img);
                } else {
                    previewDiv.innerHTML = `<span>${catData.emoji}</span>`;
                }
                
                let btnHTML = '';
                if (isEquipped) {
                    btnHTML = `<button class="item-btn btn-equipped" disabled>Equipado ✓</button>`;
                } else if (item.owned) {
                    btnHTML = `<button class="item-btn btn-equip" data-id="${itemId}">Equipar</button>`;
                } else {
                    btnHTML = `<button class="item-btn btn-buy" data-id="${itemId}">Comprar 🪙${item.price}</button>`;
                }

                card.innerHTML = `
                    <div>
                        ${previewDiv.outerHTML}
                        <h4>${item.name}</h4>
                        <div class="item-price">${item.owned ? 'Adquirido' : `🪙 ${item.price}`}</div>
                    </div>
                    ${btnHTML}
                `;
                const previewContainer = card.querySelector('.item-preview');
                if (previewContainer && item.preview) {
                    previewContainer.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = item.preview;
                    img.alt = item.name;
                    img.onerror = () => { previewContainer.innerHTML = `<span>${catData.emoji}</span>`; };
                    previewContainer.appendChild(img);
                }
                
                content.appendChild(card);
            }

            document.querySelectorAll('.btn-equip').forEach(b => {
                b.onclick = (e) => equipItem(currentCategory, e.target.getAttribute('data-id'));
            });
            document.querySelectorAll('.btn-buy').forEach(b => {
                b.onclick = (e) => buyItem(currentCategory, e.target.getAttribute('data-id'));
            });
        }

        function equipItem(category, itemId) {
            inventoryData[category].equipped = itemId;
            saveGame();
            renderInventory(); 
            
            const itemData = inventoryData[category].items[itemId];
            loadItemForSlot(category, itemData.file, false);

            if (category === 'foco' && itemData.baseFile) {
                loadItemForSlot('base_foco', itemData.baseFile, false);
            }
        }

        function buyItem(category, itemId) {
            let item = inventoryData[category].items[itemId];
            if (playerCoins >= item.price) {
                playerCoins -= item.price;
                item.owned = true;
                saveGame();
                renderInventory();
            } else {
                alert("No tienes suficientes monedas.");
            }
        }

        // --- Eventos UI ---
        document.getElementById('inventory-button').onclick = () => {
            document.getElementById('inventory-modal').classList.add('visible');
            renderInventory();
        };
        document.getElementById('close-inv').onclick = () => {
            document.getElementById('inventory-modal').classList.remove('visible');
        };
        document.getElementById('settings-button').onclick = () => {
            document.getElementById('settings-panel').classList.toggle('visible');
        };

        // --- Posters ---
        const posterViewModal = document.getElementById('poster-view-modal');
        const posterEnlargedImage = document.getElementById('poster-enlarged-image');
        const closePosterBtn = document.getElementById('close-poster-view');

        function openPosterPreview(categoryKey) {
            const equippedId = inventoryData[categoryKey].equipped;
            const itemData = inventoryData[categoryKey].items[equippedId];
            if (itemData && itemData.preview) {
                posterEnlargedImage.src = itemData.preview;
                posterViewModal.classList.add('visible');
            }
        }

        closePosterBtn.onclick = () => posterViewModal.classList.remove('visible');
        posterViewModal.onclick = (e) => { 
            if (e.target === posterViewModal) posterViewModal.classList.remove('visible');
        };

        // --- Animación con throttling de FPS en móvil ---
        let lastFrameTime = 0;
        const fpsLimit = isLowEndDevice ? 30 : 60;
        const frameInterval = 1000 / fpsLimit;

        function animate(time) {
            requestAnimationFrame(animate);
            
            if (isLowEndDevice) {
                if (time - lastFrameTime < frameInterval) return;
                lastFrameTime = time;
            }

            const delta = clock.getDelta();
            if (lunariMixer) lunariMixer.update(delta);

            controls.update();
            renderer.render(scene, camera); 
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        updateQuality();
    </script>
</body>
</html>
