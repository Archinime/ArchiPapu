<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport para correcto escalado en móviles y evitar zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitación 3D - Configuración de Calidad</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #settings {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 200;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto;
            /* Asegurar que sea táctil en móviles */
            -webkit-tap-highlight-color: transparent;
        }
        #settings label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        #settings input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #quality-indicator {
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        @media (max-width: 600px) {
            #info {
                font-size: 12px;
                top: 10px;
                left: 10px;
                padding: 5px 10px;
            }
            #settings {
                padding: 10px 15px;
                font-size: 12px;
                gap: 8px;
                top: 10px;
                right: 10px;
            }
            #settings input[type="checkbox"] {
                width: 24px;
                height: 24px;
            }
        }
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        /* Para móviles, agrandar área táctil si es necesario */
        @media (hover: none) and (pointer: coarse) {
            #settings label {
                padding: 5px 0;
            }
        }
    </style>
</head>
<body>
    <div id="info">🏠 Habitación interactiva</div>
    <div id="settings">
        <span id="quality-indicator">Calidad Alta</span>
        <label>
            <span>Modo rendimiento</span>
            <input type="checkbox" id="performance-mode">
        </label>
    </div>
    <div id="loading">Cargando modelos...</div>

    <!-- Importamos Three.js y OrbitControls desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Variables globales ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controles (se configurarán después según el modo)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.minAzimuthAngle = -Math.PI / 6;
        controls.maxAzimuthAngle = Math.PI / 6;
        controls.minDistance = 4;
        controls.maxDistance = 30;
        controls.target.set(0, 2, 0);

        // Contenedores para las luces (para poder eliminarlas al cambiar de modo)
        let currentLights = [];

        // --- Funciones de configuración de calidad ---
        function setupHighQuality() {
            // Eliminar luces anteriores
            currentLights.forEach(light => {
                if (light.target) scene.remove(light.target);
                scene.remove(light);
            });
            currentLights = [];

            // Renderer
            renderer.shadowMap.enabled = true;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));

            // Controles
            controls.enableDamping = true;
            controls.maxDistance = 30;

            // --- Luces de alta calidad (con sombras) ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            currentLights.push(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
            directionalLight.position.set(5, 15, 7);
            directionalLight.castShadow = true;
            directionalLight.receiveShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            const d = 10;
            directionalLight.shadow.camera.left = -d;
            directionalLight.shadow.camera.right = d;
            directionalLight.shadow.camera.top = d;
            directionalLight.shadow.camera.bottom = -d;
            directionalLight.shadow.camera.near = 2;
            directionalLight.shadow.camera.far = 20;
            directionalLight.shadow.bias = -0.0005;
            scene.add(directionalLight);
            currentLights.push(directionalLight);

            const backLight = new THREE.PointLight(0x4466ff, 1.0);
            backLight.position.set(-3, 6, -3);
            backLight.distance = 30;
            scene.add(backLight);
            currentLights.push(backLight);

            const pointLight = new THREE.PointLight(0xffaa66, 1.5);
            pointLight.position.set(2, 6, 2);
            pointLight.distance = 25;
            scene.add(pointLight);
            currentLights.push(pointLight);

            const spotLight = new THREE.SpotLight(0xffffff, 1.8);
            spotLight.position.set(0, 10, 0);
            spotLight.target.position.set(0, 1, 0);
            scene.add(spotLight.target);
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            spotLight.angle = 1.0;
            spotLight.penumbra = 0.5;
            spotLight.decay = 1;
            spotLight.distance = 30;
            scene.add(spotLight);
            currentLights.push(spotLight);
            currentLights.push(spotLight.target); // para eliminar target después

            const sillaLight = new THREE.PointLight(0xffcc88, 1.2);
            sillaLight.position.set(1.5, 4, 1.5);
            sillaLight.distance = 15;
            scene.add(sillaLight);
            currentLights.push(sillaLight);

            // Actualizar sombras en modelos (si ya están cargados)
            scene.traverse(node => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });

            document.getElementById('quality-indicator').textContent = 'Calidad Alta';
        }

        function setupLowQuality() {
            // Eliminar luces anteriores
            currentLights.forEach(light => {
                if (light.target) scene.remove(light.target);
                scene.remove(light);
            });
            currentLights = [];

            // Renderer: sin sombras, pixel ratio bajo
            renderer.shadowMap.enabled = false;
            renderer.setPixelRatio(1);

            // Controles: sin damping, menor distancia máxima
            controls.enableDamping = false;
            controls.maxDistance = 18;

            // --- Luces de baja calidad (mínimas, sin sombras) ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
            scene.add(ambientLight);
            currentLights.push(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);
            currentLights.push(dirLight);

            const fillLight = new THREE.PointLight(0x4466aa, 0.6);
            fillLight.position.set(-2, 3, 2);
            scene.add(fillLight);
            currentLights.push(fillLight);

            // Desactivar sombras en modelos
            scene.traverse(node => {
                if (node.isMesh) {
                    node.castShadow = false;
                    node.receiveShadow = false;
                }
            });

            document.getElementById('quality-indicator').textContent = 'Modo Rendimiento';
        }

        // --- Inicializar con alta calidad ---
        setupHighQuality();

        // --- Evento del checkbox (funciona en móvil y desktop) ---
        const perfCheck = document.getElementById('performance-mode');
        perfCheck.addEventListener('change', (e) => {
            if (e.target.checked) {
                setupLowQuality();
            } else {
                setupHighQuality();
            }
        });

        // --- Cargador de modelos ---
        const loader = new GLTFLoader();
        let modelsLoaded = 0;
        const totalModels = 20; // Ajusta según tu lista

        function updateLoading() {
            document.getElementById('loading').innerText = `Cargando modelos: ${modelsLoaded}/${totalModels}`;
            if (modelsLoaded === totalModels) {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function loadModel(path) {
            loader.load(
                path,
                (gltf) => {
                    const model = gltf.scene;
                    // Las sombras se activan/desactivan según el modo actual (ya se aplicó en setup)
                    // Pero aseguramos que los nuevos modelos hereden el estado actual
                    const currentShadowState = renderer.shadowMap.enabled;
                    model.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = currentShadowState;
                            node.receiveShadow = currentShadowState;
                        }
                    });
                    scene.add(model);
                    modelsLoaded++;
                    updateLoading();
                    console.log(`✅ Modelo cargado: ${path}`);
                },
                (xhr) => {},
                (error) => {
                    console.error(`❌ Error al cargar ${path}:`, error);
                    modelsLoaded++;
                    updateLoading();
                }
            );
        }

        // Lista de modelos (ajústala según tus archivos)
        const modelos = [
            'piso.glb', 'alfombra.glb', 'silla.glb', 'paredes.glb', 'cama.glb',
            'cortinas.glb', 'tele.glb', 'mueble1.glb', 'mueble2.glb', 'pc.glb',
            'decoracion_escritorio.glb', 'decoracion_mueble_1.glb', 'decoracion_mueble_2.glb',
            'poster_1.glb', 'poster_2.glb', 'poster_3.glb', 'poster_4.glb',
            'interruptor.glb', 'maouse_pad.glb', 'lunari2.glb'
        ];

        modelos.forEach(modelo => loadModel(modelo));

        // --- Animación ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Solo hace algo si damping está activado
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize (maneja cambios de orientación) ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Prevenir scroll táctil en el canvas ---
        document.body.addEventListener('touchstart', (e) => {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });

        console.log('Página cargada. Usa el interruptor para cambiar calidad. Funciona en móviles.');
    </script>
</body>
</html>
